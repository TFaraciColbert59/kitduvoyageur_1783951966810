name: iOS Capacitor Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Mask Capacitor server URL in logs
        run: echo "::add-mask::${{ secrets.CAPACITOR_SERVER_URL }}"

      - name: Capacitor sync
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
        run: npx cap sync ios

      - name: Verify Capacitor server.url (no secret leak)
        run: |
          CONFIG="ios/App/App/capacitor.config.json"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::capacitor.config.json introuvable"
            exit 1
          fi
          # Check only the KEY presence; the value is never printed.
          if grep -q '"url"' "$CONFIG"; then
            echo "server.url: present in embedded Capacitor config"
          else
            echo "::warning::server.url: MISSING - the app will load the local shell instead of the backend"
          fi

      - name: List Xcode schemes
        working-directory: ios/App
        run: xcodebuild -list

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r LKDV-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LKDV-iOS
          path: LKDV-ios-unsigned.ipa
