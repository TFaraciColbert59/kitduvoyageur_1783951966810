name: LKDV Unified Quality Gates

on:
  push:
    branches: [main, 'chantier/**', 'audit/**']
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — TypeScript Check
        run: npm run type-check

      - name: Gate 2 — ESLint Analysis
        run: npm run lint

      - name: Gate 2.5 — Design Governance Guardrails (U-D60 -> U-D64)
        run: npx vitest run tests/design/unification.spec.ts

      - name: Gate 3 — Unit & Integration Test Suite
        run: npm test

      - name: Gate 4 — Next.js Production Build
        run: npm run build
        env:
          # Build CI : JAMAIS la production. Placeholder documenté par défaut ;
          # remplacé automatiquement par le projet de test si les secrets existent.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL || 'https://ci-build-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaS1idWlsZC1wbGFjZWhvbGRlciIsInJvbGUiOiJhbm9uIiwiaWF0IjowfQ.cGxhY2Vob2xkZXI' }}

      # ── Portes dépendant d'une base Supabase (opt-in via variable de dépôt) ──
      # Pour les activer : définir la variable de dépôt LKDV_E2E_ENABLED=true et
      # les secrets SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY (projet de test).
      # Sans base de test, ces portes échouent par construction : elles restent
      # donc conditionnelles pour garder la CI des invariants de code verte.

      - name: Install Playwright Browsers
        if: ${{ vars.LKDV_E2E_ENABLED == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Gate 5 — End-to-End Playwright Suite
        if: ${{ vars.LKDV_E2E_ENABLED == 'true' }}
        run: npx playwright test scripts/e2e/voyage.spec.ts scripts/e2e/adventure-intelligence.spec.ts scripts/e2e/a13-journey.spec.ts
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          # A13 (S9) : utilisateur E2E créé/nettoyé via l'API admin du projet
          # de TEST. Absent ⇒ le scénario A13 est ignoré (jamais la prod).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}

      # ── Chantier Y (Y0.6) — portes additionnelles ──

      - name: Gate 0 — Invariants anti-dérive
        run: node scripts/verify/ci_invariants.mjs

      - name: Gate 0.1 — Icônes canoniques (noms résolus)
        run: npm run verify:icons

      - name: Gate G6 — Accessibilité axe (zéro critical/serious)
        if: ${{ vars.LKDV_E2E_ENABLED == 'true' }}
        run: npm run test:a11y
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}

    # Gate G5 — Régression visuelle : job séparé, rapport en artefact téléchargeable.
    # Même opt-in que Gate 5/G6 (base de test requise pour rendre les pages).
  visual-gates:
    if: ${{ vars.LKDV_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Gate G5 — Régression visuelle (références commitées)
        run: npx playwright test --config=playwright.visual.config.ts
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}

      - name: Upload rapport visuel (artefact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-report
          path: playwright-report/
          retention-days: 14

  # Audit #39 — suites pgTAP + migrations sur une base de test dédiée.
  # Opt-in : variable de dépôt LKDV_DB_TESTS_ENABLED=true + secret LKDV_TEST_DATABASE_URL.
  database-gates:
    if: ${{ vars.LKDV_DB_TESTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Gate DB.1 — Migrations additives sur base de test
        run: npx --yes supabase@2 db push --db-url "${{ secrets.LKDV_TEST_DATABASE_URL }}"

      - name: Gate DB.2 — Suites pgTAP
        run: npx --yes supabase@2 test db --db-url "${{ secrets.LKDV_TEST_DATABASE_URL }}"
