name: LKDV Autonomy Bootstrap Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lkdv-autonomy-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-bootstrap:
    name: autonomy-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate persistent task registry
        run: node scripts/autonomy/validate-registry.mjs

      - name: Validate shell syntax
        run: bash -n scripts/autonomy/run-cycle.sh scripts/autonomy/supervise.sh

      - name: Verify budget and safety gates remain fail-closed
        shell: bash
        run: |
          grep -F 'LKDV_PROVIDER_BUDGET_CONFIRMED' scripts/autonomy/run-cycle.sh
          grep -F 'LKDV_AUTONOMY_ENABLE' scripts/autonomy/run-cycle.sh
          grep -F 'production_migrations_auto_apply: false' docs/autonomy/POLICY.yml
