<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8CC3EA">
<meta name="color-scheme" content="light">
<title>Kit Studio</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Encres et teintes du design system LKDV (communauté) */
  --ink:#172B24;--ink-2:#56665D;--ink-3:#8A968F;
  --forest:#17402C;--green:#3A7A52;
  --action:#17402C;--action-ink:#FFFFFF;--sage-soft:#DCE9DD;
  --info:#4B6B7C;--warn:#C89A3B;--warn-ink:#765014;--danger:#A8443A;--ok:#3A7A52;
  /* Tiroir Communauté : demi-tiroir clair */
  --sheet:rgba(250,249,245,.96);
  --sheet-rim:inset 0 1px 0 rgba(255,255,255,.95),0 -12px 40px rgba(23,43,36,.18);
  /* Liquid Glass LKDV (liquid-selectors.css) */
  --lg-ga:.19;--lg-gb:7px;
  --lg-bar-bg:linear-gradient(180deg,rgba(255,255,255,calc(var(--lg-ga) + .3)),rgba(255,255,255,calc(var(--lg-ga) + .14)) 55%,rgba(255,255,255,calc(var(--lg-ga) + .22)));
  --lg-bar-blur:blur(var(--lg-gb)) saturate(1.9) brightness(1.07);
  --lg-bar-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.45),inset 1px 0 1px rgba(255,255,255,.28),inset -1px 0 1px rgba(255,255,255,.28),inset 0 0 12px rgba(255,255,255,.14),0 0 0 .5px rgba(23,43,36,.14),0 8px 22px rgba(23,43,36,.12);
  --lg-thumb-bg:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.26));
  --lg-thumb-shadow:inset 0 1px 0 #fff,inset 0 -1px 1px rgba(255,255,255,.5),0 0 0 .5px rgba(23,43,36,.07),0 2px 8px rgba(23,43,36,.08);
  --lg-drop-bg:rgba(255,255,255,.08);
  --lg-drop-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 2px rgba(255,255,255,.6),inset 2px 0 2px rgba(255,120,160,.18),inset -2px 0 2px rgba(90,170,255,.2),0 0 0 .5px rgba(23,43,36,.1),0 10px 26px rgba(23,43,36,.2);
  --lg-ink:#172b24;--lg-on:#17402c;
  --tile:var(--lg-bar-bg);--tile-rim:var(--lg-bar-shadow);
  --well:rgba(23,64,44,.06);--hair:rgba(23,43,36,.12);--scrim:rgba(16,28,23,.18);
  --ease:cubic-bezier(.16,1,.3,1);--sheet-ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#A7D2EE;color:var(--ink);font-family:var(--sf);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;letter-spacing:-.01em}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
#app{position:fixed;inset:0;overflow:hidden;background:#E9EFE8}

/* Retour « Mon matériel » (simulé) */
.home{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.homecard{width:min(80vw,310px);padding:16px;border:0;border-radius:28px;background:var(--sheet);box-shadow:var(--sheet-rim);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);display:grid;grid-template-columns:56px 1fr;column-gap:14px;align-items:center;text-align:left;cursor:pointer;opacity:0;transform:scale(.9);transition:opacity .3s,transform .45s var(--spring);pointer-events:none}
.home.on .homecard{opacity:1;transform:none;pointer-events:auto;transition-delay:.12s}
.homecard .hb{grid-row:1/3;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg,#3A7A52,#17402C);color:#fff}
.homecard .hb svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.homecard .hn{font:600 17px/1.2 var(--sf);align-self:end}
.homecard .hk{font:500 13px/1.3 var(--sf);color:var(--ink-2);font-variant-numeric:tabular-nums;align-self:start;margin-top:2px}

.stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#5FA2DA 0%,#A7D2EE 48%,#E2F0F2 62%,#9CC468 63%,#6E9E45 100%);transform-origin:50% 56%;transition:transform .5s var(--sheet-ease),opacity .4s ease,border-radius .5s var(--sheet-ease);will-change:transform}
.stage.drag{transition:none}
.stage.out{transform:scale(.34) translateY(12%);opacity:0;border-radius:48px;pointer-events:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene:focus-visible{outline:2px solid var(--action);outline-offset:-8px;border-radius:36px}

/* Island */
.top{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:center;pointer-events:none;z-index:20}
.island{pointer-events:auto;touch-action:none;height:44px;padding:0 16px 0 12px;border:0;border-radius:999px;background:var(--lg-bar-bg);-webkit-backdrop-filter:var(--lg-bar-blur);backdrop-filter:var(--lg-bar-blur);color:var(--lg-on);display:flex;align-items:center;gap:8px;font:600 15px/1 var(--sf);font-variant-numeric:tabular-nums;letter-spacing:-.01em;box-shadow:var(--lg-bar-shadow);cursor:pointer;transition:transform .32s var(--spring),box-shadow .2s}
.island:active{transform:scale(1.05);box-shadow:var(--lg-drop-shadow)}
.island .ring{width:20px;height:20px;transform:rotate(-90deg);flex:none}
.ring-bg{fill:none;stroke:rgba(23,64,44,.14);stroke-width:2.6}
.ring-fg{fill:none;stroke:var(--green);stroke-width:2.6;stroke-linecap:round;transition:stroke-dasharray .5s var(--ease),stroke .3s}
.iname,.idelta{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .42s var(--ease),opacity .25s}
.island.named .iname{max-width:220px;opacity:1}
.island.named .ikg{color:var(--ink-2)}
.idelta.on{max-width:90px;opacity:1}
.idelta{font-size:13px;color:var(--ink-2)}
.idelta.down{color:var(--green)}
.iflag{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--warn-ink)}
.iflag[hidden]{display:none}
.iflag i{width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* HUD éphémère */
.hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);text-align:center;pointer-events:none;z-index:15;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .3s var(--ease)}
.hud.on{opacity:1;transform:none}
.hud span{display:block;width:max-content;max-width:86vw;margin:0 auto;padding:7px 14px;border-radius:999px;background:var(--lg-bar-bg);-webkit-backdrop-filter:var(--lg-bar-blur);backdrop-filter:var(--lg-bar-blur);box-shadow:var(--lg-bar-shadow);font:600 15px/1.2 var(--sf);letter-spacing:-.015em;color:var(--lg-on)}
.hud span:empty{display:none}
.hud small{display:block;margin:6px auto 0;max-width:300px;font:600 13px/1.35 var(--sf);color:var(--ink);text-shadow:0 0 6px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9);font-variant-numeric:tabular-nums}

/* Aperçu d'objet */
.peek{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--lift,186px));transform:translate(-50%,6px);max-width:min(88vw,340px);padding:10px 14px;border-radius:20px;background:var(--sheet);box-shadow:var(--sheet-rim);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);z-index:22;pointer-events:none;opacity:0;transition:opacity .2s,transform .3s var(--ease);text-align:center}
.peek.on{opacity:1;transform:translate(-50%,0)}
.peek span{display:block;font:600 15px/1.25 var(--sf)}
.peek small{display:block;margin-top:3px;font:500 12.5px/1.35 var(--sf);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* Bas : points de zone, poignée, rail */
.bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20;pointer-events:none;transition:opacity .25s,transform .42s var(--spring)}
.m-deck .bottom{opacity:0;transform:translateY(24px)}
.m-deck .bottom *{pointer-events:none!important}
.dots{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:14px;margin-bottom:6px;opacity:0;transition:opacity .35s}
.dots.on{opacity:1}
.dots i{position:relative;width:5px;height:12px;border-radius:3px;background:rgba(255,255,255,.7);box-shadow:0 0 0 .5px rgba(23,43,36,.14);overflow:hidden;transition:width .25s var(--ease)}
.dots i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--f);background:var(--ink-2);opacity:.6;transition:height .4s var(--ease)}
.dots i.cur{width:10px}
.dots i.cur::after{background:var(--green);opacity:1}
.dots i.over::after{background:var(--warn);opacity:1}
.grabber{pointer-events:auto;touch-action:none;display:flex;justify-content:center;align-items:center;width:120px;height:24px;margin:0;border:0;background:transparent;cursor:grab;border-radius:12px}
.grabber::before{content:"";width:40px;height:5px;border-radius:3px;background:#fff;opacity:.9;box-shadow:0 1px 4px rgba(23,43,36,.25)}
.rail{pointer-events:auto;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:4px 16px 6px;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);transition:opacity .2s}
.rail::-webkit-scrollbar{display:none}
.rail.fade{opacity:0}
.rail.catch .tile{transform:translateY(4px);opacity:.6}
.sep{flex:0 0 1px;align-self:stretch;margin:10px 2px;background:var(--hair)}
.tile{flex:0 0 auto;width:68px;height:92px;border:0;border-radius:22px;background:var(--tile);box-shadow:var(--tile-rim);-webkit-backdrop-filter:var(--lg-bar-blur);backdrop-filter:var(--lg-bar-blur);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;scroll-snap-align:center;touch-action:pan-x;cursor:grab;position:relative;padding:0;transition:transform .11s var(--ease),opacity .2s,box-shadow .2s}
.tile:active{transform:scale(1.04);box-shadow:var(--lg-drop-shadow)}
.tile .gl{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .gl svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .w{font:600 11.5px/1 var(--sf);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .tag{font:500 10.5px/1 var(--sf);color:var(--ink-2);white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.tile .w.down{color:var(--ok)}
.tile.want{box-shadow:var(--tile-rim),0 0 0 1.5px var(--warn)}
.tile.lent{opacity:.55}
.tile.lifting{opacity:.3}
.tile.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{transform:scale(1.12)}100%{transform:none}}
.tile .bd{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%}
.tile .bd.lent{background:var(--info)}
.tile .bd.exp{background:var(--danger)}
.tile .bd.in{background:var(--action)}
.tile.swatch .gl{border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.tile.swatch.cur .gl{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--green)}
.tile.add .gl{border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.rail.in .tile{animation:tin .42s var(--ease) backwards}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.flyer{position:absolute;left:0;top:0;z-index:40;pointer-events:none;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:var(--tile);box-shadow:var(--tile-rim),0 14px 30px rgba(0,0,0,.2);transition:box-shadow .2s}
.flyer .gl{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.flyer svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flyer.armed{box-shadow:var(--tile-rim),0 0 0 2px var(--action),0 18px 36px rgba(0,0,0,.24)}

/* Tiroirs */
.scrim{position:absolute;inset:0;z-index:25;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;z-index:30;max-width:560px;margin:0 auto;background:var(--sheet);box-shadow:var(--sheet-rim);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);color:var(--lg-on);display:flex;flex-direction:column;overflow:hidden;touch-action:none;transition:transform .42s var(--sheet-ease);visibility:hidden}
.sheet.open,.sheet.drag,.sheet.peeking{visibility:visible}
.sheet.drag{transition:none}
.sheet:focus{outline:none}
.sheet-bottom{bottom:0;height:50dvh;max-height:50dvh;border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(calc(100% + 24px))}
.sheet-bottom.tall{height:50dvh}
.sheet-top{top:0;height:50dvh;max-height:50dvh;border-radius:0 0 28px 28px;padding-top:env(safe-area-inset-top,0px);transform:translateY(calc(-100% - 24px));box-shadow:inset 0 -1px 0 rgba(255,255,255,.95),0 12px 40px rgba(23,43,36,.18)}
.sheet.open{transform:none}
.handle{flex:none;height:22px;display:flex;align-items:center;justify-content:center}
.handle::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--ink-2);opacity:.3}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;transition:transform .42s var(--sheet-ease),opacity .3s}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 18px 12px;display:flex;flex-direction:column;gap:12px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.pdots{flex:none;display:flex;justify-content:center;gap:2px;padding:6px 0 8px}
.pdots button{width:22px;height:20px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.pdots button::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--ink-2);opacity:.3;transition:width .25s var(--ease),opacity .25s}
.pdots button.cur::before{width:16px;opacity:.85}
.sheet-top .pdots{padding:2px 0 0}
.sheet-top .page{padding-top:14px}
/* Sous-tiroir : pile dans le même tiroir (liste → détail), comme les sections Communauté */
.sub{position:absolute;left:0;right:0;top:0;bottom:0;z-index:4;display:flex;flex-direction:column;background:#FAF9F5;border-radius:inherit;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(102%);transition:transform .42s var(--sheet-ease);visibility:hidden}
.sub.on{transform:none;visibility:visible}
.sheet.subbed .pager,.sheet.subbed .pdots{transform:translateX(-22%);opacity:.35}
.invsearch{flex:none;margin:0 16px 8px}
.subhead{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:14px 14px 6px}
.subhead .t17{text-align:center}
.subbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:6px 18px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.subbody::-webkit-scrollbar{display:none}

.t17{display:block;font:600 17px/1.25 var(--sf);letter-spacing:-.015em}
.t13{display:block;font:500 13px/1.4 var(--sf);color:var(--ink-2);margin:0}
.big{display:block;font:700 40px/1 var(--sf);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero{display:flex;align-items:baseline;gap:10px;padding-top:6px}
.stack{display:flex;gap:3px;height:12px}
.stack i{display:block;border-radius:6px;min-width:6px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend span{display:flex;flex-direction:column;gap:3px;font:500 12px/1.2 var(--sf);color:var(--ink-2)}
.legend span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-bottom:1px}
.legend span i.hollow{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.legend b{font:600 15px/1.1 var(--sf);color:var(--ink);font-variant-numeric:tabular-nums}
.zbars{display:flex;flex-direction:column;gap:6px}
.zbars div{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:10px;font:500 12.5px/1 var(--sf);color:var(--ink-2)}
.zbars i{height:6px;border-radius:3px;background:var(--well);position:relative;overflow:hidden}
.zbars i::after{content:"";position:absolute;inset:0;width:var(--p);border-radius:3px;background:var(--action)}
.zbars b{font:600 12.5px/1 var(--sf);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.bal{display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:14px;align-items:center;height:100%}
.bal svg{width:100%;height:auto;max-height:240px}
.b-body{fill:var(--well);stroke:var(--ink-2);stroke-opacity:.5;stroke-width:1.2}
.b-pocket{fill:none;stroke:var(--ink-2);stroke-opacity:.4;stroke-width:1.2}
.b-strap{fill:none;stroke:var(--ink-2);stroke-opacity:.5;stroke-width:5;stroke-linecap:round}
.b-back{stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:.7}
.b-ideal{fill:var(--sage-soft);stroke:var(--action);stroke-width:1.4;stroke-dasharray:4 4;opacity:.9}
.b-cross{stroke-width:1.4;opacity:.7}
.b-lbl{font:600 11px var(--sf);fill:var(--ink-2)}
.chart{width:100%;height:auto}
.c-area{fill:var(--sage-soft);opacity:.7}
.c-line{fill:none;stroke:var(--action);stroke-width:2.2;stroke-linejoin:round}
.c-rs{stroke:var(--ink-2);stroke-opacity:.35;stroke-dasharray:3 4}
.c-t{font:500 10px var(--sf);fill:var(--ink-2)}
.c-dot{fill:#fff;stroke:var(--action);stroke-width:2}
.c-dot.cur{fill:var(--action)}
input.day{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;touch-action:none;cursor:pointer}
input.day::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--well)}
input.day::-moz-range-track{height:6px;border-radius:3px;background:var(--well)}
input.day::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:24px;margin-top:-9px;border-radius:999px;background:#fff;box-shadow:0 0 0 .5px rgba(23,43,36,.1),0 3px 8px rgba(23,43,36,.18);transition:transform .32s var(--spring),background .2s,box-shadow .2s}
input.day:active::-webkit-slider-thumb{transform:scale(1.45,1.6);background:rgba(255,255,255,.12);box-shadow:var(--lg-drop-shadow)}
input.day::-moz-range-thumb{width:38px;height:24px;border:0;border-radius:999px;background:#fff;box-shadow:0 0 0 .5px rgba(23,43,36,.1),0 3px 8px rgba(23,43,36,.18)}
input.day::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--green) var(--v,0%),rgba(23,64,44,.1) var(--v,0%))}
.ready{display:flex;align-items:center;gap:14px;padding-top:4px}
.ready svg{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.r-bg{fill:none;stroke:var(--well);stroke-width:7}
.r-fg{fill:none;stroke-width:7;stroke-linecap:round}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:18px;background:var(--well);text-align:left;cursor:pointer;transition:transform .11s var(--ease)}
.row:active{transform:scale(.985)}
.row .rg{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.row .rg svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font:600 14px/1.25 var(--sf)}
.row small{display:block;margin-top:2px;font:500 12px/1.3 var(--sf);color:var(--ink-2)}
.ihead{display:flex;align-items:center;gap:12px;padding-top:4px}
.ig{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none}
.ig svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  for(let i=0;i<14;i++){const cx=rnd()*W,cy=H*(.1+rnd()*.28),w=120+rnd()*260;for(let j=0;j<7;j++){const ox=(rnd()-.5)*w,oy=(rnd()-.5)*w*.18,r=w*(.12+rnd()*.16);for(const d of[-W,0,W]){g=x.createRadialGradient(cx+ox+d,cy+oy,0,cx+ox+d,cy+oy,r);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx+ox+d-r,cy+oy-r,2*r,2*r);}}}
  const ridge=(base,amp,k,fill,snow)=>{x.beginPath();x.moveTo(0,H);const pts=[];for(let i=0;i<=W;i+=4){const u=i/W,y=base-amp*(.5+.5*per(u,k)/k.reduce((a,q)=>a+q[1],0));pts.push(y);x.lineTo(i,y);}x.lineTo(W,H);x.closePath();x.fillStyle=fill;x.fill();
    if(snow){x.save();x.clip();x.fillStyle='rgba(255,255,255,.92)';for(let i=0;i<=W;i+=4){const y=pts[i/4];if(y<base-amp*snow){x.fillRect(i,y,4,(base-amp*snow-y)*.9+6);}}x.restore();}};
  ridge(hY-60,300,[[2,1,.4],[5,.55,1.3],[11,.25,2.1],[23,.12,.7]],'#9FB9D2',.78);
  g=x.createLinearGradient(0,hY-220,0,hY);g.addColorStop(0,'rgba(220,236,244,0)');g.addColorStop(1,'rgba(220,236,244,.75)');x.fillStyle=g;x.fillRect(0,hY-220,W,220);

  g=x.createLinearGradient(0,hY-140,0,hY);g.addColorStop(0,'rgba(190,222,224,0)');g.addColorStop(1,'rgba(190,222,224,.55)');x.fillStyle=g;x.fillRect(0,hY-140,W,140);
  ridge(hY+14,90,[[4,1,.9],[9,.4,2.6],[19,.2,.2]],'#5E8C55',0);
  for(let i=0;i<420;i++){const tx=rnd()*W,band=rnd(),ty=hY-6+band*26,th=14+rnd()*22*(1-band*.4);const col=band<.5?'#2F5A3A':'#3B6B40';x.fillStyle=col;for(const d of[-W,0,W]){x.beginPath();x.moveTo(tx+d,ty-th);x.lineTo(tx+d+th*.32,ty);x.lineTo(tx+d-th*.32,ty);x.closePath();x.fill();}}
  g=x.createLinearGradient(0,hY+8,0,H);g.addColorStop(0,'#7DAA55');g.addColorStop(.5,'#6C9C47');g.addColorStop(1,'#5F8F3F');x.fillStyle=g;x.fillRect(0,hY+12,W,H-hY);
  for(let i=0;i<5000;i++){const fx=rnd()*W,fy=hY+14+Math.pow(rnd(),.7)*(H-hY-14),q=rnd();x.fillStyle=q<.06?'rgba(255,255,255,.8)':q<.1?'rgba(250,214,92,.85)':q<.12?'rgba(206,140,190,.7)':`rgba(${q<.6?'60,110,40':'170,210,110'},.35)`;const r=q<.12?1.6:1.2;x.fillRect(fx,fy,r,r*(q<.12?1:3));}
  const o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d');ox.filter='blur(1.4px)';ox.drawImage(c,0,0);

function rbox(w,h,d,r,seg){seg=seg||8;r=Math.min(r,w/2,h/2,d/2)*.999;const g=new T.BoxGeometry(w,h,d,seg,seg,seg);const p=g.attributes.position,n=g.attributes.normal;const ax=w/2-r,ay=h/2-r,az=d/2-r;const v=new T.Vector3(),c=new T.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(clamp(v.x,-ax,ax),clamp(v.y,-ay,ay),clamp(v.z,-az,az));v.sub(c);const len=v.length();if(len<1e-6)v.fromBufferAttribute(n,i);else v.divideScalar(len);n.setXYZ(i,v.x,v.y,v.z);p.setXYZ(i,c.x+v.x*r,c.y+v.y*r,c.z+v.z*r);}
  p.needsUpdate=true;n.needsUpdate=true;return g;}

  requestAnimationFrame(()=>{p.scrollLeft=(start||0)*p.clientWidth;updDots(p,d);});}
pagerTop.addEventListener('scroll',()=>updDots(pagerTop,pdTop),{passive:true});pagerBot.addEventListener('scroll',()=>updDots(pagerBot,pdBot),{passive:true});
[[pdTop,pagerTop],[pdBot,pagerBot]].forEach(([d,p])=>d.addEventListener('click',e=>{const b=e.target.closest('[data-pg]');if(b){p.scrollTo({left:+b.dataset.pg*p.clientWidth,behavior:RM?'auto':'smooth'});haptic('sel');}}));
function curPage(p){return Math.round(p.scrollLeft/Math.max(1,p.clientWidth));}
function openTop(page){closeBot(true);hidePeek();buildBilanInto(page);sheetTop.classList.add('open');sheetTop.setAttribute('aria-hidden','false');scrim.classList.add('on');S.sheet='top';haptic('light');setTimeout(()=>sheetTop.focus({preventScroll:true}),380);}
function closeTop(silent){if(!sheetTop.classList.contains('open'))return;sheetTop.classList.remove('open');sheetTop.setAttribute('aria-hidden','true');if(!silent)haptic('light');}
function openBot(kind,pages,page,label,tall,labels){closeTop(true);hidePeek();popSub(true);closeMenu();sheetBot.querySelectorAll('.invsearch').forEach(n=>n.remove());S.sheetKind=kind;sheetBot.classList.toggle('tall',!!tall);sheetBot.setAttribute('aria-label',label||'Détail');fillPager(pagerBot,pdBot,pages,page,labels);
  sheetBot.classList.add('open');sheetBot.setAttribute('aria-hidden','false');scrim.classList.add('on');S.sheet='bot';haptic('light');setTimeout(()=>sheetBot.focus({preventScroll:true}),380);}
function closeBot(silent){if(!sheetBot.classList.contains('open'))return;sheetBot.classList.remove('open');sheetBot.setAttribute('aria-hidden','true');S.sheetKind=null;if(!silent)haptic('light');}
function closeSheets(silent){popSub(true);closeMenu();if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}closeTop(silent);closeBot(silent);scrim.classList.remove('on');S.sheet=null;S.openItem=null;if(!silent)canvas.focus({preventScroll:true});}
scrim.addEventListener('click',()=>closeSheets());
function refreshSheet(){if(S.sheet==='top')buildBilanInto(curPage(pagerTop));else if(S.sheetKind==='item'&&S.openItem)openItemInto(S.openItem,curPage(pagerBot));else if(S.sheetKind==='bag')openBag(curPage(pagerBot),true);else if(S.sheetKind==='part'&&S.openPart)openPart(S.openPart,curPage(pagerBot),true);}

/* Bilan (tiroir du haut) */
function balanceHTML(c,cs){const X=z=>58+(z+.36)/.72*124,Y=y=>196-(y+.75)/1.75*178,col=cs.ok?'var(--action)':'var(--warn)';
  return `<div class="bal"><svg viewBox="0 0 240 212" role="img" aria-label="Vue de profil du sac : centre de gravité ${cs.ok?'bien placé':'mal placé'}">
  <path d="M${X(-.33)} ${Y(.76)} C ${X(-.52)} ${Y(.4)}, ${X(-.5)} ${Y(-.2)}, ${X(-.37)} ${Y(-.56)}" class="b-strap"/>
  <rect x="${X(-.28)}" y="${Y(.725)}" width="${X(.28)-X(-.28)}" height="${Y(-.725)-Y(.725)}" rx="22" class="b-body"/>
  <rect x="${X(-.27)}" y="${Y(.99)}" width="${X(.33)-X(-.27)}" height="${Y(.73)-Y(.99)}" rx="12" class="b-body"/>
  <rect x="${X(.24)}" y="${Y(.23)}" width="${X(.34)-X(.24)}" height="${Y(-.57)-Y(.23)}" rx="8" class="b-pocket"/>
  <line x1="${X(-.31)}" y1="${Y(.68)}" x2="${X(-.31)}" y2="${Y(-.68)}" class="b-back"/>
  <ellipse cx="${X(-.12)}" cy="${Y(.17)}" rx="22" ry="40" class="b-ideal"/>
  <line x1="${X(c.z)}" y1="${Y(c.y)-15}" x2="${X(c.z)}" y2="${Y(c.y)+15}" class="b-cross" style="stroke:${col}"/>
  <line x1="${X(c.z)-15}" y1="${Y(c.y)}" x2="${X(c.z)+15}" y2="${Y(c.y)}" class="b-cross" style="stroke:${col}"/>
  <circle cx="${X(c.z)}" cy="${Y(c.y)}" r="6.5" style="fill:${col}"/>
  <text x="${X(-.31)}" y="210" text-anchor="middle" class="b-lbl">dos</text></svg>
  <div><span class="t17">${cs.t}</span><span class="t13" style="margin-top:4px">${cs.s}</span><span class="t13" style="margin-top:8px">Gauche-droite${NB}: ${Math.abs(c.x*44)<.5?"centré":"décalé de "+fr(Math.abs(c.x*44),1)+NB+"cm vers la "+(c.x>0?"droite":"gauche")}.</span></div></div>`;}
function dayWeights(){const k=kit(),keep=S.day,arr=[];for(let d=1;d<=k.days;d++){S.day=d;arr.push(totals().back);}S.day=keep;return arr;}
function daysHTML(){const k=kit(),w=dayWeights(),mn=Math.min(...w)*.97,mx=Math.max(...w)*1.02,X=i=>18+i/Math.max(1,k.days-1)*284,Y=g=>98-(g-mn)/Math.max(1,mx-mn)*78,pts=w.map((g,i)=>X(i).toFixed(1)+','+Y(g).toFixed(1)).join(' ');
  const rs=[...Array(k.days).keys()].filter(i=>i>0&&i%k.food.carry===0);
  return `<div class="hero"><span class="big" id="dayKg">${kg(w[S.day-1])}</span><span class="t13" id="dayLbl">jour ${S.day} sur ${k.days}</span></div>
  <svg class="chart" viewBox="0 0 320 112" aria-hidden="true"><polygon points="${X(0)},106 ${pts} ${X(k.days-1)},106" class="c-area"/><polyline points="${pts}" class="c-line"/>
  ${rs.map(i=>`<line x1="${X(i)}" y1="14" x2="${X(i)}" y2="106" class="c-rs"/><text x="${X(i)}" y="10" text-anchor="middle" class="c-t">ravitaillement</text>`).join('')}
  ${w.map((g,i)=>`<circle cx="${X(i)}" cy="${Y(g)}" r="${i===S.day-1?5.5:3.2}" class="c-dot${i===S.day-1?' cur':''}"/>`).join('')}</svg>
  <input class="day" id="dayRange" type="range" min="1" max="${k.days}" step="1" value="${S.day}" style="--v:${((S.day-1)/Math.max(1,k.days-1)*100).toFixed(0)}%" aria-label="Jour de la sortie">
  <p class="t13">Vivres pour ${k.food.carry}${NB}jours, puis ravitaillement en refuge. Eau rechargée chaque jour.</p>`;}
function readyHTML(bl,t,cs){const pct=readiness(bl,cs),C=2*Math.PI*26,col=pct>=90?'var(--action)':'var(--warn)';
  const list=bl.map(b=>Object.assign({gain:13},b));if(!cs.ok)list.push({kind:'cog',gain:7,zone:'main',gl:'bag',t:cs.t,s:'Touche pour ranger le sac automatiquement.'});S.bl=list;
  const rows=list.slice(0,3).map((b,i)=>`<button class="row" type="button" data-bl="${i}"><span class="rg" style="background:${b.kind==='ghost'||b.kind==='cog'?'var(--warn)':b.kind==='cap'?'var(--info)':'var(--danger)'}">${svg(b.gl)}</span><span><b>${esc(b.t)}</b><small>${esc(b.s)}</small></span><em class="gain">+${b.gain}${NB}%</em></button>`).join('');
  const more=list.length>3?`<p class="t13">Et ${list.length-3} autre${list.length>4?'s':''} point${list.length>4?'s':''}.</p>`:'';
  const tp=tips().slice(0,2).map(x=>`<p class="t13 tip">${esc(x.t)}${NB}: ${esc(x.s)}</p>`).join('');
  const money=(t.buy||t.rent)?`<p class="t13">${t.buy?'À acheter'+NB+': '+fr(t.buy,0)+NB+'€':''}${t.buy&&t.rent?' · ':''}${t.rent?'À louer'+NB+': '+fr(t.rent,0)+NB+'€ pour '+kit().days+NB+'jours':''}${t.unknown?' · '+t.unknown+' poids inconnu'+(t.unknown>1?'s':''):''}</p>`:'';
  return `<div class="ready"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" class="r-bg"/><circle cx="32" cy="32" r="26" class="r-fg" style="stroke:${col};stroke-dasharray:${(pct/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div><span class="t17">Prêt à ${pct}${NB}%</span><span class="t13">${list.length?'Le chemin vers 100'+NB+'%'+NB+':':'Rien ne manque.'}</span></div></div><div class="rows">${rows}</div>${more}${tp}${money}<div class="acts"><button class="quiet" type="button" data-deck="fill">Remplir le sac</button><button class="quiet" type="button" data-deck="debrief">Débrief de sortie</button></div>`;}
function buildBilanInto(page){const k=kit(),t=totals(),c=cog(),cs=cogState(c),bl=blockers();const pages=[],labels=[];
  const pct=Math.round(t.back/(k.body*1000)*100),zb=ZIDS.filter(z=>z!=='worn').map(z=>({z,g:t.zg[z]||0})).filter(x=>x.g>0),mx=Math.max(1,...zb.map(x=>x.g));
  pages.push(`<div class="hero"><span class="big">${kg(t.back)}</span><span class="t13">sur le dos${k.food?' · jour '+S.day:''}</span></div>
  <div class="stack" aria-hidden="true"><i style="flex:${t.base};background:var(--action)"></i><i style="flex:${Math.max(t.cons,1)};background:var(--info)"></i></div>
  <div class="legend"><span><i style="background:var(--action)"></i>Base sèche<b>${kg(t.base)}</b></span><span><i style="background:var(--info)"></i>Eau et vivres<b>${kg(t.cons)}</b></span><span><i class="hollow"></i>Porté sur toi<b>${kg(t.worn)}</b></span></div>
  <p class="t13">${pct}${NB}% de ton poids (${k.body}${NB}kg). Repère courant${NB}: 20${NB}% maximum.</p>
  <div class="zbars">${zb.map(x=>`<div><span>${ZNAME[x.z]}</span><i style="--p:${(x.g/mx*100).toFixed(1)}%"></i><b>${kg(x.g)}</b></div>`).join('')}</div>`);labels.push('Poids');
  pages.push(balanceHTML(c,cs));labels.push('Équilibre');
  if(k.food){pages.push(daysHTML());labels.push('Jours');}
  pages.push(readyHTML(bl,t,cs));labels.push('Prêt');
  fillPager(pagerTop,pdTop,pages,page==null?0:Math.min(page,pages.length-1),labels);}
pagerTop.addEventListener('input',e=>{if(e.target.id!=='dayRange')return;S.day=+e.target.value;const k=kit();e.target.style.setProperty('--v',((S.day-1)/Math.max(1,k.days-1)*100).toFixed(0)+'%');const w=dayWeights();$('dayKg').textContent=kg(w[S.day-1]);$('dayLbl').textContent='jour '+S.day+' sur '+k.days;
  pagerTop.querySelectorAll('.c-dot').forEach((c,i)=>{c.classList.toggle('cur',i===S.day-1);c.setAttribute('r',i===S.day-1?5.5:3.2);});renderIsland();haptic('sel');});
pagerTop.addEventListener('click',e=>{const dk=e.target.closest('[data-deck]');if(dk){startDeck(dk.dataset.deck);return;}const b=e.target.closest('[data-bl]');if(!b)return;const bl=S.bl[+b.dataset.bl];if(!bl)return;closeSheets(true);
  setTimeout(()=>{if(bl.kind==='cog'){goZone(ZI.main);setTimeout(autopack,350);}else if(bl.kind==='ghost')ghostFocus(bl.fn);else{if(bl.zone&&ZI[bl.zone]!=null)goZone(ZI[bl.zone]);if(bl.id)setTimeout(()=>openItem(bl.id,bl.kind==='expired'?1:0),380);else hud(bl.t,bl.s,2400);}},200);});

/* Fiche objet (tiroir du bas) */
function openItem(id,page){openItemInto(id,page||0,true);}
function openItemInto(id,page,fresh){const it=get(id);if(!it)return;S.openItem=id;const k=kit(),z=zoneOf(id);exitSwap(true);
  const state=it.state==='lent'?'En prêt':it.expired?'Périmée':it.care?'À entretenir':it.planned==='shop'?'À acheter':it.planned==='rent'?'À louer':'Bon état';
  const notes=[it.temp,it.state==='lent'?'Chez '+it.lentTo+', retour le '+it.until+'.':'',it.expired?'Périmée depuis '+it.expired+'.':'',it.care||'',it.loc&&it.loc!=='Lille'&&!it.planned?('Stockage'+NB+': '+it.loc+(k.start===it.loc?', ton point de départ.':'.')):'',it.planned==='shop'?'Boutique LKDV · '+fr(it.eur,0)+NB+'€':'',it.planned==='rent'?'Location entre membres · '+fr(it.day,0)+NB+'€ par jour':'',it.g==null?'Poids non renseigné par la boutique : impossible de comparer.':''].filter(Boolean);
  const fiche=`<div class="headrow"><span class="ig" style="background:${it.c};color:${fgOn(it.c)}">${svg(it.gl)}</span><div><span class="t17">${esc(it.n)}</span><span class="t13">${esc(it.fam||'')}${it.fam?' · ':''}${z?ZNAME[z]:'pas dans ce sac'}</span></div><button class="gcirc" type="button" data-menu="item" aria-label="Plus d’actions" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="18" cy="12" r=".6"/></svg></button></div>
   <div class="metrics"><div class="m"><b>${wt(it.g==null?null:effG(it))}</b><span>Poids</span></div><div class="m"><b>${lit(it.L||0)}</b><span>Volume</span></div><div class="m"><b>${z?ZNAME[z]:'—'}</b><span>Rangement</span></div>
   <div class="m"><b>${state}</b><span>État</span></div><div class="m"><b>${it.trips||'—'}</b><span>Sorties</span></div><div class="m"><b>${esc(it.loc||'—')}</b><span>Stockage</span></div></div>
   ${notes.length?`<p class="t13">${esc(notes.join(' '))}</p>`:''}
   ${z?`<button class="quiet neg" type="button" data-act="unpack">Retirer du sac</button>`:(it.state==='lent'?'':`<button class="quiet" type="button" data-act="pack">Mettre dans le sac</button>`)}`;
  const alts=z?altsFor(id):[];
  const swap=z?(alts.length?`<span class="t17">Échanger</span><div class="altgrid">${alts.slice(0,6).map(a=>{const e=a.e;return `<button class="alt" type="button" data-swap="${e.id}" data-k="${a.kind}"><span class="gl" style="background:${e.c};color:${fgOn(e.c)}">${svg(e.gl)}</span><span class="an">${esc(e.n)}</span><span class="ad${a.d!=null&&a.d<0?' down':''}">${dW(a.d)}</span><span class="at">${a.kind==='own'?(e.state==='lent'?'En prêt':'À toi'):altTag(e)}</span></button>`;}).join('')}</div><p class="t13">Le sac se recalcule dès que tu touches une option.</p>`:`<span class="t17">Échanger</span><p class="t13">Rien d’équivalent dans ton inventaire ni en boutique pour l’instant.</p>`):'';
  const vie=`<span class="t17">Son histoire</span><div class="rows">
   <div class="row" style="cursor:default"><span class="rg" style="background:var(--action)">${svg('map')}</span><span><b>${it.trips?it.trips+' sorties avec toi':'Pas encore sorti'}</b><small>${it.trips?'Chaque sortie enregistrée ajoute une ligne ici.':'Il prendra vie à ta première sortie.'}</small></span></div>
   <div class="row" style="cursor:default"><span class="rg" style="background:var(--info)">${svg('box')}</span><span><b>${it.bought?'Acheté en '+it.bought:it.planned?'Pas encore à toi':'Date d’achat inconnue'}</b><small>${it.price?fr(it.price,0)+NB+'€ · '+(it.trips?fr(it.price/it.trips,0)+NB+'€ par sortie':''):'Ajoute le ticket pour suivre la garantie.'}</small></span></div>
   <div class="row" style="cursor:default"><span class="rg" style="background:${it.care||it.expired?'var(--warn)':'var(--ok)'}">${svg(it.expired?'aid':'jacket')}</span><span><b>${it.expired?'À renouveler':it.care?'Entretien conseillé':'Rien à prévoir'}</b><small>${esc(it.expired?'Périmée depuis '+it.expired+'.':it.care||'Aucune date d’entretien ni de péremption proche.')}</small></span></div></div>`;
  const pages=z?[fiche,swap,vie]:[fiche,vie],labels=z?['Fiche','Échanger','Histoire']:['Fiche','Histoire'];
  try{history.replaceState(null,'','#'+id);}catch(_){}
  if(fresh||S.sheetKind!=='item')openBot('item',pages,page,it.n,false,labels);else fillPager(pagerBot,pdBot,pages,Math.min(page,pages.length-1),labels);}
/* Menu contextuel ancré (équivalent Menu SwiftUI) */

  menuEl.innerHTML=items.map((it,i)=>it==='-'?'<hr>':`<button type="button" role="menuitem" data-i="${i}" class="${it.neg?'neg':''}">${esc(it.t)}${svg(it.gl||'box')}</button>`).join('');
  sheetBot.appendChild(menuEl);menuEl.style.top=(ar.bottom-sr.top+6)+'px';menuEl.style.right=(sr.right-ar.right)+'px';

  setTimeout(()=>{const f=menuEl&&menuEl.querySelector('button');if(f)f.focus({preventScroll:true});},60);haptic('light');}

/* Commander la configuration réelle */
const orderBtn=$('orderBtn');

function openOrder(){const l=toOrder(),t=orderTotal(),all=pieces(),k=kit();
  const p1=`<div class="ph"><span class="t17">Ta configuration</span><span class="t13">${wt(bagWeight())} à vide · ${lit(totalCap())}</span></div>

   <div class="swrow"><span class="rg" style="background:var(--sage-soft);color:var(--forest)">${svg('box')}</span><span><b>${ptsUsed(host)} sur ${ptsCap(host)} utilisés</b><small>${ptsCap(host)-ptsUsed(host)} libre${ptsCap(host)-ptsUsed(host)>1?'s':''}</small></span>${ptsHTML(host)}</div>
   <div class="rows">${MODS.filter(m=>ONE.mods[m].host===host).map(m=>`<div class="row" style="cursor:default"><span class="rg" style="background:${modOn(m)?'var(--green)':'var(--ink-3)'}">${ONE.mods[m].gl.startsWith('v_')?vsvg(ONE.mods[m].gl):svg(ONE.mods[m].gl)}</span><span><b>${ONE.mods[m].n}</b><small>${ONE.mods[m].pts} point${ONE.mods[m].pts>1?'s':''} · ${modOn(m)?'monté':'libre'}</small></span></div>`).join('')}</div>`;
  const pages=[p1,p2],labels=['Pièce','Attache'];
  S.openPart=p;if(refresh&&S.sheetKind==='part')fillPager(pagerBot,pdBot,pages,Math.min(page||0,pages.length-1),labels);else openBot('part',pages,page||0,PNAME[p],false,labels);}
function modRow(m){const M=ONE.mods[m],on=modOn(m),free=ptsCap(M.host)-ptsUsed(M.host),dis=!on&&free<M.pts,key='mod:'+m;const st=OWN.has(key)||ORDER.has(key)?(OWN.has(key)?'à toi':'précommandé'):eur(M.eur);
  return `<div class="swrow"><span class="rg" style="background:${on?'var(--green)':'rgba(23,64,44,.1)'};color:${on?'#fff':'var(--forest)'}">${M.gl.startsWith('v_')?vsvg(M.gl):svg(M.gl)}</span><span><b>${M.n}</b><small>${dis?'Plus de place sur l’attache':M.pts+' point'+(M.pts>1?'s':'')+' · '+st}</small></span><label class="gswitch"><input type="checkbox" role="switch" data-mod="${m}" ${on?'checked':''} ${dis?'disabled':''} aria-label="${esc(M.n)}"><i></i><b></b></label></div>`;}
function toggleMod(m,on){const M=ONE.mods[m];if(on===modOn(m))return;if(on&&ptsCap(M.host)-ptsUsed(M.host)<M.pts){hud(M.n,'Plus de points d’attache libres. Retire un module.',2000);haptic('warn');return;}
  const snap=snapshot(),w0=bagWeight();setMod(m,on);rebuildParts(['body','lid','front','sides','hip','harness','acc']);relocate();undoStack.push(snap);after(bagWeight()-w0);flashPart(M.part);
  hud(M.n+(on?' clipsé':' retiré'),on&&pieceState('mod:'+m)==='new'?eur(M.eur)+' à commander':dW(bagWeight()-w0),1600);showUndo(M.n);haptic('med');if(S.mode==='custo')renderCRail();renderOrderBtn();}
function resetPart(p){const k=kit(),d=JSON.parse(DEF[k.bag]),c=cfg(),snap=snapshot(),w0=bagWeight();if(p==='webbing')c.webbing=d.webbing;else{c[p]=d[p];c.acc=c.acc.filter(a=>ACC[a].part!==p).concat(d.acc.filter(a=>ACC[a].part===p));}
  rebuildParts(p==='webbing'?['body','lid','front','sides','hip','harness','acc']:p==='body'?['body','lid','front','harness','acc']:[p,'acc']);relocate();undoStack.push(snap);after(bagWeight()-w0);flashPart(p);hud(PNAME[p],'Revenu à l’origine',1400);showUndo(PNAME[p]);haptic('med');if(S.mode==='custo')renderCRail();}
modesEl.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode);});
catsEl.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;S.cat=b.dataset.cat;renderCats();renderCRail();haptic('sel');const o=optList().find(x=>x.cur);hud(CATN[S.cat],o?o.n:PNAME[S.part],1000);});
undoEl.addEventListener('click',undo);
let CT=null;
crail.addEventListener('pointerdown',e=>{const b=e.target.closest('.tile');if(!b)return;CT={b,sx:e.clientX,sy:e.clientY,pid:e.pointerId,sl:crail.scrollLeft,mouse:e.pointerType==='mouse',moved:false,long:false};CT.lp=setTimeout(()=>{if(CT&&!CT.moved){CT.long=true;CT.prev=applyOpt(b.dataset.opt,'preview');if(!CT.prev)peekOpt(b.dataset.opt);}},260);});
window.addEventListener('pointermove',e=>{if(!CT||e.pointerId!==CT.pid)return;const dx=e.clientX-CT.sx,dy=e.clientY-CT.sy;if(CT.prev){const out=e.clientY<railTop()-40;if(out!==!!CT.out){CT.out=out;haptic('sel');hud(S.preview?S.preview.n:'',out?'Relâche pour annuler':'Relâche pour garder',6000);}return;}if(!CT.moved&&Math.hypot(dx,dy)>8){CT.moved=true;clearTimeout(CT.lp);}if(CT.moved&&CT.mouse)crail.scrollLeft=CT.sl-dx;});
window.addEventListener('pointerup',e=>{if(!CT||e.pointerId!==CT.pid)return;const c=CT;CT=null;clearTimeout(c.lp);if(c.prev){if(c.out)cancelPreview();else commitPreview();return;}if(!c.moved&&!c.long){hidePeek();applyOpt(c.b.dataset.opt);}});
window.addEventListener('pointercancel',e=>{if(CT&&e.pointerId===CT.pid){clearTimeout(CT.lp);if(CT.prev)cancelPreview();CT=null;}});
crail.addEventListener('click',e=>{const b=e.target.closest('.tile');if(b&&e.detail===0)applyOpt(b.dataset.opt);});
crail.addEventListener('contextmenu',e=>e.preventDefault());
/* ───────────── Remplir le sac la veille / débrief après la sortie ───────────── */
const deckEl=$('deck'),dcard=$('dcard'),dprog=$('dprogI');
const SLOTD={bottom:'au fond',bottomF:'au fond, côté poche',midBack:'au milieu, contre le dos',midFront:'au milieu, côté poche',top:'en haut'};
function fillOrder(){const k=kit(),o=[];(k.packed.back||[]).forEach(id=>o.push(id));['bottom','bottomF','midBack','midFront','top'].forEach(sl=>(k.packed.main||[]).filter(id=>IDX[id]&&IDX[id].slot===sl).forEach(id=>o.push(id)));['lid','sides','hip','front','worn'].forEach(z=>(k.packed[z]||[]).forEach(id=>o.push(id)));return o;}
function startDeck(kind){closeSheets(true);if(S.mode==='custo')setMode('gestion',true);S.exT=0;S.swap=null;S.filter=null;hidePeek();
  const list=kind==='fill'?fillOrder():ZIDS.flatMap(z=>(kit().packed[z]||[]).filter(id=>!get(id).cons));
  S.deck={kind,list,i:0,yes:[],no:[]};appEl.classList.add('m-deck');deckEl.hidden=false;showCard();haptic('med');
  say(kind==='fill'?'Remplissage : glisse à droite quand l’objet est dans le sac, à gauche pour plus tard.':'Débrief : glisse à droite si tu t’en es servi, à gauche sinon.');}
const deckCur=()=>S.deck&&S.deck.list[S.deck.i];
function showCard(){const d=S.deck,id=deckCur();dprog.style.width=(d.i/Math.max(1,d.list.length)*100)+'%';if(!id){deckEnd();return;}
  const it=get(id),z=zoneOf(id),x=IDX[id],F=d.kind==='fill';const where=z==='main'?'Principal, '+SLOTD[x.slot]:z==='worn'?'à enfiler':ZNAME[z];
  dcard.innerHTML=`<span class="dk no" aria-hidden="true">${F?'Plus tard':'Pas utilisé'}</span><span class="dk yes" aria-hidden="true">${F?'Dedans':'Utilisé'}</span><span class="ig" style="background:${it.c};color:${fgOn(it.c)}">${svg(it.gl)}</span><div><span class="dt">${esc(it.n)}</span><span class="ds">${d.i+1} sur ${d.list.length} · ${F?where+' · '+wt(effG(it)):'tu t’en es servi ?'}</span></div>`;
  dcard.setAttribute('aria-label',`${it.n}, ${d.i+1} sur ${d.list.length}. ${F?where:''} Flèche droite : ${F?'dans le sac':'utilisé'}, flèche gauche : ${F?'plus tard':'pas utilisé'}.`);
  if(z==='worn')goZone(0);else goZone(ZI[z]);}
function deckDecide(yes){const d=S.deck,id=deckCur();if(!id)return;(yes?d.yes:d.no).push(id);const g=effG(get(id));
  dcard.classList.remove('drag');dcard.style.transform=`translateX(${yes?120:-120}%) rotate(${yes?9:-9}deg)`;dcard.style.opacity='0';
  haptic(yes&&d.kind==='fill'?(g>800?'heavy':g>250?'med':'light'):'sel');
  setTimeout(()=>{d.i++;dcard.style.transition='none';dcard.style.opacity='1';dcard.style.transform='translateY(18px) scale(.97)';void dcard.offsetWidth;dcard.style.transition='';dcard.style.transform='';showCard();},RM?0:240);}
function deckEnd(){const d=S.deck,k=kit();dprog.style.width='100%';let t,s,acts='';
  if(d.kind==='fill'){d.yes.forEach(id=>{get(id).checked=true;});t='Sac rempli';s=d.yes.length+' objet'+(d.yes.length>1?'s':'')+' dedans'+(d.no.length?' · plus tard : '+d.no.map(id=>get(id).n).join(', '):'.');haptic('ok');}
  else{d.yes.forEach(id=>{const it=get(id);it.trips=(it.trips||0)+1;});k.lineage=k.lineage||{gen:1,proven:0};k.lineage.proven++;
    const cut=d.no.filter(id=>!get(id).vital),keep=d.no.filter(id=>get(id).vital),g=cut.reduce((a,id)=>a+effG(get(id)),0);
    t=d.no.length?d.no.length+' objet'+(d.no.length>1?'s':'')+' pas utilisé'+(d.no.length>1?'s':''):'Tout a servi';
    s=(cut.length?cut.map(id=>get(id).n).join(', ')+'. ':'')+(keep.length?keep.map(id=>get(id).n).join(', ')+' : à garder, vital même sans servir.':'')+(d.no.length?'':'Kit éprouvé une fois de plus.');
    if(cut.length)acts=`<button class="quiet" type="button" data-dk="light">Alléger le kit ${dW(-g)}</button>`;d.cut=cut;haptic('ok');}
  dcard.innerHTML=`<div class="dsum"><span class="dt">${esc(t)}</span><span class="ds">${esc(s)}</span><div class="dacts">${acts}<button class="quiet" type="button" data-dk="end">Terminer</button></div></div>`;
  dcard.setAttribute('aria-label',t+'. '+s);goZone(1);say(t+'. '+s);}
function quitDeck(){if(!S.deck)return;S.deck=null;appEl.classList.remove('m-deck');deckEl.hidden=true;renderRail();renderIsland();goZone(1);haptic('light');canvas.focus({preventScroll:true});}
function lighten(){const d=S.deck,k=kit();if(!d||!d.cut)return;const snap=snapshot();let g=0,gb=0;d.cut.forEach(id=>{const z=zoneOf(id);if(!z)return;g+=effG(get(id));if(z!=='worn')gb+=effG(get(id));k.packed[z]=k.packed[z].filter(x=>x!==id);killObj(id,bagC.clone());});reindex();undoStack.push(snap);after(-gb);quitDeck();hud('Kit allégé',dW(-g)+' pour la prochaine sortie',2000);showUndo('Allègement');}
let DC=null;
dcard.addEventListener('pointerdown',e=>{if(!S.deck||!deckCur()||e.target.closest('button'))return;DC={sx:e.clientX,sy:e.clientY,t:performance.now(),dx:0,dy:0,armed:false};try{dcard.setPointerCapture(e.pointerId);}catch(_){}dcard.classList.add('drag');});
dcard.addEventListener('pointermove',e=>{if(!DC)return;const dx=e.clientX-DC.sx,dy=e.clientY-DC.sy;DC.dx=dx;DC.dy=dy;dcard.style.transform=`translate(${dx}px,${Math.max(0,dy)*.6}px) rotate(${dx/26}deg)`;
  const y=dcard.querySelector('.dk.yes'),n=dcard.querySelector('.dk.no');if(y)y.style.opacity=clamp(dx/90,0,1);if(n)n.style.opacity=clamp(-dx/90,0,1);const a=Math.abs(dx)>90;if(a!==DC.armed){DC.armed=a;if(a)haptic('sel');}});
const dcEnd=()=>{if(!DC)return;const{dx,dy,t}=DC,v=Math.abs(dx)/Math.max(1,performance.now()-t);DC=null;dcard.classList.remove('drag');
  if(dy>110&&Math.abs(dx)<60){quitDeck();return;}if(Math.abs(dx)>90||(v>.7&&Math.abs(dx)>30)){deckDecide(dx>0);return;}dcard.style.transform='';dcard.querySelectorAll('.dk').forEach(k=>{k.style.opacity='';});};
dcard.addEventListener('pointerup',dcEnd);dcard.addEventListener('pointercancel',dcEnd);
dcard.addEventListener('click',e=>{const b=e.target.closest('[data-dk]');if(!b)return;if(b.dataset.dk==='light')lighten();else quitDeck();});

/* ───────────── Sortie par geste ───────────── */
function exitStudio(){if(S.exited)return;S.exited=true;closeSheets(true);hidePeek();stageEl.style.transform='';stageEl.style.borderRadius='';stageEl.classList.add('out');stageEl.setAttribute('aria-hidden','true');
  homeEl.classList.add('on');homeEl.setAttribute('aria-hidden','false');homeCard.tabIndex=0;setTimeout(()=>homeCard.focus({preventScroll:true}),420);haptic('light');say('Studio fermé. Retour à Mon matériel.');}
function enterStudio(){if(!S.exited)return;S.exited=false;homeEl.classList.remove('on');homeEl.setAttribute('aria-hidden','true');homeCard.tabIndex=-1;stageEl.classList.remove('out');stageEl.removeAttribute('aria-hidden');setTimeout(()=>canvas.focus({preventScroll:true}),300);haptic('light');}
homeCard.addEventListener('click',enterStudio);

/* Clavier */
document.addEventListener('keydown',e=>{if(S.exited)return;
  if(S.deck){if(e.key==='Escape'){quitDeck();e.preventDefault();}else if(deckCur()&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){deckDecide(e.key==='ArrowRight');e.preventDefault();}return;}
  if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')){undo();e.preventDefault();return;}
  if(e.key==='Escape'){if(!coachEl.hidden){endCoach();}else if(S.sheet)closeSheets();else if(S.mode==='custo'){if(S.pexT>.5)S.pexT=0;else setMode('gestion');}else if(S.swap||S.filter){S.swap=null;S.filter=null;renderRail();}else if(S.exT>.5)S.exT=0;else exitStudio();e.preventDefault();return;}
  if(S.sheet||e.target.tagName==='INPUT')return;if(e.key===' '&&e.target.tagName==='BUTTON')return;
  if(e.key==='m'||e.key==='M'){setMode(S.mode==='custo'?'gestion':'custo');e.preventDefault();return;}
  const C=S.mode==='custo';
  switch(e.key){case 'ArrowLeft':goZone(S.sT-1);break;case 'ArrowRight':goZone(S.sT+1);break;case 'ArrowUp':if(C)openPart(S.part,0);else openInv();break;case 'ArrowDown':openTop(0);break;
    case ' ':if(C)S.pexT=S.pexT>.5?0:1;else S.exT=S.exT>.5?0:1;haptic('light');break;case 'r':case 'R':if(!C)autopack();break;case 'k':case 'K':switchKit(1);break;default:return;}e.preventDefault();});

/* ───────────── Premier lancement : 5 gestes ───────────── */
const STEPS=['Glisse pour faire le tour du sac','Monte un objet dans le sac','Écarte deux doigts pour tout voir','Ici : contenu ou apparence','Glisse depuis le bord pour sortir'];let ci=0,coT;
function showStep(){coachEl.className='coach s'+(ci+1);$('coachCap').textContent=STEPS[ci];clearTimeout(coT);coT=setTimeout(nextStep,RM?3800:3000);}
function nextStep(){ci++;if(ci>=STEPS.length){endCoach();return;}showStep();}
function endCoach(){clearTimeout(coT);coachEl.hidden=true;try{localStorage.setItem('lkdv-kit-studio-coach','1');}catch(_){}}
function startCoach(force){let seen=false;try{seen=localStorage.getItem('lkdv-kit-studio-coach')==='1';}catch(_){}if(seen&&!force)return;ci=0;coachEl.hidden=false;showStep();}
coachEl.addEventListener('pointerdown',e=>{e.preventDefault();haptic('sel');nextStep();});

/* Thème */
function applyTheme(){renderer.toneMappingExposure=1.0;cage.material.color.set(0x17402C);}
document.addEventListener('visibilitychange',()=>{last=performance.now();});

/* ───────────── Démarrage ───────────── */
/* Accès de test (parité) : ?debug=1 expose le moteur, sans effet sinon */
if(/[?&]debug=1/.test(location.search))window.__ks={S,KS,CFG,DEF,INV,BAGS,CW,ONE,MODS,OWN,ORDER,ZONES,kit,cfg,totals,bagWeight,totalCap,capOf,cog,cogState,blockers,readiness,tips,pieces,pieceState,pieceCw,orderTotal,toOrder,ptsUsed,ptsCap,modOn,optList,loadKit,setMode,applyOpt,toggleMod,setBag,autopack,effG,cabinDims,activeGhosts,reindex,confirmOrder,openOrder,openInv,openBag,openPart,openTop,closeSheets};
resize();initBag();applyTheme();loadKit(0,true);glassSeg(modesEl);glassSeg(catsEl);renderOrderBtn();renderIsland();renderDots(false);renderRail();moveLens(modesEl,0);window.addEventListener('resize',()=>{moveLens(modesEl,S.mode==='custo'?1:0);if(S.mode==='custo')moveLens(catsEl,catsFor(S.part).indexOf(S.cat));});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
setTimeout(()=>{hud(kit().n,kit().ctx,2400);showKitName();},450);
setTimeout(()=>startCoach(false),1700);
try{Object.assign(S.hints,JSON.parse(localStorage.getItem('lkdv-kit-studio-hints')||'{}'));}catch(_){}
function routeHash(){const h=decodeURIComponent(location.hash.slice(1));if(!h||!INVMAP.has(h)||!zoneOf(h))return;if(S.mode==='custo')setMode('gestion',true);const z=zoneOf(h);goZone(z==='worn'?0:ZI[z]);setTimeout(()=>openItem(h,0),450);}
window.addEventListener('hashchange',routeHash);setTimeout(routeHash,700);
})();
