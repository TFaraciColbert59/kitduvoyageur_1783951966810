<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Le Kit du Voyageur</title>
  <meta name="theme-color" content="#17402C">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #17402C;
      color: #FBFAF6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      text-align: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.4s ease-out;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #FBFAF6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      opacity: 0.8;
      max-width: 260px;
      line-height: 1.4;
    }
    .loader {
      margin-top: 12px;
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FBFAF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="m8 3 4 8 5-5 5 15H2L8 3z"></path>
      </svg>
    </div>
    <h1>Le Kit du Voyageur</h1>
    <p>Chargement de l'expérience outdoor...</p>
    <div class="loader"></div>
  </div>
  <script>
    // Automatic redirection if loaded as fallback or root
    (function() {
      var serverUrl = window.location.origin;
      if (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') {
        // When running in pure local webview, navigate to root app or cached shell
        if (navigator.onLine) {
          // Check if remote host is specified or fallback to home
          window.location.replace('/');
        } else {
          // Offline fallback
          window.location.replace('/offline.html');
        }
      } else {
        // Web context: go to home
        window.location.replace('/');
      }
    })();
  </script>
</body>
</html>
