<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17402C" />
    <title>Le Kit du Voyageur</title>
    <style>
      :root {
        --green: #17402c;
        --cream: #fbfaf6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--green);
        color: var(--cream);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
        padding: 24px;
      }
      .brand {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(251, 250, 246, 0.25);
        border-top-color: var(--cream);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .msg { font-size: 13px; opacity: 0.8; max-width: 320px; line-height: 1.5; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="brand">Le Kit du Voyageur</div>
    <div class="spinner" role="status" aria-label="Chargement"></div>
    <p class="msg">Chargement de l'application…</p>

    <script>
      // When Capacitor is configured with a server.url (deployed Next.js app),
      // the native shell loads it instead of this local file. If no server URL is
      // configured, surface a clear message rather than a blank screen.
      if (!window.Capacitor || !window.Capacitor.getServerUrl || !window.Capacitor.getServerUrl()) {
        document.querySelector(".msg").textContent =
          "Application en cours de connexion au serveur. Configurez capacitor.config server.url pour charger l'app déployée.";
      }
    </script>
  </body>
</html>
