      const dust = document.getElementById("a-dust"); let s = 11; const dots = [];
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);

        const a = rnd() * Math.PI * 2, r0 = rnd() * 300, r1 = 300 + rnd() * 900, sz = 4 + rnd() * 12;
