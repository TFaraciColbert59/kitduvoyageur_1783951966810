      const ids = ["#m-c1", "#m-c2", "#m-c3", "#m-c4", "#m-c5", "#m-c6"];

        tl.fromTo(ids[i], { x: 1100, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t);
