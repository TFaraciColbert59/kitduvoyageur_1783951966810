<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>p16 · Bouteille à la mer</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--sage); }
  #bg { background: radial-gradient(80% 50% at 60% 40%, #6a9163 0%, #5B7F55 60%, #4b6b46 100%); }
  #club { left: 60px; top: 240px; width: 470px; padding: 34px; border-radius: 48px; background: rgba(250,248,245,0.92); box-shadow: 0 30px 60px rgba(11,31,23,0.25); transform: rotate(-3deg); }
  #club .sh { width: 110px; height: 130px; }
  #club b { display: block; font-size: 44px; color: var(--forest); font-weight: 800; margin-top: 16px; line-height: 1.1; }
  #club span { font-size: 34px; color: var(--label2); }
  #tom { left: 420px; top: 330px; width: 150px; height: 150px; border: 7px solid var(--stone); box-shadow: 0 16px 34px rgba(11,31,23,0.3); }
  #arc { left: 0; top: 0; }
  #bottle { left: 410px; top: 470px; width: 570px; padding: 34px 36px; border-radius: 48px; background: var(--stone); box-shadow: 0 0 0 6px var(--brass), 0 40px 80px rgba(11,31,23,0.35); transform: rotate(-9deg); }
  #bottle .k { font-size: 32px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; color: var(--bronze); text-transform: uppercase; }
  #bottle b { display: block; white-space: nowrap; font-size: 44px; font-weight: 800; color: var(--forest); margin: 10px 0 8px; line-height: 1.1; }
  #bottle span { font-size: 34px; color: var(--label2); }
  #bottle .sea { margin-top: 18px; height: 64px; padding: 0 24px; background: var(--forest); color: var(--stone); font-size: 34px; font-weight: 700; }
  #bottleg { left: 330px; top: 640px; width: 520px; height: 300px; border-radius: 48px; background: rgba(250,248,245,0.28); transform: rotate(-40deg); filter: blur(10px); }
  .rep { left: 60px; height: 116px; padding: 0 30px 0 10px; gap: 20px; background: rgba(250,248,245,0.95); box-shadow: 0 18px 40px rgba(11,31,23,0.25); font-size: 38px; font-weight: 700; color: var(--forest); }
  .rep img { width: 96px; height: 96px; }
  .rep em { font-style: normal; font-weight: 500; color: var(--label2); font-size: 34px; }
  .rep .ok { height: 76px; padding: 0 26px; border-radius: 999px; background: var(--forest); color: #fff; font-size: 34px; display: inline-flex; align-items: center; }
  #gar { left: 64px; top: 1200px; font-size: 80px; color: var(--stone); }
  #word { left: 56px; top: 1272px; color: var(--stone); }
  #wordg { left: 78px; top: 1258px; color: var(--brass); filter: blur(3px); }
</style></head>
<body><div id="frame">
  <div id="bg" class="fill"></div>
  <div id="club" class="abs">
    <svg class="sh" viewBox="0 0 44 52"><path d="M22 2 L42 9 V26 C42 39 32 47 22 50 C12 47 2 39 2 26 V9 Z" fill="#17402C"/><path d="M14 18 l4-6 3 4 4-6 5 8" fill="none" stroke="#FAF8F5" stroke-width="2"/><text x="22" y="40" text-anchor="middle" font-family="Inter" font-weight="800" font-size="16" fill="#FAF8F5">S</text></svg>
    <b>Sentiers pour Tous</b><span>Accessibilité · 7 membres</span>

  <div class="rep abs pill" style="top:850px; left:70px; transform: scale(0.94) rotate(-2deg); filter: blur(0.8px)"><img class="av" src="assets/avatars/a12.jpg">Lou <em>confiance 68/100</em></div>
