<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>p06 · Une phrase</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--forest); }

  #wordg { left: 80px; top: 1136px; color: var(--stone); filter: blur(3px); line-height: 0.86; }

  <div id="word" class="abs slam" data-fit="960" data-max="280" data-ghost="wordg">FIN<br>NOVEMBRE</div>
