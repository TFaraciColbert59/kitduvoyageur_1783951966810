  <script>
    (function () {
      // Plan 20 · bible 25,862 → 28,140 ; hôte à 25,662 : local = film − 25,662.
      const F = 1 / 30;
      const L = (T) => +(T - 25.662).toFixed(4);
      const tl = gsap.timeline({ paused: true });
      function slam(el, ghost, t) {
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { scale: 1.45 }, { scale: 0.93, duration: 3 * F, ease: "power2.out", immediateRender: false }, t);
        tl.to(el, { scale: 1, duration: 4 * F, ease: "sine.inOut" }, t + 3 * F);
        if (ghost) {
          tl.set(ghost, { opacity: 0.35 }, t);
          tl.fromTo(ghost, { scale: 1.75 }, { scale: 1.2, duration: 2 * F, ease: "none", immediateRender: false }, t);
          tl.set(ghost, { opacity: 0 }, t + 2 * F);
        }
      }
      function out(els, t) {
        tl.to(els, { scale: 0.82, opacity: 0, filter: "blur(10px)", duration: 3 * F, ease: "power3.in" }, t);
      }

      // ---- Géométrie : globe de 1000 px centré en (540, 600), tourné de −8° (parent fixe) et de SPIN0 (animé).
      const GC = [540, 600], PL = [316 - 500, 928 - 500], SPIN0 = -25, SPIN1 = 4;
      const th = (-8 + SPIN0) * Math.PI / 180;
      const PW = [GC[0] + PL[0] * Math.cos(th) - PL[1] * Math.sin(th), GC[1] + PL[0] * Math.sin(th) + PL[1] * Math.cos(th)];
      const C = [540, 860];                 // point de rencontre à l'écran (plans 18-19)
      const S0 = 2880 / 5;                  // satellite de 5 px sur le globe, affiché à 2 880 px (×1,8) au départ
      const LN = Math.log(S0);
      const z = { u: 0, q: 1 };
      const cam = document.getElementById("s20-cam"), dot = document.getElementById("s20-dot");
      const earth = ["#s20-earth", "#s20-atm"];
      function draw() {
        const s = Math.exp(LN * (1 - z.u)) * z.q;
        const k = z.u * z.u * (3 - 2 * z.u);
        const ax = C[0] + (PW[0] - C[0]) * k, ay = C[1] + (PW[1] - C[1]) * k;
        gsap.set(cam, { x: ax - s * PW[0], y: ay - s * PW[1], scale: s, transformOrigin: "0px 0px" });
        gsap.set(dot, { scale: 1 / s });
        gsap.set(earth, { opacity: s > 300 ? 0 : 1 });
        // le satellite net s'efface dans le globe quand il devient petit (pas de « pièce » visible)
        gsap.set("#s20-sat", { opacity: Math.min(1, Math.max(0, (s - 40) / 160)) });
      }
      gsap.set("#s20-spin", { rotation: SPIN0, transformOrigin: "50% 50%" });
      draw();

      // Entrée (0 → 0,1) : même cadrage que la fin du plan 19 (satellite assombri, point de rencontre).
      tl.to("#s20-all", { opacity: 1, duration: 3 * F, ease: "none" }, 0);
      // 25,862 → 26,508 : le recul s'accélère du point de rencontre jusqu'à la Terre entière.
      const tB = L(26.508);
      tl.to(z, { u: 1, duration: tB - 0.2, ease: "power2.in", onUpdate: draw }, 0.2);
      tl.to("#s20-sdim", { opacity: 0.2, duration: tB - 0.2, ease: "power1.in" }, 0.2);
      // Cassure 26,508 : arrêt brutal (dépassement 0,965) ; le globe tourne et s'allume depuis la Patagonie.
      tl.to(z, { q: 0.965, duration: 3 * F, ease: "power2.out", onUpdate: draw }, tB);
      tl.to(z, { q: 1, duration: 4 * F, ease: "sine.inOut", onUpdate: draw }, tB + 3 * F);
      tl.to("#s20-spin", { rotation: SPIN1, duration: 2.478 - tB, ease: "power3.out" }, tB);
      tl.set("#s20-lieux", { opacity: 1 }, tB);
      tl.to("#s20-lieux", { "--s20r": "1500px", duration: 1.15, ease: "power2.out" }, tB);
      tl.fromTo("#s20-sky", { x: 0, y: 0 }, { x: -40, y: 30, duration: 2.478, ease: "none" }, 0);
      tl.to("#s20-shade", { opacity: 1, duration: 0.25, ease: "power1.out" }, tB - 0.1);

      // « 367 747 » + « LIEUX » (26,508 · 26,670).
      slam("#s20-n1", "#s20-n1g", tB);
      slam("#s20-w1", null, L(26.67));
      // 27,155 : « 246 » + « PAYS » ; le premier chiffre passe en rappel ; les arcs de la chaîne se tracent.
      const tP = L(27.155);
      out(["#s20-n1", "#s20-w1"], tP - 3 * F);
      tl.fromTo("#s20-lab1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, tP);
      slam("#s20-n2", "#s20-n2g", tP);
      slam("#s20-w2", null, L(27.317));
      tl.to("#s20-a1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, tP);
      tl.to(["#s20-a2", "#s20-a3"], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, tP + 0.12);
      tl.to("#s20-e1", { opacity: 1, duration: 2 * F, ease: "none" }, tP + 0.3);
      // 27,801 : « 18 176 400 » + « aventures possibles ».
      const tA = L(27.801);
      out(["#s20-n2", "#s20-w2"], tA - 3 * F);
      tl.set("#s20-lab1", { opacity: 0 }, tA);
      tl.set("#s20-lab2", { opacity: 1 }, tA);
      slam("#s20-n3", "#s20-n3g", tA);
      slam("#s20-w3", null, L(27.933));

      tl.set({}, {}, 2.478);
      window.__timelines["s20"] = tl;
    })();
