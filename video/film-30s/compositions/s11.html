  <script>
    (function () {
      const ID = "s11";
      const DUR = 0.847;
      const F = 1 / 30;
      const O = 13.377;
      const L = (T) => +(T - O).toFixed(4);
      const T_CUT = L(13.577);  // cassure : l'aspiration commence
      const T_DOT = L(13.844);  // fin de l'aspiration (8 images) : le point seul
      const T_SIL = L(13.955);  // quasi-silence
      const T_END = DUR;        // 14,224 : la ligne devient la trace de s12

      // Traînées et éclats (générateur à graine fixe).
      let seed = 3;
      const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const fx = document.getElementById("s11-fx");
      const rays = [];
      for (let i = 0; i < 46; i++) {
        const a = r() * 360, d0 = 70 + r() * 120, len = 140 + r() * 420, h = 2 + r() * 8;
        const col = r() < 0.4 ? "208,160,112" : r() < 0.5 ? "91,127,85" : "250,248,245";
        const ray = document.createElement("div");
        ray.className = "s11-ray";
        ray.style.transform = "rotate(" + a.toFixed(1) + "deg)";
        const s = document.createElement("div");
        s.className = "s11-s";
        s.style.width = len.toFixed(0) + "px";
        s.style.height = h.toFixed(1) + "px";
        s.style.top = (-h / 2).toFixed(1) + "px";
        s.style.background = "linear-gradient(90deg, rgba(" + col + ",0.9), rgba(" + col + ",0))";
        ray.appendChild(s);
        fx.appendChild(ray);
        rays.push({ el: s, d0, far: 700 + r() * 600, delay: r() * 3 * F });
      }
      const frags = [];
      for (let i = 0; i < 9; i++) {
        const a = r() * 360, d = 230 + r() * 260, w = 40 + r() * 70;
        const ray = document.createElement("div");
        ray.className = "s11-ray";
        ray.style.transform = "rotate(" + a.toFixed(1) + "deg)";
        const f = document.createElement("div");
        f.className = "s11-frag";
        f.style.width = (w * 1.8).toFixed(0) + "px";
        f.style.height = (w * 0.6).toFixed(0) + "px";
        f.style.top = (-w * 0.3).toFixed(0) + "px";
        if (i % 3 === 0) f.style.background = "rgba(208,160,112,0.55)";
        ray.appendChild(f);
        fx.appendChild(ray);
        frags.push({ el: f, far: d + 500, delay: r() * 2 * F });
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s11-all", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, T_CUT - 0.001);
      // Réplique de s10 à 13,577 (même état), puis aspirée vers le point en 8 images (expo.in).
      tl.fromTo("#s11-repd", { scale: 1.06 }, { scale: 1.06, duration: 0.001 }, 0);
      tl.fromTo("#s11-behind", { x: -30, y: -12 }, { x: -30, y: -12, duration: 0.001 }, 0);
      tl.fromTo("#s11-rep", { scale: 1, rotation: 0, filter: "blur(0px)", opacity: 1 }, { scale: 0.015, rotation: 24, filter: "blur(14px)", duration: 8 * F, ease: "expo.in" }, T_CUT);
      tl.to("#s11-rep", { opacity: 0, duration: F, ease: "none" }, T_CUT + 8 * F - F);
      // Traînées qui convergent vers le point.
      rays.forEach(({ el, d0, far, delay }) => {
        const t0 = T_CUT + delay;
        tl.fromTo(el, { x: far, opacity: 0 }, { x: d0 * 0.15, duration: 8 * F - delay, ease: "expo.in" }, t0);
        tl.to(el, { opacity: 0.9, duration: 2 * F, ease: "none" }, t0);
        tl.to(el, { opacity: 0, scaleX: 0.2, duration: 4 * F, ease: "power2.in" }, T_DOT - F);
      });
      frags.forEach(({ el, far, delay }) => {
        const t0 = T_CUT + delay;
        tl.fromTo(el, { x: far, opacity: 0, scaleX: 1 }, { x: 0, scaleX: 0.3, duration: 8 * F - delay, ease: "expo.in" }, t0);
        tl.to(el, { opacity: 1, duration: 2 * F, ease: "none" }, t0);
        tl.to(el, { opacity: 0, duration: F, ease: "none" }, T_DOT);
      });
      // Le point : naît à la cassure, s'allume en fin d'aspiration, puis reste seul et net.
      tl.fromTo("#s11-pt", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 8 * F, ease: "expo.in" }, T_CUT);
      tl.to("#s11-pt", { scale: 1.35, duration: 2 * F, ease: "power2.out" }, T_DOT);
      tl.to("#s11-pt", { scale: 1, duration: 5 * F, ease: "expo.out" }, T_DOT + 2 * F);
      tl.fromTo("#s11-halo", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.6, duration: 3 * F, ease: "expo.out" }, T_DOT);
      tl.to("#s11-halo", { opacity: 0.35, scale: 1, duration: 0.3, ease: "power2.out" }, T_DOT + 3 * F);
      // Pendant le quasi-silence : la ligne fine naît vers le bas ; la caméra pousse à peine (3 %/s).
      tl.fromTo("#s11-line", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: T_END - T_SIL, ease: "power2.in" }, T_SIL);
      tl.fromTo("#s11-push", { scale: 1 }, { scale: 1.03, duration: T_END - T_DOT, ease: "none" }, T_DOT);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
