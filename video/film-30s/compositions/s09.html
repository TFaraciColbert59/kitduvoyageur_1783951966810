<template>
  <style>
    #root { position:absolute; inset:0; overflow:hidden; font-family:"Inter",sans-serif; background:transparent; }
    #s09-flat { position:absolute; inset:0; background:#17402C; opacity:0; }
    #s09-grad { position:absolute; inset:-60px; background:radial-gradient(90% 60% at 50% 46%, #22573c 0%, #17402C 55%, #0f2c1e 100%); opacity:0; }
    #s09-shake { position:absolute; inset:0; }
    #s09-cam { position:absolute; inset:0; }
    #s09-floor { position:absolute; left:-200px; right:-200px; top:1240px; height:420px; background:radial-gradient(50% 50% at 50% 30%, rgba(6,18,12,0.55), rgba(6,18,12,0) 70%); }
    #s09-canvas { position:absolute; left:0; top:0; width:1080px; height:1920px; }
    #s09-glow { position:absolute; left:0; top:0; width:360px; height:360px; margin:-180px 0 0 -180px; border-radius:50%; background:radial-gradient(circle, rgba(208,160,112,0.62) 0%, rgba(208,160,112,0.22) 38%, rgba(208,160,112,0) 70%); mix-blend-mode:screen; opacity:0; }
    #s09-pill { position:absolute; left:60px; top:250px; height:92px; padding:0 40px 0 34px; border-radius:999px; background:rgba(6,18,12,0.42); border:2px solid rgba(250,248,245,0.22); display:flex; align-items:center; gap:18px; color:#FAF8F5; font-size:40px; font-weight:700; white-space:nowrap; }
    #s09-pill i { display:block; width:22px; height:22px; border-radius:50%; background:#D0A070; box-shadow:0 0 0 7px rgba(208,160,112,0.22); }
    #s09-pill .s09-lab { color:rgba(250,248,245,0.72); font-weight:600; }
    #s09-cap { position:relative; display:inline-block; width:110px; height:92px; overflow:hidden; }
    .s09-c { position:absolute; left:0; top:0; height:92px; line-height:92px; color:#D0A070; font-weight:900; }
    .s09-slam { position:absolute; left:60px; top:1130px; font-weight:900; font-size:300px; letter-spacing:-0.04em; line-height:0.86; white-space:nowrap; color:#FAF8F5; transform-origin:30% 60%; }
    .s09-ghost { color:#D0A070; filter:blur(3px); opacity:0; }
    .s09-dot { color:#D0A070; }
    #s09-gar { position:absolute; left:70px; top:1392px; font-family:"EB Garamond", Georgia, serif; font-style:italic; font-weight:500; font-size:76px; color:#FAF8F5; text-shadow:0 4px 24px rgba(6,18,12,0.8); white-space:nowrap; }
    #s09-gar b { font-weight:600; color:#D0A070; }
    #s09-gar span { display:inline-block; }
  </style>
  <div id="root" data-composition-id="s09" data-width="1080" data-height="1920" data-layout-allow-overlap>
    <div id="s09-flat"></div>
    <div id="s09-grad"></div>
    <div id="s09-shake" data-layout-allow-overflow>
      <div id="s09-cam" data-layout-allow-overflow>
        <div id="s09-floor"></div>
        <canvas id="s09-canvas" width="1080" height="1920"></canvas>
        <div id="s09-glow" data-layout-ignore></div>
      </div>
      <div id="s09-pill"><i></i><span class="s09-lab">LKDV ONE</span><span id="s09-cap"><span class="s09-c" id="s09-c45">45 L</span><span class="s09-c" id="s09-c60">60 L</span></span></div>
      <div id="s09-tong" class="s09-slam s09-ghost" data-layout-ignore>TON</div>
      <div id="s09-ton" class="s09-slam">TON</div>
      <div id="s09-sacg" class="s09-slam s09-ghost" data-layout-ignore>SAC.</div>
      <div id="s09-sac" class="s09-slam">SAC<span class="s09-dot">.</span></div>
      <div id="s09-gar"><b><span class="s09-gw">1&#8239;244</span></b> <span class="s09-gw">sacs</span> <span class="s09-gw">possibles</span></div>
    </div>
  </div>
  <script>
    (function () {
      const ID = "s09";
      const DUR = 2.786;
      const F = 1 / 30;
      const O = 10.145; // temps du film au temps local 0 (début de la bible − 0,2 s)
      const L = (T) => +(T - O).toFixed(4);
      // Événements (temps du film → local)
      const T_IN = L(10.345);  // plein Forest, la 3D naît, « TON »
      const T_SAC = L(10.668); // « SAC. »
      const T_M04 = L(10.994); // M04 se clipse + gros plan sur la pièce cousue LKDV
      const T_GAR = L(11.162); // « 1 244 sacs possibles »
      const T_M13 = L(11.627); // M13 se clipse (il cache la pièce)
      const T_60 = L(12.284);  // 45 → 60 L
      const T_OUT = L(12.731); // sortie : la caméra fonce dans le sac (PRÊT. claque à 12,931)

      const canvas = document.getElementById("s09-canvas");
      const glow = document.getElementById("s09-glow");
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const FORET = 0x2d482a; // coloris Forêt (Kit Studio, COLORWAYS.foret.body)

      const ready = (async () => {
        const base = new URL("assets/", document.baseURI).href;
        const THREE = await import(base + "lib/three-bundle.js");
        const { GLTFLoader, RoomEnvironment, MeshoptDecoder } = THREE;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1080, 1920, false);
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.92;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environmentIntensity = 0.75;
        const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
        key.position.set(-1.6, 2.6, 2.0);
        key.castShadow = true;
        key.shadow.mapSize.set(1536, 1536);
        Object.assign(key.shadow.camera, { left: -0.9, right: 0.9, top: 0.9, bottom: -0.9, near: 0.5, far: 7 });
        key.shadow.bias = -0.0004;
        key.shadow.normalBias = 0.01;
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xd0a070, 2.2);
        rim.position.set(2.0, 1.4, -1.6);
        scene.add(rim);
        const rim2 = new THREE.DirectionalLight(0xdfe9ff, 0.8);
        rim2.position.set(-2.0, 1.0, -1.8);
        scene.add(rim2);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x17402c, 0.5));
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ color: 0x06120c, opacity: 0.45 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const loader = new GLTFLoader();
        await MeshoptDecoder.ready;
        loader.setMeshoptDecoder(MeshoptDecoder);
        const load = (u) => new Promise((res, rej) => loader.load(base + u, res, undefined, rej));
        const texLoader = new THREE.TextureLoader();
        const loadTex = (u) => new Promise((res, rej) => texLoader.load(base + u, res, undefined, rej));
        const [g45, g60, z45, z60, m04G, m13G] = await Promise.all([
          load("3d/lkdv-one-45.glb"),
          load("3d/lkdv-one-60.glb"),
          loadTex("3d/lkdv-one-45.zones.webp"),
          loadTex("3d/lkdv-one-60.zones.webp"),
          load("3d/lkdv-m04.glb"),
          load("3d/lkdv-m13.glb"),
        ]);

        // Teinte d'atlas du Kit Studio (même code que kit3d-taille.html) + éclat au changement de corps.
        const tintColor = { value: new THREE.Color(FORET) };
        const flashes = [{ value: 0 }, { value: 0 }];
        const logoMats = [];
        const bodies = [g45, g60].map((gl, i) => {
          const zones = [z45, z60][i];
          zones.flipY = false;
          zones.colorSpace = THREE.NoColorSpace;
          gl.scene.traverse((n) => {
            if (!n.isMesh) return;
            n.castShadow = true;
            const m = n.material;
            if (n.name === "LKDV_LOGO" || n.name === "LKDV_ECUSSON_SUPPORT" || (m && (m.name === "LKDV_Ecusson_Tisse" || m.name === "LKDV_MARQUAGE_PIERRE"))) {
              if (i === 0 && m && m.emissive && logoMats.indexOf(m) < 0) logoMats.push(m);
              return;
            }
            if (!m || !m.map) return;
            m.customProgramCacheKey = () => "lkdv-film-tint-s09";
            m.onBeforeCompile = (sh) => {
              sh.uniforms.zonesMap = { value: zones };
              sh.uniforms.tintColor = tintColor;
              sh.uniforms.flash = flashes[i];
              sh.fragmentShader = sh.fragmentShader
                .replace("#include <uv_pars_fragment>", "#include <uv_pars_fragment>\nuniform sampler2D zonesMap;\nuniform vec3 tintColor;\nuniform float flash;")
                .replace(
                  "#include <map_fragment>",
                  "#include <map_fragment>\n#ifdef USE_MAP\n{ float z = texture2D(zonesMap, vMapUv).r; float lum = dot(diffuseColor.rgb, vec3(0.2126,0.7152,0.0722)); diffuseColor.rgb = mix(diffuseColor.rgb, tintColor * lum * 2.2, z); diffuseColor.rgb *= 1.0 + flash; }\n#endif",
                );
            };
            m.needsUpdate = true;
          });
          return gl.scene;
        });
        logoMats.forEach((m) => { m.emissive = new THREE.Color(0xd0a070); m.emissiveIntensity = 0; });

        const V = (x, y, z) => new THREE.Vector3(x, y, z);
        // Centre de la pièce cousue LKDV (maillage réel), pour le gros plan et le halo.
        let patch = V(0, 0.362, 0.14);
        {
          const box = new THREE.Box3();
          let found = false;
          g45.scene.updateMatrixWorld(true);
          g45.scene.traverse((n) => {
            if (n.isMesh && (n.name === "LKDV_LOGO" || n.name === "LKDV_ECUSSON_SUPPORT")) {
              const b = new THREE.Box3().setFromObject(n);
              found ? box.union(b) : box.copy(b);
              found = true;
            }
          });
          if (found) box.getCenter(patch);
        }

        const pickMeshes = (obj) => { const out = []; obj.traverse((n) => n.isMesh && out.push(n)); return out; };
        const ray = new THREE.Raycaster();
        function surface(body, axis, a0, a1, b0, b1) {
          body.updateMatrixWorld(true);
          const meshes = pickMeshes(body);
          let best = -Infinity;
          for (let i = 0; i <= 6; i++) for (let j = 0; j <= 4; j++) {
            const y = a0 + ((a1 - a0) * i) / 6, s = b0 + ((b1 - b0) * j) / 4;
            ray.set(axis === "z" ? V(s, y, 2) : V(2, y, s), axis === "z" ? V(0, 0, -1) : V(-1, 0, 0));
            const hit = ray.intersectObjects(meshes, false)[0];
            if (hit) best = Math.max(best, axis === "z" ? hit.point.z : hit.point.x);
          }
          return best;
        }
        const POSE = [{ m13y: 0.33, m04y: 0.3, m04z: 0.02 }, { m13y: 0.38, m04y: 0.34, m04z: 0.03 }];
        const heights = [];
        const seats = bodies.map((body, i) => {
          const box = new THREE.Box3().setFromObject(body);
          heights.push(box.max.y);
          const p = POSE[i];
          const fz = surface(body, "z", p.m13y - 0.18, p.m13y + 0.18, -0.03, 0.03);
          const fx = surface(body, "x", p.m04y - 0.08, p.m04y + 0.08, p.m04z - 0.05, p.m04z + 0.05);
          return { m13: V(0, p.m13y - 0.225, fz + 0.0415 - 0.006), m04: V(fx + 0.038 - 0.006, p.m04y - 0.1, p.m04z) };
        });

        const rig = new THREE.Group();
        scene.add(rig);
        bodies.forEach((b) => rig.add(b));
        const m04 = m04G.scene, m13 = m13G.scene;
        [m04, m13].forEach((m) => m.traverse((n) => { if (n.isMesh) n.castShadow = true; }));
        rig.add(m04);
        rig.add(m13);

        const camera = new THREE.PerspectiveCamera(24, 1080 / 1920, 0.05, 40);

        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const seg = (t, a, d) => clamp01((t - a) / d);
        const lerp = (a, b, k) => a + (b - a) * k;
        const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
        const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        const in3 = (x) => x * x * x;
        const backOut = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
        const D2R = Math.PI / 180;

        // Clip mécanique : approche qui accélère (0,18 s), contact sur le temps, enfoncement d'1 cm puis retour.
        const APP = 0.18;
        function clip(t, T) {
          if (t < T) { const p = seg(t, T - APP, APP); return { k: 1 - p * p * p, d: 0, tilt: (1 - p) * (1 - p) }; }
          const u = t - T;
          return { k: 0, d: u < 0.4 ? Math.sin((u * Math.PI) / 0.1) * Math.exp(-u / 0.07) : 0, tilt: 0 };
        }

        // Caméra : orbite rapide qui décélère → gros plan sur la pièce LKDV (10,994) → recul large (M13 à 11,627)
        // → orbite lente, 60 L à 12,284 → plongée dans le sac (sortie).
        function cameraAt(t, bi) {
          const h = lerp(heights[0], heights[1], inOut(seg(t, T_60 + 0.02, 0.42)));
          const wideT = V(0.03, h * 0.6, 0.06);
          const closeT = V(patch.x + 0.02, patch.y - 0.05, patch.z);
          // azimut
          let az = lerp(-330, 14, expoOut(seg(t, T_IN, 0.62)));       // 0,2 → 0,82 : rotation rapide qui décélère
          az = lerp(az, 20, seg(t, T_IN + 0.62, 0.6));               // dérive lente pendant le gros plan
          az = lerp(az, 30, expoOut(seg(t, T_M13 - 0.2, 0.18)));     // recul
          az = az + 9 * seg(t, T_M13, DUR - T_M13);                   // orbite lente jusqu'à la fin
          // distance et cible
          let dist = lerp(5.2, 1.95, expoOut(seg(t, T_IN, 0.45)));
          let tgt = wideT.clone();
          const kin = in3(seg(t, T_M04 - 0.2, 0.2));                  // poussée agressive vers la pièce, impact à 10,994
          dist = lerp(dist, 0.86, kin);
          tgt.lerp(closeT, kin);
          dist = lerp(dist, 0.78, seg(t, T_M04, 0.5) * kin);           // la caméra continue d'avancer doucement
          const kout = expoOut(seg(t, T_M13 - 0.22, 0.17));           // dézoom brusque (5 images)
          dist = lerp(dist, 1.85 * (h / heights[0]), kout);
          tgt.lerp(V(0.03, h * 0.6, 0.06), kout);
          dist = dist - 0.12 * seg(t, T_M13, T_OUT - T_M13);         // poussée lente
          const kx = in3(seg(t, T_OUT, DUR - T_OUT));                 // sortie : on fonce dans la façade
          dist = lerp(dist, 0.32, kx);
          const el = lerp(7, 3, kin) * D2R;
          const a = az * D2R;
          camera.position.set(tgt.x + Math.sin(a) * Math.cos(el) * dist, tgt.y + Math.sin(el) * dist, tgt.z + Math.cos(a) * Math.cos(el) * dist);
          camera.lookAt(tgt);
          camera.updateMatrixWorld(true);
        }

        const tmp = new THREE.Vector3();
        function render(t) {
          const bi = t < T_60 ? 0 : 1;
          bodies.forEach((b, i) => (b.visible = i === bi));
          flashes.forEach((f) => (f.value = 0));
          if (bi === 1) {
            const s = backOut(seg(t, T_60, 0.22));
            rig.scale.set(lerp(1.03, 1, s), lerp(0.94, 1, s), lerp(1.03, 1, s));
            flashes[1].value = 0.7 * Math.pow(1 - seg(t, T_60, 0.1), 2);
          } else rig.scale.set(1, 1, 1);
          const seat = seats[bi];
          const a = clip(t, T_M04);
          m04.visible = t >= T_M04 - APP;
          m04.position.set(seat.m04.x + a.k * 0.3 - a.d * 0.01, seat.m04.y + a.k * 0.08, seat.m04.z);
          m04.rotation.set(0, Math.PI / 2, -a.tilt * 0.12);
          const b = clip(t, T_M13);
          m13.visible = t >= T_M13 - APP;
          m13.position.set(seat.m13.x, seat.m13.y + b.k * 0.16, seat.m13.z + b.k * 0.22 - b.d * 0.01);
          m13.rotation.set(-b.tilt * 0.14, 0, 0);
          // La pièce cousue s'allume en laiton au gros plan (10,994), s'éteint quand le M13 la couvre.
          const lit = t < T_M04 - 0.06 ? 0 : t < T_M04 ? (t - (T_M04 - 0.06)) / 0.06 : Math.max(0, 1 - seg(t, T_M04 + 0.25, 0.4)) ;
          logoMats.forEach((m) => (m.emissiveIntensity = 0.55 * lit));
          cameraAt(t, bi);
          renderer.render(scene, camera);
          tmp.copy(patch).project(camera);
          glow.style.left = (((tmp.x + 1) / 2) * 1080).toFixed(1) + "px";
          glow.style.top = (((1 - tmp.y) / 2) * 1920).toFixed(1) + "px";
          glow.style.opacity = (t < T_M13 - 0.05 ? lit : 0).toFixed(3);
        }

        bodies.forEach((b) => (b.visible = true));
        m04.visible = m13.visible = true;
        cameraAt(1.6, 0);
        await renderer.compileAsync(scene, camera);
        render(T_IN);
        render(T_60 + 0.05);
        render(0);
        return render;
      })();
      window.__hf.buildReady[ID] = ready;

      ready.then((render) => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);

        // Fond : plein Forest à 10,345 (raccord avec la tuile de s08), le dégradé s'installe ensuite.
        tl.fromTo("#s09-flat", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, T_IN - 0.001);
        tl.fromTo("#s09-grad", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, T_IN);
        tl.fromTo("#s09-cam", { opacity: 0, filter: "blur(12px)", scale: 0.86 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.2, ease: "expo.out" }, T_IN);
        tl.fromTo("#s09-floor", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T_IN + 0.05);

        // Mot qui claque : 1,45 → 0,93 (3 images) → 1 (4 images), opacité en 1 image, fantôme 2 images.
        function slam(sel, ghost, t) {
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, t);
          tl.fromTo(sel, { scale: 1.45 }, { scale: 0.93, duration: 3 * F, ease: "power2.out" }, t);
          tl.to(sel, { scale: 1, duration: 4 * F, ease: "sine.inOut" }, t + 3 * F);
          tl.fromTo(ghost, { opacity: 0, x: 24, y: -14, scale: 1.12 }, { opacity: 0.35, duration: 0.001, ease: "none" }, t);
          tl.to(ghost, { opacity: 0, x: 30, y: -18, scale: 1.18, duration: 2 * F - 0.001, ease: "none" }, t + 0.001);
        }
        function out(sel, t) {
          tl.to(sel, { scale: 0.82, filter: "blur(10px)", opacity: 0, duration: 3 * F, ease: "power3.in" }, t);
        }
        slam("#s09-ton", "#s09-tong", T_IN);
        out("#s09-ton", T_SAC - 3 * F);
        slam("#s09-sac", "#s09-sacg", T_SAC);
        tl.fromTo(".s09-gw", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, T_GAR);
        out("#s09-sac", T_OUT - 0.1);
        tl.to("#s09-gar", { opacity: 0, filter: "blur(8px)", duration: 0.1, ease: "power3.in" }, T_OUT - 0.1);

        // Pastille LKDV ONE : 45 L → 60 L sur le temps.
        tl.fromTo("#s09-pill", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, T_IN + 0.08);
        tl.fromTo("#s09-c45", { y: 0 }, { y: -92, duration: 0.08, ease: "power2.in" }, T_60 - 0.06);
        tl.fromTo("#s09-c60", { y: 92 }, { y: 0, duration: 0.18, ease: "expo.out" }, T_60);
        tl.to("#s09-pill", { opacity: 0, x: -30, duration: 0.1, ease: "power3.in" }, T_OUT - 0.05);

        // Secousses (4 images, 14 px puis 6 px, amorties) sur chaque clip et sur le passage en 60 L.
        function shake(t, a) {
          const seq = [[a, -0.5 * a], [-0.6 * a, 0.45 * a], [0.43 * a, -0.3 * a], [-0.15 * a, 0.1 * a], [0, 0]];
          seq.forEach(([x, y], i) => tl.to("#s09-shake", { x, y, duration: F, ease: "none" }, t + i * F));
        }
        shake(T_M04, 14);
        shake(T_M13, 14);
        shake(T_60, 8);

        // Sortie : la caméra fonce (le canevas se floute en accélérant), PRÊT. claque par-dessus à 12,931.
        tl.to("#s09-cam", { filter: "blur(14px)", scale: 1.18, duration: DUR - T_OUT, ease: "power3.in" }, T_OUT);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
