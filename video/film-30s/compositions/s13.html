  <script>

      const T_SOS = L(16.335);   // SOS (brique)

      // Tracé OSM réel du W et des liaisons (coordonnées de sat-w.jpg, 1600 × 2600).

1600.8],[888.8,1617.7],[891.6,1623.4],[896.9,1627.0],[894.8,1632.3],[900.9,1652.3],[899.9,1679.1],[904.2,1686.9],[912.9,1725.1],[920.0,1730.9],[915.5,1752.3],[924.2,1767.0],[920.4,1771.4],[915.5,1770.6],[910.7,1777.1],[913.7,1785.7],[895.6,1821.7],[914.0,1848.8],[924.8,1853.8],[927.8,1850.8],[934.1,1850.1]],"leg3":[[934.1,1850.1],[928.3,1850.6],[925.7,1853.8],[914.0,1848.8],[895.6,1821.7],[913.7,1785.7],[910.7,1777.1],[915.5,1770.6],[920.4,1771.4],[924.2,1767.0],[915.7,1753.2],[920.0,1730.9],[912.9,1725.1],[907.6,1699.6],[910.1,1678.5],[907.4,1670.5],[908.1,1663.0],[914.4,1655.6],[915.7,1650.6],[922.0,1647.8],[923.5,1639.6],[940.8,1617.4],[963.7,1609.9],[974.5,1601.1],[984.1,1598.8],[989.6,1588.7],[1000.9,1583.4],[1027.6,1557.1],[1037.2,1553.5],[1037.2,1547.2],[1032.6,1539.5],[1037.5,1525.9],[1033.7,1487.2],[1043.2,1458.2],[1041.2,1444.9],[1054.3,1430.5],[1048.5,1427.7],[1040.4,1428.5],[1037.5,1423.2],[1028.1,1415.5],[1018.3,1379.8],[1020.4,1374.4],[1015.5,1364.6],[1029.9,1359.9]]},"stops":[{"name":"Refugio Chileno","x":1078.8,"y":701.2},{"name":"Hostería Pehoé","x":827.5,"y":1418.9},{"name":"Villa Monzino (Administración Parque Torres del Paine)","x":934.1,"y":1850.1},{"name":"Torres del Paine","x":1030.0,"y":1360.0}]};
      const svg = document.getElementById("s13-svg");
      const NS = "http://www.w3.org/2000/svg";

      const mk = (d, stroke, w, extra) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", stroke);
        p.setAttribute("stroke-width", w);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round");
        if (extra) Object.entries(extra).forEach(([k, v]) => p.setAttribute(k, v));
        svg.appendChild(p);
        return p;
      };

        const d = dOf(pts);

      // La carte 3D réelle explose en plein cadre (×0,45 → ×1,08, flou 24 → 0), puis rotation Z 8° et ×1,3 sur 16,164.

      tl.fromTo("#s13-world", { filter: "blur(24px)" }, { filter: "blur(0px)", duration: 6 * F, ease: "expo.out" }, T_FL);
      tl.set("#s13-world", { filter: "none" }, T_FL + 6 * F);
      tl.to("#s13-plane", { scale: 1.12, duration: T_ROT - T_FL - 6 * F, ease: "none" }, T_FL + 6 * F);
      tl.to("#s13-plane", { rotationZ: 8, scale: 1.3, duration: 0.38, ease: "expo.out" }, T_ROT);
      tl.to("#s13-plane", { rotationZ: 9.5, scale: 1.36, duration: DUR - T_ROT - 0.38, ease: "none" }, T_ROT + 0.38);

      // La trace file depuis le Refugio Chileno ; la position en direct suit sa tête.
      const prog = { p: 0.3 };
      const mew = document.getElementById("s13-mew");
      const place = () => {
        const pt = wLine.getPointAtLength(WLEN * prog.p);
        wLine.setAttribute("stroke-dashoffset", (WLEN * (1 - prog.p)).toFixed(1));
        wGlow.setAttribute("stroke-dashoffset", (WLEN * (1 - prog.p)).toFixed(1));
        gsap.set(mew, { x: pt.x, y: pt.y });
      };
      tl.fromTo(prog, { p: 0.3 }, { p: 0.62, duration: DUR - T_FL, ease: "power1.out", onUpdate: place }, T_FL);
      place();
      tl.fromTo("#s13-me", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, T_BOOM + 2 * F);
      tl.fromTo("#s13-pin", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "bounce.out" }, T_BOOM);

      // Les tuiles du suivi en direct claquent.
      tl.fromTo("#s13-sheet", { y: 520, opacity: 0, rotation: 4, filter: "blur(10px)" }, { y: 0, opacity: 1, rotation: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, T_SHEET);
      tl.fromTo("#s13-chrono", { scale: 1.45, opacity: 0 }, { scale: 0.93, opacity: 1, duration: 3 * F, ease: "power2.out" }, T_CHR);
      tl.to("#s13-chrono", { scale: 1, duration: 4 * F, ease: "sine.inOut" }, T_CHR + 3 * F);
      gsap.utils.toArray(".s13-met").forEach((m, i) => {
        const t = T_MET + i * 0.081;
        tl.fromTo(m, { scale: 1.3, opacity: 0, y: -30 }, { scale: 1, opacity: 1, y: 0, duration: 5 * F, ease: "back.out(2)" }, t);
      });
      tl.fromTo("#s13-live", { opacity: 1 }, { opacity: 0.25, duration: 0.25, ease: "sine.inOut", repeat: 3, yoyo: true }, T_SHEET + 0.1);
      // SOS : coup de poing (chute +140 px, rotation −6° → 0).
      tl.fromTo("#s13-sos", { y: -140, rotation: -6, scale: 1.4, opacity: 0 }, { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 6 * F, ease: "back.out(2.4)" }, T_SOS);

      // Chrono qui défile (× 15), distance, D+.
      const chr = document.getElementById("s13-chrono");
      const dist = document.getElementById("s13-dist");
      const dp = document.getElementById("s13-dplus");
      const clock = { t: 0 };
      const pad = (n) => (n < 10 ? "0" : "") + n;
      const show = () => {
        const u = Math.max(0, clock.t - T_FL);
        const s = 4 * 3600 + 12 * 60 + 16 + Math.floor(u * 15);
        chr.textContent = Math.floor(s / 3600) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
        dist.textContent = (14.9 + Math.min(0.2, Math.floor(u * 0.17 * 10) / 10)).toFixed(1).replace(".", ",") + " km";
        dp.textContent = 312 + Math.min(6, Math.floor(u * 5)) + " m";
      };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: show }, 0);
      show();

      // Secousses : déflagration (maximale), 16,164, SOS.
      function shake(t, a) {
        [[a, -0.5 * a], [-0.6 * a, 0.45 * a], [0.43 * a, -0.3 * a], [-0.15 * a, 0.1 * a], [0, 0]].forEach(([x, y], i) =>
          tl.to("#s13-shake", { x, y, duration: F, ease: "none" }, t + i * F),
        );
      }
      shake(T_BOOM, 24);
      shake(T_ROT, 12);
      shake(T_SOS, 8);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
