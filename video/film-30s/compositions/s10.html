  <script>
    (function () {
      const ID = "s10";
      const DUR = 0.846;
      const F = 1 / 30;
      const O = 12.731;
      const L = (T) => +(T - O).toFixed(4);
      const T_IN = L(12.931);   // « PRÊT. » + secousse
      const T_TILE = L(13.086); // la tuile nette « Prêt à partir · J-6 » passe dessous

      tl.fromTo("#s10-drift", { scale: 1 }, { scale: 1.06, duration: DUR - T_IN, ease: "none" }, T_IN);
      tl.fromTo("#s10-behind", { x: 30, y: 0 }, { x: -30, y: -12, duration: DUR - T_IN, ease: "none" }, T_IN);

      // PRÊT. claque (1,45 → 0,93 → 1), fantôme Stone 2 images.
