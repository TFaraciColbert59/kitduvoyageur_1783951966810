                <div id="s15-btnp"><div id="s15-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>Publier</div><div style="position:absolute; left:50%; top:50%"><div id="s15-iris" data-layout-ignore></div></div></div>

  <script>
    (function () {
      const ID = "s15";
      const DUR = 1.493;
      const F = 1 / 30;
      const O = 17.903;
      const L = (T) => +(T - O).toFixed(4);
      const T_LAND = L(18.103);  // le whip se pose, J3 tombe sur le carnet
      const T_PUSH = L(18.205);  // la caméra pique sur « Publier »
      const T_TAP = L(18.745);   // appui « Publier »
      const T_FLY = L(18.79);    // le carnet vole dans le fil
      const T_WORD = L(18.988);  // « PUBLIÉ. »
      const T_BOOM = L(19.278);  // explosion de 16 avatars
      const T_FULL = L(19.3667); // l'avatar de Tom remplit le cadre (dernière image de s15)

      const tl = gsap.timeline({ paused: true });

      // Entrée : whip pan vers le haut — le plan arrive par le haut, flou 40 px, se fixe en 2 images.
      tl.fromTo("#s15-whip", { y: -1920, filter: "blur(40px)" }, { y: 0, filter: "blur(40px)", duration: T_LAND - 2 * F, ease: "power3.out" }, 0);
      tl.to("#s15-whip", { filter: "blur(0px)", duration: 2 * F, ease: "power2.out" }, T_LAND - 2 * F);
      // J3 tombe sur le carnet à 18,103 (troisième coup).
      tl.fromTo("#s15-j3", { y: -520, scale: 1.9, rotation: 22, filter: "blur(8px)" }, { y: 0, scale: 0.72, rotation: 9, filter: "blur(0px)", duration: T_LAND, ease: "power2.in" }, 0);

      // Caméra : poussée vers le bouton « Publier », puis dézoom brusque quand le carnet part dans le fil.
      tl.fromTo("#s15-cam", { scale: 1, rotation: 0 }, { scale: 1.32, rotation: 2, duration: T_TAP - T_PUSH, ease: "power2.inOut" }, T_PUSH);
      tl.to("#s15-cam", { scale: 0.96, rotation: 0, duration: 5 * F, ease: "expo.out" }, T_FLY);
      tl.to("#s15-cam", { scale: 1.0, duration: DUR - T_FLY - 5 * F, ease: "none" }, T_FLY + 5 * F);

      // Appui : écrasement 0,9, iris laiton.
      tl.fromTo("#s15-btn", { scale: 1 }, { scale: 0.9, duration: 2 * F, ease: "power2.out" }, T_TAP);
      tl.to("#s15-btn", { scale: 0, opacity: 0, duration: 4 * F, ease: "power3.in" }, T_TAP + 2 * F);
      tl.fromTo("#s15-iris", { scale: 0.3, opacity: 1 }, { scale: 3.4, opacity: 0, duration: 7 * F, ease: "expo.out" }, T_TAP);

      // Le carnet vole dans le fil : bord laiton, rotation −4°, posts voisins qui glissent en parallaxe.
      tl.fromTo("#s15-card", { y: 0, rotation: 0, boxShadow: "0 0 0 0px #D0A070, 0 40px 90px rgba(11,31,23,0.35)" }, { y: -40, rotation: -4, boxShadow: "0 0 0 8px #D0A070, 0 40px 90px rgba(11,31,23,0.35)", duration: 0.3, ease: "expo.out" }, T_FLY);
      tl.fromTo("#s15-f1", { y: -420 }, { y: 0, duration: 0.35, ease: "expo.out" }, T_FLY);
      tl.fromTo("#s15-f2", { y: 520 }, { y: 0, duration: 0.35, ease: "expo.out" }, T_FLY);
      tl.to("#s15-f1", { y: 30, duration: DUR - T_FLY - 0.35, ease: "none" }, T_FLY + 0.35);
      tl.to("#s15-f2", { y: -30, duration: DUR - T_FLY - 0.35, ease: "none" }, T_FLY + 0.35);
      tl.to("#s15-j3", { y: -30, x: 20, duration: 0.3, ease: "expo.out" }, T_FLY);

      // Compteurs ♥ et partages qui défilent.
      const likes = document.getElementById("s15-likes");
      const shares = document.getElementById("s15-shares");
      const c = { v: 0 };
      tl.fromTo(c, { v: 0 }, { v: 1, duration: T_BOOM - T_FLY, ease: "power2.out", onUpdate: () => {
        likes.textContent = String(Math.round(312 * c.v));
        shares.textContent = String(Math.round(48 * c.v));
      } }, T_FLY);
      tl.fromTo("#s15-cnt", { opacity: 0.35 }, { opacity: 1, duration: 3 * F, ease: "none" }, T_FLY);

      // « PUBLIÉ. » claque sur la caisse claire 18,988.
      tl.fromTo("#s15-word", { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, T_WORD);
      tl.fromTo("#s15-word", { scale: 1.45 }, { scale: 0.93, duration: 3 * F, ease: "power2.out" }, T_WORD);
      tl.to("#s15-word", { scale: 1, duration: 4 * F, ease: "sine.inOut" }, T_WORD + 3 * F);
      tl.fromTo("#s15-wordg", { opacity: 0, x: 24, y: -14, scale: 1.08 }, { opacity: 0.35, duration: 0.001, ease: "none" }, T_WORD);
      tl.to("#s15-wordg", { opacity: 0, x: 30, y: -20, scale: 1.12, duration: 2 * F - 0.001, ease: "none" }, T_WORD + 0.001);

      // 19,278 : 16 avatars réels (comptes de démo) explosent du carnet vers la caméra (graine fixe).
      const files = ["a01", "a02", "a03", "a04", "a05", "a06", "a07", "a08", "a09", "a10", "a11", "a12", "a15", "a16", "a17", "a18"];
      let seed = 1278;
      const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const avs = document.getElementById("s15-avs");
      files.forEach((f, i) => {
        const a = (i / 16) * Math.PI * 2 - Math.PI / 2 + 0.15 + (r() - 0.5) * 0.25;
        const near = i % 3 === 0;
        const s = near ? 190 : i % 3 === 1 ? 130 : 96;
        const rad = (near ? 520 : 440) + r() * 120;
        const p = document.createElement("div");
        p.className = "s15-avp";
        const im = document.createElement("img");
        im.className = "s15-av";
        im.src = "assets/avatars/" + f + ".jpg";
        im.alt = "";
        im.style.width = im.style.height = s + "px";
        im.style.left = im.style.top = -s / 2 + "px";
        p.appendChild(im);
        avs.appendChild(p);
        const dx = Math.cos(a) * rad, dy = Math.sin(a) * rad * 1.1;
        const t0 = T_BOOM + r() * F * 0.8;
        tl.fromTo(im, { x: 0, y: 0, scale: 0.15, opacity: 0, filter: "blur(0px)" }, { x: dx, y: dy, scale: near ? 1.5 : 1.15, opacity: 1, filter: near ? "blur(3px)" : "blur(0px)", duration: 3 * F, ease: "expo.out" }, t0);
      });
      function shake(t, a) {
        [[a, -0.5 * a], [-0.6 * a, 0.45 * a], [0.43 * a, -0.3 * a], [-0.15 * a, 0.1 * a], [0, 0]].forEach(([x, y], i) =>
          tl.to("#s15-shake", { x, y, duration: F, ease: "none" }, t + i * F),
        );
      }
      shake(T_LAND, 10);
      shake(T_WORD, 8);
      shake(T_BOOM, 22);

      // Zoom-through : l'avatar de Tom (a13) jaillit du carnet et remplit le cadre à la dernière image (s16 commence dedans).
      tl.fromTo("#s15-tomp", { x: 0, y: 0 }, { x: 0, y: 225, duration: T_FULL - T_BOOM, ease: "power2.in" }, T_BOOM);
      tl.fromTo("#s15-tom", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, T_BOOM);
      tl.fromTo("#s15-tom", { scale: 0.4 }, { scale: 13.5, duration: T_FULL - T_BOOM, ease: "power2.in" }, T_BOOM);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
