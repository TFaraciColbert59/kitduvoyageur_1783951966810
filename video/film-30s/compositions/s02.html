        tl.fromTo("#s02-l" + i, { x: Math.cos(s.a) * 150, y: Math.sin(s.a) * 150 - 5, rotation: deg, scaleX: 0 }, { scaleX: 1, duration: 4 * F, ease: "expo.out", immediateRender: false }, TAP + 1 * F);
        tl.to("#s02-l" + i, { opacity: 0, x: Math.cos(s.a) * 260, y: Math.sin(s.a) * 260 - 5, duration: 0.18, ease: "power2.in" }, TAP + 5 * F);
      });
      // Secousse 4 images (14 → 6 px).
      tl.fromTo("#s02-shake", { x: 0, y: 0 }, { keyframes: [{ x: 14, y: -9 }, { x: -10, y: 7 }, { x: 6, y: -4 }, { x: 0, y: 0 }], duration: 4 * F, ease: "none", immediateRender: false }, TAP);
