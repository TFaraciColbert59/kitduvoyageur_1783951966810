  <script>
    (function () {
      // Plan 16 · bible 19,396 → 20,690 ; hôte à 19,196 : local = film − 19,196.
      const F = 1 / 30;
      const L = (T) => +(T - 19.196).toFixed(4);
      const tl = gsap.timeline({ paused: true });

      function slam(el, ghost, t) {
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { scale: 1.45 }, { scale: 0.93, duration: 3 * F, ease: "power2.out", immediateRender: false }, t);

        if (ghost) {
          tl.set(ghost, { opacity: 0.35 }, t);
          tl.fromTo(ghost, { scale: 1.75 }, { scale: 1.2, duration: 2 * F, ease: "none", immediateRender: false }, t);
          tl.set(ghost, { opacity: 0 }, t + 2 * F);
        }
      }
      function shake(el, t, a) {
        const k = [1, -0.7, 0.43, -0.2, 0];
        k.forEach((m, i) => tl.to(el, { x: a * m, y: -a * m * 0.6, duration: F, ease: "none" }, t + i * F));
      }

      // Entrée (0 → 0,2) : on finit de plonger dans l'avatar de Tom, plein cadre à 19,396.
      // Le plan 15 plonge lui-même dans l'avatar de Tom : on prend le relais en coupe franche, plein cadre, à 19,396
      // (pas de fondu : il ferait une double exposition des deux avatars).
      // a13 en « cover » 1080 × 1920 (carré de 1 920 px centré), identique à la dernière image du plan 15.

      // 19,396 : le fond Sage existe derrière ; l'avatar recule (5 images, expo.out, dépassement 0,97).
      tl.set(["#s16-bg"], { opacity: 1 }, 0.2);
      // 19,396 : image pleine (coins couverts) ; le recul commence à l'image suivante (19,430).
      const AV = 150 / 1920, tR = 0.2 + F;
      tl.to("#s16-facew", { scale: AV * 0.97, x: 100, y: -740, duration: 5 * F, ease: "expo.out" }, tR);
      tl.to("#s16-facew", { scale: AV, duration: 3 * F, ease: "sine.out" }, tR + 5 * F);
      tl.fromTo("#s16-face", { borderRadius: "0px" }, { borderRadius: "960px", duration: 3 * F, ease: "power2.out", immediateRender: false }, tR);
      tl.fromTo("#s16-ring", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power1.in", immediateRender: false }, tR);
      // La tuile Compas · Nous arrive un peu grande et se pose.
      tl.fromTo("#s16-nous", { opacity: 0, scale: 1.14, rotation: 2 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.3, ease: "expo.out" }, 0.21);
      // Caméra : dérive continue + parallaxe du fond.
      tl.fromTo("#s16-cam", { scale: 1, rotation: 0, transformOrigin: "50% 40%" }, { scale: 1.055, rotation: 1.6, duration: 1.294, ease: "power1.inOut" }, 0.2);
      tl.fromTo("#s16-bg", { y: 0, scale: 1 }, { y: -36, scale: 1.03, duration: 1.294, ease: "none" }, 0.2);

      // Garamond « une bouteille à la » (19,558) : flou → net, sans translation.

      // Appui « Lancer une bouteille » (19,886) : écrasement + halo laiton.
      const tp = L(19.886);
      tl.to("#s16-btn", { scale: 0.9, duration: 2 * F, ease: "power2.out" }, tp);
      tl.to("#s16-btn", { scale: 1, duration: 4 * F, ease: "back.out(3)" }, tp + 2 * F);
      tl.fromTo("#s16-halo", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.25, duration: 0.25, ease: "power2.out", immediateRender: false }, tp);

      // La carte-bouteille naît du bouton puis part en arc à 20,047 (9 images, 360°).
      // Centre final de la carte (sans rotation) : (700, 672) ; départ : le bouton (300, 514).
      const C1 = { x: 700, y: 640 }, C0 = { x: 296, y: 514 };
      const dx0 = C0.x - C1.x, dy0 = C0.y - C1.y;
      tl.set("#s16-bottle", { opacity: 1, x: dx0, y: dy0, scale: 0.28, rotation: -367, transformOrigin: "50% 50%" }, L(19.96));
      tl.fromTo("#s16-bottle", { scale: 0.28 }, { scale: 0.36, duration: 0.08, ease: "power2.out", immediateRender: false }, L(19.96));
      const tL = L(20.047), dur = 9 * F;
      tl.to("#s16-bottle", { x: 0, duration: dur, ease: "sine.inOut" }, tL);
      tl.to("#s16-bottle", { y: -330, duration: dur * 0.5, ease: "power2.out" }, tL);
      tl.to("#s16-bottle", { y: 0, duration: dur * 0.5, ease: "power2.in" }, tL + dur * 0.5);
      tl.to("#s16-bottle", { rotation: -7, duration: dur, ease: "power1.inOut" }, tL);
      tl.to("#s16-bottle", { scale: 1.08, duration: dur, ease: "power2.in" }, tL);
      tl.to("#s16-bottle", { scale: 1, duration: 4 * F, ease: "back.out(2.2)" }, tL + dur);
      // Traînée : un point laiton par image de vol, à la position du centre de la carte.
      const trail = document.getElementById("s16-trail");
      const sine = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
      for (let i = 1; i <= 8; i++) {
        const p = i / 9;
        const x = C1.x + dx0 * (1 - sine(p));
        const yy = p < 0.5 ? dy0 + (-330 - dy0) * (1 - Math.pow(1 - p * 2, 2)) : -330 + 330 * Math.pow((p - 0.5) * 2, 2);
        const d = document.createElement("div");
        d.className = "s16-dot s16-abs";
        d.id = "s16-dot" + i;
        d.style.left = (x - 11) + "px";
        d.style.top = (C1.y + yy - 11) + "px";

        tl.to(d, { opacity: 0, scale: 0.4, duration: 6 * F, ease: "power1.in" }, tL + (i + 1) * F);
