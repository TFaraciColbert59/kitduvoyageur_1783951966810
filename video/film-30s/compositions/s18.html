  <script>
    (function () {
      // Plan 18 · bible 22,629 → 24,565 ; hôte à 22,429 : local = film − 22,429.
      const F = 1 / 30;
      const L = (T) => +(T - 22.429).toFixed(4);
      const tl = gsap.timeline({ paused: true });
      function slam(el, ghost, t) {
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { scale: 1.45 }, { scale: 0.93, duration: 3 * F, ease: "power2.out", immediateRender: false }, t);
        tl.to(el, { scale: 1, duration: 4 * F, ease: "sine.inOut" }, t + 3 * F);
        if (ghost) {
          tl.set(ghost, { opacity: 0.35 }, t);
          tl.fromTo(ghost, { scale: 1.75 }, { scale: 1.2, duration: 2 * F, ease: "none", immediateRender: false }, t);
          tl.set(ghost, { opacity: 0 }, t + 2 * F);
        }
      }

      // ---- Carte partagée avec le plan 19 : satellite ×1,8, Refugio Chileno au point C (540, 860).
      const K = 1.8, OX = -1401.84, OY = -402.16, C = [540, 860], A0 = [940, 300];
      const T0 = 24.13, TC = 24.565;
      const W = [[1078.9,701.2],[1082.4,716.8],[1093.3,727.5],[1105.8,734.1],[1114.1,744.7],[1120.0,779.9],[1113.2,809.0],[1105.8,824.7],[1104.3,869.6],[1095.0,882.2],[1089.3,883.3],[1085.7,888.0],[1084.4,897.3],[1073.4,903.9],[1066.9,917.7],[1033.1,934.8],[1006.2,963.2],[1004.7,969.7],[1001.0,970.8],[997.9,978.0],[986.4,985.6],[979.4,997.4],[965.7,1005.0],[957.0,1013.8],[950.2,1016.3],[921.8,1040.9],[913.9,1045.7],[906.2,1045.2],[901.3,1051.0],[869.4,1055.6],[864.2,1059.1],[855.8,1056.0],[840.0,1057.0]];
      // trajet du groupe de Tom : de l'index 32 vers le refuge (index 0), en coordonnées écran
      const P = W.slice().reverse().map(([x, y]) => [x * K + OX, y * K + OY]);
      const cum = [0];
      for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const LEN = cum[cum.length - 1];
      const F25 = cum[7] / LEN; // index 25 de la route = 7e point du trajet inversé
      function at(f) {
        const d = f * LEN; let i = 1;
        while (i < cum.length - 1 && cum[i] < d) i++;
        const u = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * u, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * u];
      }
      document.getElementById("s18-tf").setAttribute("points", P.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "));
      const st = { a: 0, T: T0 };
      const df = document.getElementById("s18-df"), db = document.getElementById("s18-db");
      const tf = document.getElementById("s18-tf"), tb = document.getElementById("s18-tb");
      function draw() {
        const q = Math.min(1, Math.max(0, (st.T - T0) / (TC - T0)));
        const p = q * q * q; // les deux points accélèrent
        const f = F25 * st.a + (1 - F25) * p;
        const pf = at(f);
        gsap.set(df, { x: pf[0], y: pf[1] });
        tf.setAttribute("stroke-dashoffset", (1 - Math.max(f, 0.001)).toFixed(4));
        const bx = A0[0] + (C[0] - A0[0]) * p, by = A0[1] + (C[1] - A0[1]) * p;
        gsap.set(db, { x: bx, y: by });
        tb.setAttribute("x2", bx.toFixed(1)); tb.setAttribute("y2", by.toFixed(1));
      }
      draw();

      // Entrée : whip pan depuis la gauche (5 images, flou directionnel), le plan se fixe en 2 images.
      tl.fromTo("#s18-whip", { x: -1080 }, { x: 0, duration: 5 * F, ease: "expo.out" }, 0);
      tl.fromTo("#s18-whip", { filter: "blur(40px)" }, { filter: "blur(0px)", duration: 7 * F, ease: "power2.out" }, 0);
      // En route : la caméra recule doucement vers le cadrage de la rencontre ; le groupe de Tom avance.
      tl.fromTo("#s18-cam", { scale: 1.14, rotation: -2, transformOrigin: "30% 70%" }, { scale: 1, rotation: 0, duration: 1.42, ease: "power2.inOut" }, 0.2);
      tl.to(st, { a: 1, duration: 0.65, ease: "sine.inOut", onUpdate: draw }, 0.2);
      tl.fromTo("#s18-dim", { opacity: 0.25 }, { opacity: 0.55, duration: 1.4, ease: "none" }, 0.3);

      // L'anneau de la story d'Anna apparaît (23,113), puis la story surgit plein écran à 23,276.
      tl.fromTo("#s18-ring", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.6)" }, L(23.113));
      const tS = L(23.276);
      tl.to("#s18-ring", { scale: 2.4, opacity: 0, duration: 4 * F, ease: "power2.in" }, tS);
      tl.to("#s18-story", { clipPath: "circle(2300px at 900px 300px)", duration: 5 * F, ease: "expo.in" }, tS - 2 * F);
      tl.fromTo("#s18-ph", { scale: 1.2 }, { scale: 1.06, duration: 0.8, ease: "expo.out" }, tS - 2 * F);
      tl.fromTo("#s18-prog", { scaleX: 0 }, { scaleX: 0.62, duration: 0.8, ease: "none" }, tS);
      tl.fromTo("#s18-tk", { opacity: 0, y: 260, rotation: -9, scale: 1.08 }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.3, ease: "expo.out" }, L(23.38));
      tl.set("#s18-db", { opacity: 1 }, tS);

      // « S'INSCRIRE » claque (23,659), appui sur le bouton (23,917).
      slam("#s18-word", "#s18-wordg", L(23.659));
      const tP = L(23.917);
      tl.to("#s18-btn", { scale: 0.94, duration: 2 * F, ease: "power2.out" }, tP);
      tl.to("#s18-btn", { scale: 1, duration: 4 * F, ease: "back.out(3)" }, tP + 2 * F);
      tl.fromTo("#s18-halo", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.14, duration: 0.3, ease: "power2.out" }, tP);

      // La story se referme dans le point laiton (groupe d'Anna) ; le mot sort (3 images).
      const tC = L(24.043);
      tl.to("#s18-word", { scale: 0.82, opacity: 0, filter: "blur(10px)", duration: 3 * F, ease: "power3.in" }, tC - 3 * F);
      tl.to("#s18-story", { clipPath: "circle(0px at 940px 300px)", duration: 5 * F, ease: "power3.in" }, tC);
      // Les deux points accélèrent l'un vers l'autre (rencontre à 24,565, plan 19).
      tl.to(st, { T: TC, duration: TC - T0, ease: "none", onUpdate: draw }, L(T0));

      tl.set({}, {}, 2.136);
      window.__timelines["s18"] = tl;
    })();
  </script>
