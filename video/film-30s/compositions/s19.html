      }

      // ---- Même carte et même mouvement des deux points que le plan 18 (fonction du temps du film).
      const K = 1.8, OX = -1401.84, OY = -402.16, C = [540, 860], A0 = [940, 300];
      const T0 = 24.13, TC = 24.565;
      const W = [[1078.9,701.2],[1082.4,716.8],[1093.3,727.5],[1105.8,734.1],[1114.1,744.7],[1120.0,779.9],[1113.2,809.0],[1105.8,824.7],[1104.3,869.6],[1095.0,882.2],[1089.3,883.3],[1085.7,888.0],[1084.4,897.3],[1073.4,903.9],[1066.9,917.7],[1033.1,934.8],[1006.2,963.2],[1004.7,969.7],[1001.0,970.8],[997.9,978.0],[986.4,985.6],[979.4,997.4],[965.7,1005.0],[957.0,1013.8],[950.2,1016.3],[921.8,1040.9],[913.9,1045.7],[906.2,1045.2],[901.3,1051.0],[869.4,1055.6],[864.2,1059.1],[855.8,1056.0],[840.0,1057.0]];
      const P = W.slice().reverse().map(([x, y]) => [x * K + OX, y * K + OY]);
      const cum = [0];
      for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
      const LEN = cum[cum.length - 1];
      const F25 = cum[7] / LEN;
      function at(f) {
        const d = f * LEN; let i = 1;
        while (i < cum.length - 1 && cum[i] < d) i++;
        const u = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * u, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * u];
      }
      document.getElementById("s19-tf").setAttribute("points", P.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "));
      const st = { T: 24.365 };
      const df = document.getElementById("s19-df"), db = document.getElementById("s19-db");
      const tf = document.getElementById("s19-tf"), tb = document.getElementById("s19-tb");
      function draw() {
        const q = Math.min(1, Math.max(0, (st.T - T0) / (TC - T0)));
        const p = q * q * q;
        const f = F25 + (1 - F25) * p;
        const pf = at(f);
        gsap.set(df, { x: pf[0], y: pf[1] });
        tf.setAttribute("stroke-dashoffset", (1 - f).toFixed(4));
        const bx = A0[0] + (C[0] - A0[0]) * p, by = A0[1] + (C[1] - A0[1]) * p;
        gsap.set(db, { x: bx, y: by });
        tb.setAttribute("x2", bx.toFixed(1)); tb.setAttribute("y2", by.toFixed(1));
      }
      draw();
      tl.to(st, { T: TC, duration: 0.2, ease: "none", onUpdate: draw }, 0);

      // ---- 24,565 : collision. Flash blanc 2 images, onde de choc, éclats de photos, secousse maximale.

      tl.fromTo("#s19-ring2", { opacity: 0.95, scale: 0.2 }, { opacity: 0, scale: 1.25, duration: 0.65, ease: "expo.out", immediateRender: false }, tH + F);
      tl.fromTo("#s19-glow", { opacity: 1, scale: 0.4 }, { opacity: 0.55, scale: 1.5, duration: 0.3, ease: "expo.out", immediateRender: false }, tH);
      tl.to("#s19-glow", { opacity: 0.35, scale: 0.8, duration: 0.6, ease: "power2.inOut" }, tH + 0.3);
      tl.set("#s19-core", { opacity: 1 }, tH);
      tl.fromTo("#s19-core", { scale: 1.8 }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, tH);
      shake("#s19-shake", tH, 26);
      // caméra : poussée sur l'impact, puis recul (le dézoom brutal du plan 20 le prolonge)

      tl.to("#s19-cam", { scale: 1, duration: 0.4, ease: "power2.in" }, 0.85);
      tl.to("#s19-svg", { opacity: 0, duration: 0.35, ease: "power1.in" }, 0.6);

      // éclats : 14 photos, trajectoires fixées par une graine (vers la caméra puis hors cadre)
      let seed = 19;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + (rnd() - 0.5) * 0.5;
        const r1 = 300 + rnd() * 170, w = 120 + rnd() * 70, h = w * 0.8, rot = (rnd() - 0.5) * 50;
        const s1 = 1 + rnd() * 0.9;
        const el = document.getElementById("s19-sh" + i);
        el.style.left = (C[0] - w / 2) + "px"; el.style.top = (C[1] - h / 2) + "px";
        el.style.width = w + "px"; el.style.height = h + "px";
        el.style.clipPath = i % 2 ? "polygon(0 10%, 100% 0, 85% 100%, 10% 85%)" : "polygon(15% 0, 100% 20%, 90% 90%, 0 100%)";
        const x1 = Math.cos(a) * r1, y1 = Math.sin(a) * r1 * 1.05;
        tl.set(el, { opacity: 1 }, tH);
        tl.fromTo(el, { x: 0, y: 0, scale: 0.2, rotation: 0 }, { x: x1, y: y1, scale: s1, rotation: rot, duration: 7 * F, ease: "expo.out", immediateRender: false }, tH);

      tl.set({}, {}, 1.497);
