  </style>
  <div id="root" data-composition-id="vkit3d" data-width="1080" data-height="1920">
    <canvas id="k-canvas" width="1080" height="1920"></canvas>
    <div id="k-kicker">Kit Studio</div>
    <div id="k-title"><span class="w">Ton</span> <span class="w">sac,</span><br /><span class="w"><em>pièce</em></span> <span class="w">par</span> <span class="w">pièce</span></div>
    <div class="k-pill" id="k-pill"><span class="k-ring"></span>10,3 kg · LKDV ONE 45 L</div>
    <div id="k-order">Commander · 5 pièces · 471 €</div>
    <div id="k-panel">
      <div class="k-sw" id="k-sws">
        <div class="k-swatch" id="k-sw-foret"><span class="k-chip" style="background:#2d482a"></span>Forêt</div>
        <div class="k-swatch" id="k-sw-sauge"><span class="k-chip" style="background:#789972"></span>Sauge</div>
        <div class="k-swatch" id="k-sw-pierre"><span class="k-chip" style="background:#b5aba0"></span>Pierre</div>
        <div class="k-sel" id="k-sel"></div>
      </div>
      <div class="k-card"><div class="k-check" id="k-c04">✓</div><b>Poche multifonction</b><span class="k-state"><span id="k-s04a">M04</span><span id="k-s04b" class="k-on">Monté</span></span></div>
      <div class="k-card"><div class="k-check" id="k-c13">✓</div><b>Porte-piolets</b><span class="k-state"><span id="k-s13a">M13</span><span id="k-s13b" class="k-on">Monté</span></span></div>
    </div>
  <script>
    (function () {
      const DUR = 7.5;
      const root = document.querySelector('[data-composition-id="vkit3d"]');
      const canvas = root.querySelector("#k-canvas");
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};

      // Coloris réels du Kit Studio (domain/catalog.ts, COLORWAYS[*].body)
      const CW = { foret: 0x2d482a, sauge: 0x789972, pierre: 0xb5aba0 };

      const ready = (async () => {
        const base = new URL("assets/", document.baseURI).href;
        const THREE = await import(base + "lib/three-bundle.js");
        const { GLTFLoader, RoomEnvironment, MeshoptDecoder } = THREE;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1080, 1920, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environmentIntensity = 0.55;

        const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
        key.position.set(-1.6, 2.4, 2.2);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xdfe9ff, 1.6);
        rim.position.set(1.8, 1.4, -2.0);
        scene.add(rim);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.5));

        const camera = new THREE.PerspectiveCamera(26, 1080 / 1920, 0.05, 20);
        camera.position.set(0, 0.6, 7.2);
        // Le sac occupe le tiers gauche du cadre : on décale la fenêtre de vue, pas l'objet.
        camera.setViewOffset(1080, 1920, -60, 135, 1080, 1920);
        camera.lookAt(0, 0.34, 0);

        const loader = new GLTFLoader();
        await MeshoptDecoder.ready;
        loader.setMeshoptDecoder(MeshoptDecoder);
        const load = (u) => new Promise((res, rej) => loader.load(base + u, res, undefined, rej));
        const texLoader = new THREE.TextureLoader();
        const zones = await new Promise((res, rej) => texLoader.load(base + "3d/lkdv-one-45.zones.webp", res, undefined, rej));
        zones.flipY = false;
        zones.colorSpace = THREE.NoColorSpace;

        const [bagG, m04G, m13G] = await Promise.all([load("3d/lkdv-one-45.glb"), load("3d/lkdv-m04.glb"), load("3d/lkdv-m13.glb")]);

        // Teinte du Kit Studio (scene/bag/atlas.ts) : la couleur du coloris multiplie la luminance de
        // l'albédo sur les zones textiles (canal R de la carte de zones).
        const tint = { color: { value: new THREE.Color(CW.foret) } };
        bagG.scene.traverse((n) => {
          if (!n.isMesh) return;
          n.castShadow = false;
          const m = n.material;
          if (!m || !m.map || n.name === "LKDV_LOGO" || n.name === "LKDV_ECUSSON_SUPPORT" || m.name === "LKDV_MARQUAGE_PIERRE" || m.name === "LKDV_Ecusson_Tisse") return;
          m.customProgramCacheKey = () => "lkdv-trailer-tint";
          m.onBeforeCompile = (sh) => {
            sh.uniforms.zonesMap = { value: zones };
            sh.uniforms.tintColor = tint.color;
            sh.fragmentShader = sh.fragmentShader
              .replace("#include <uv_pars_fragment>", "#include <uv_pars_fragment>\nuniform sampler2D zonesMap;\nuniform vec3 tintColor;")
              .replace(
                "#include <map_fragment>",
                "#include <map_fragment>\n#ifdef USE_MAP\n{ float z = texture2D(zonesMap, vMapUv).r; float lum = dot(diffuseColor.rgb, vec3(0.2126,0.7152,0.0722)); diffuseColor.rgb = mix(diffuseColor.rgb, tintColor * lum * 2.2, z); }\n#endif",
              );
          };
          m.needsUpdate = true;
        });

        const rig = new THREE.Group();
        scene.add(rig);
        const bag = bagG.scene;
        rig.add(bag);

        // Modules posés sur les flancs, dos (platine) contre le sac.
        const m04 = m04G.scene;
        m04.rotation.y = Math.PI / 2;
        rig.add(m04);
        const m13 = m13G.scene;
        m13.rotation.y = -Math.PI / 2;
        rig.add(m13);
        const M04_REST = new THREE.Vector3(0.235, 0.13, 0.02);
        const M13_REST = new THREE.Vector3(-0.235, 0.12, -0.02);

        // Ombre de contact : un disque à dégradé radial, calculé une fois.
        const sc = document.createElement("canvas");
        sc.width = sc.height = 256;
        const g = sc.getContext("2d");
        const grd = g.createRadialGradient(128, 128, 8, 128, 128, 128);
        grd.addColorStop(0, "rgba(11,31,23,0.55)");
        grd.addColorStop(0.55, "rgba(11,31,23,0.18)");
        grd.addColorStop(1, "rgba(11,31,23,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, 256, 256);
        const shadowTex = new THREE.CanvasTexture(sc);
        const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.62), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = 0.001;
        scene.add(shadow);

        const ease = {
          expoOut: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
          inOut: (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
          backOut: (x) => {
            const c1 = 1.2, c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
          },
        };
        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const seg = (t, a, d) => clamp01((t - a) / d);
        const cA = new THREE.Color(), cB = new THREE.Color();

        // Moments (secondes locales) calés sur les mesures du film : 26,70 = 0.
        const T_SAUGE = 1.88, T_PIERRE = 3.75, T_M04 = 4.4, T_M13 = 5.4;

        function colorAt(t) {
          if (t < T_SAUGE) return cA.setHex(CW.foret);
          if (t < T_PIERRE) {
            const k = ease.inOut(seg(t, T_SAUGE, 0.5));
            return cA.setHex(CW.foret).lerp(cB.setHex(CW.sauge), k);
          }
          const k = ease.inOut(seg(t, T_PIERRE, 0.5));
          return cA.setHex(CW.sauge).lerp(cB.setHex(CW.pierre), k);
        }

        function render(t) {
          const drop = ease.expoOut(seg(t, 0, 1.0));
          rig.position.y = (1 - drop) * 0.22;
          rig.rotation.y = -0.85 + t * 0.3;
          const s = 0.9 + 0.1 * drop;
          rig.scale.setScalar(s);
          shadow.material.opacity = drop;
          shadow.scale.setScalar(1.25 - 0.25 * drop);
          tint.color.value.copy(colorAt(t));

          const a = ease.backOut(seg(t, T_M04, 0.7));
          m04.visible = t >= T_M04 - 0.01;
          m04.position.set(M04_REST.x + (1 - a) * 0.45, M04_REST.y + (1 - a) * 0.1, M04_REST.z);
          const b = ease.backOut(seg(t, T_M13, 0.7));
          m13.visible = t >= T_M13 - 0.01;
          m13.position.set(M13_REST.x - (1 - b) * 0.45, M13_REST.y + (1 - b) * 0.1, M13_REST.z);

          renderer.render(scene, camera);
        }

        await renderer.compileAsync(scene, camera);
        render(0);
        const px = new Uint8Array(4);
        renderer.getContext().readPixels(0, 0, 1, 1, renderer.getContext().RGBA, renderer.getContext().UNSIGNED_BYTE, px);
        return render;
      })();
      window.__hf.buildReady["vkit3d"] = ready;

      ready.then((render) => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);

        // Entrée : le Kit Studio s'ouvre en cercle depuis le panneau du Compas (onglet Kit).
        tl.fromTo(root, { clipPath: "circle(0px at 540px 1100px)" }, { clipPath: "circle(2300px at 540px 1100px)", duration: 0.5, ease: "power3.out" }, 0);

        // Titre : mot par mot, flou 6 → 0, sans déplacement.
        tl.fromTo("#k-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
        tl.fromTo("#k-title .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07 }, 0.45);

        // Panneau : il entre par la droite et se pose.
        tl.fromTo("#k-panel", { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.5);

        // Sélecteur de coloris : il glisse sous le coloris actif aux mêmes instants que la teinte.
        const sws = ["#k-sw-foret", "#k-sw-sauge", "#k-sw-pierre"].map((s) => root.querySelector(s));
        const box = root.querySelector("#k-sws").getBoundingClientRect();
        const r = sws.map((el) => el.getBoundingClientRect());
        const sel = root.querySelector("#k-sel");
        sel.style.top = "0px";
        sel.style.height = r[0].height + "px";
        sel.style.width = r[0].width + "px";
        sel.style.left = "0px";
        const xs = r.map((q) => q.left - box.left);
        tl.fromTo(sel, { x: xs[0] }, { x: xs[0], duration: 0.01 }, 0);
        tl.to(sel, { x: xs[1], duration: 0.5, ease: "power2.inOut" }, 1.88);
        tl.to(sel, { x: xs[2], duration: 0.5, ease: "power2.inOut" }, 3.75);

        // Modules : la carte se coche quand le module se pose.
        tl.fromTo("#k-c04", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 4.85);
        tl.fromTo("#k-s04a", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 4.8);
        tl.fromTo("#k-s04b", { opacity: 0 }, { opacity: 1, duration: 0.16 }, 4.9);
        tl.fromTo("#k-c13", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 5.85);
        tl.fromTo("#k-s13a", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 5.8);
        tl.fromTo("#k-s13b", { opacity: 0 }, { opacity: 1, duration: 0.16 }, 5.9);
        tl.to("#k-pill", { opacity: 0, filter: "blur(6px)", duration: 0.15 }, 5.95);
        tl.fromTo("#k-pill", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
        tl.fromTo("#k-order", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 6.0);

        window.__timelines["vkit3d"] = tl;
      });
    })();
  </script>
