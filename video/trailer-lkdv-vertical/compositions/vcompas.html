  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="vcompas"]');
      const PHRASE = "5 jours de trek autour de Gavarnie, à 3, en refuge, mi-octobre";
      document.fonts.ready.then(() => {
      const holder = root.querySelector("#c-text");
      // Une lettre = un span, créé une fois ; seule leur opacité est animée.
      for (const ch of PHRASE) {
        const s = document.createElement("span");
        s.className = "c-ch";
        s.textContent = ch;
        holder.appendChild(s);
      }
      // Mesure une fois, avant toute animation : la forme du bouton, en retraits depuis les bords.
      const rb = root.querySelector("#c-btn").getBoundingClientRect();
      const rr = root.getBoundingClientRect();
      const sx = rr.width / 1080 || 1;
      const L = (rb.left - rr.left) / sx, T = (rb.top - rr.top) / sx, W = rb.width / sx, H = rb.height / sx;
      const BTN = `inset(${T}px ${1080 - L - W}px ${1920 - T - H}px ${L}px round 52px)`;
      const CUR = { x: L + W * 0.62, y: T + H * 0.45 };
      const tl = gsap.timeline({ paused: true });

      // Le panneau du Compas arrive de la gauche (balayage), le fond ne bouge pas.
      tl.fromTo("#c-panel", { x: -1100, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, 0);

      // Frappe : 63 caractères entre 0,45 s et 1,85 s.
      tl.fromTo("#c-ph", { opacity: 1 }, { opacity: 0, duration: 0.05 }, 0.34);
      tl.fromTo(".c-ch", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1.1 / PHRASE.length }, 0.35);
      tl.fromTo("#c-btn-on", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 1.5);

      // Le curseur entre par le bas à droite et se pose sur le bouton.
      tl.fromTo("#c-cursor", { x: 900, y: 1900 }, { x: CUR.x, y: CUR.y, duration: 0.5, ease: "power3.out" }, 1.4);
      tl.to("#c-cursor", { scale: 0.85, duration: 0.06, ease: "power2.in" }, 1.96);
      tl.to("#c-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 2.02);
      tl.to("#c-btn", { scale: 0.97, duration: 0.06 }, 1.98);
      tl.to("#c-btn", { scale: 1, duration: 0.1 }, 2.04);
      tl.to("#c-caret", { opacity: 0, duration: 0.05 }, 2.0);

      // Le bouton devient le monde : sa forme verte grandit jusqu'à couvrir l'image.
      tl.fromTo("#c-flood", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.07);
      tl.fromTo("#c-flood", { clipPath: BTN }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.34, ease: "power3.in" }, 2.08);
      tl.to("#c-cursor", { opacity: 0, duration: 0.1 }, 2.1);

      window.__timelines["vcompas"] = tl;
      });
    })();
