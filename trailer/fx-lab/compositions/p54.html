<template>
  <style>
    #root { position: absolute; inset: 0; background: #0B1F17; overflow: hidden; }
    #p54-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <!-- P54 : images 3480 à 3600 du film (120 images à 60 i/s). Séquence finale F = 104 … 223 (lib/fx/finale.js).
       Plaque : assets/footage/img39.png (vraie image de Tony). -->
  <div id="root" data-composition-id="p54" data-start="0" data-duration="2.0" data-width="1920" data-height="1080">
    <canvas id="p54-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script src="lib/fx/img39-lights.js"></script>
  <script src="lib/fx/traces.js"></script>
  <script src="lib/fx/finale.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      /* Plaque de Tony (img39, 1920×1080). Les tracés partent de ses lumières réelles (tools/bake-img39.py). */
      var PLATE = "assets/footage/img39.png";
      var cv = document.getElementById("p54-canvas");
      var finale = null;
      var clock = FX.bindClock("p54", 120, function (t, f) {
        if (finale) finale.render(104 + f);
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["p54-plate"] = new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          finale = FX.Finale.create(cv, img);
          clock.redraw();
          resolve();
        };
        img.onerror = reject;
        img.src = PLATE;
      });
      window.__timelines["p54"] = clock.tl;
    })();
  </script>
</template>
