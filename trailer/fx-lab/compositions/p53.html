<template>
  <style>
    #root { position: absolute; inset: 0; background: #0B1F17; overflow: hidden; }
    #p53-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <!-- P53 : images 3376 à 3480 du film (104 images à 60 i/s). Séquence finale F = 0 … 103 (lib/fx/finale.js).
       Emplacement prévu pour la plaque de Tony : assets/footage/img39.png (variable PLATE ci-dessous). -->
  <div id="root" data-composition-id="p53" data-start="0" data-duration="1.7333333333333334" data-width="1920" data-height="1080">
    <canvas id="p53-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script src="lib/fx/earth-data.js"></script>
  <script src="lib/fx/earth.js"></script>
  <script src="lib/fx/traces.js"></script>
  <script src="lib/fx/finale.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      /* Plaque de Tony : mettre "assets/footage/img39.png" quand elle est livrée. Vide = Terre de nuit en code. */
      var PLATE = "";
      var finale = FX.Finale.create(document.getElementById("p53-canvas"));
      var clock = FX.bindClock("p53", 104, function (t, f) {
        finale.render(0 + f);
      });
      if (PLATE) {
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["p53-plate"] = new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () {
            finale.setPlate(img);
            clock.redraw();
            resolve();
          };
          img.onerror = reject;
          img.src = PLATE;
        });
      }
      window.__timelines["p53"] = clock.tl;
    })();
  </script>
</template>
