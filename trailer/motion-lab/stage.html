<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LKDV motion-lab</title>
<style>
  /* Polices : Inter (dépôt, src/app/fonts), JetBrains Mono (paquet hyperframes du chantier), Georgia (macOS). */
  @font-face { font-family: "Inter"; src: url("/src/app/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400;
    src: url("/trailer/node_modules/hyperframes/dist/skills/hyperframes/assets/frame-presets/code-editorial/fonts/JetBrainsMono-400.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="/trailer/film/lib/fx/core.js"></script>
<script src="/trailer/film/lib/fx/img39-lights.js"></script>
<script src="/trailer/film/lib/fx/traces.js"></script>
<script src="lib/motion.js"></script>
<script src="scenes/scenes.js"></script>
<script src="scenes/stills.js"></script>
<script src="scenes/planche.js"></script>
<script src="scenes/v6.js"></script>
<script>
  (function () {
    var cache = {};
    function load(url) {
      if (cache[url]) return cache[url];
      cache[url] = new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej(new Error("image " + url)); };
        im.src = url;
      });
      return cache[url];
    }
    window.dropCache = function () { cache = {}; };
    window.renderFrame = async function (scene, n, params) {
      await document.fonts.load("600 15px Inter");
      await document.fonts.load("400 30px 'JetBrains Mono'");
      await document.fonts.load("italic 30px Georgia");
      var sc = LKDVM.scenes[scene];
      if (!sc) throw new Error("scène inconnue " + scene);
      var urls = sc.images(n, params || {});
      var ims = {};
      for (var k in urls) ims[k] = await load(urls[k]);
      var cv = document.getElementById("cv");
      var ctx = cv.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.filter = "none";
      if (params && params.transparent) ctx.clearRect(0, 0, 1920, 1080);
      else {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, 1920, 1080);
      }
      sc.draw(ctx, n, ims, params || {});
      return cv.toDataURL("image/png");
    };
  })();
</script>
</body>
</html>
