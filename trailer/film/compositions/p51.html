<!-- P51 (images 3192–3271, 79 images) — landscape-director. img38, gros plan : bus de nuit, Noah tombe sur le carnet de Léa ; écran VERT laissé intact (E13, ui-builder).
     Entrée sur la montée de P50 : le contenu descend encore (cy 640 → 600, outCubic, 12 images), puis poussée lente S 1,16 → 1,24 vers le téléphone (cx 830 → 810).
     Sortie (« la caméra s'arrache ») : arrachement vertical accéléré sur les 18 dernières images (cy −130, inCubic), flou vertical croissant, vers la remontée de P52 ; téléphone (≈ 500–685 × 480–790) entier jusqu'au bout.
     Caméra : window.__lkdvCam.p51(f) → { S, cx, cy, rot }. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p51-frame { position: absolute; inset: 0; overflow: hidden; }
    .p51-shot, .p51-shot-inner { position: absolute; inset: 0; }
    .p51-shot { opacity: 0; }
    .p51-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p51-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p51" data-width="1920" data-height="1080" data-duration="1.3166666666666667">
    <div id="p51-frame" class="p51-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p51-shot-1" class="p51-shot" data-src="img38" data-seq="0" data-seq-count="1">
        <div id="p51-shot-1-inner" class="p51-shot-inner">
          <img id="p51-shot-1-img" class="p51-shot-img" src="assets/footage/img38.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p51-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p51-shot-1-img");
      var ctx = document.getElementById("p51-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 79;
      var D = Math.PI / 180;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var k = FX.clamp(f / (N - 1), 0, 1);
        var e = 0.5 - 0.5 * Math.cos(Math.PI * k);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 18)) / 17, 0, 1));
        var S = 1.16 + 0.08 * k;
        var cx = 830 - 20 * e + hand(f, 3, 511);
        var cy = 600 + 40 * (1 - a) - 130 * ex + hand(f, 2, 513) * (1 - ex);
        var rot = D * hand(f, 0.3, 515);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p51 = camAt;
      var clock = FX.bindClock("p51", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 3.2 * FX.ease.inCubic(FX.clamp((f - (N - 18)) / 17, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p51"] = clock.tl;
    })();
  </script>
</template>
