<!-- P01 (images 0–89) — cosmos-vfx. Orbite : poussée 1,08 → 1,156 et roulis 0 → 8° (inOutSine), IDENTIQUES à p01-halo.html
     pour que le halo du logo reste collé au limbe. Le soleil perce le limbe (voile + éclat d'objectif qui montent),
     sortie par un flash solaire (2 images avant la coupe, reprises par P02). Tout est fonction de l'image locale. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p01-frame { position: absolute; inset: 0; overflow: hidden; }
    .p01-shot, .p01-shot-inner { position: absolute; inset: 0; }
    /* La plaque sert de source au canevas : elle reste invisible. */
    .p01-shot { opacity: 0; }
    .p01-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p01-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p01" data-width="1920" data-height="1080" data-duration="1.4833333333333334">
    <div id="p01-frame" class="p01-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p01-shot-1" class="p01-shot" data-src="img01" data-seq="0" data-seq-count="1">
        <div id="p01-shot-1-inner" class="p01-shot-inner">
          <img id="p01-shot-1-img" class="p01-shot-img" src="assets/footage/img01.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p01-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script src="lib/fx/transitions.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX, TR = FX.Transitions;
      var N = 89;
      /* Même mouvement que p01-halo.html (MOTION) : ne pas modifier l'un sans l'autre. */
      var MOTION = { push: [1.08, 1.156], roll: [0, 8], origin: [960, 540] };
      var SUN = [1750, 182]; // soleil sur le limbe d'img01 (repère de l'image)
      var img = document.getElementById("p01-shot-1-img");
      var ctx = document.getElementById("p01-canvas").getContext("2d");
      function xf(f) {
        var u = FX.ease.inOutSine(f / 88);
        return { k: FX.lerp(MOTION.push[0], MOTION.push[1], u), r: (FX.lerp(MOTION.roll[0], MOTION.roll[1], u) * Math.PI) / 180 };
      }
      function toScreen(p, m) {
        var dx = (p[0] - MOTION.origin[0]) * m.k, dy = (p[1] - MOTION.origin[1]) * m.k;
        var c = Math.cos(m.r), s = Math.sin(m.r);
        return [MOTION.origin[0] + dx * c - dy * s, MOTION.origin[1] + dx * s + dy * c];
      }
      var clock = FX.bindClock("p01", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, 1920, 1080);
        if (!img.complete || !img.naturalWidth) return;
        var m = xf(f);
        ctx.save();
        ctx.translate(MOTION.origin[0], MOTION.origin[1]);
        ctx.rotate(m.r);
        ctx.scale(m.k, m.k);
        ctx.translate(-MOTION.origin[0], -MOTION.origin[1]);
        ctx.drawImage(img, 0, 0, 1920, 1080);
        ctx.restore();
        var sun = toScreen(SUN, m);
        // Le soleil perce : noyau crème qui grossit sur le limbe.
        var rise = FX.smooth(6, 72, f);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var g = ctx.createRadialGradient(sun[0], sun[1], 0, sun[0], sun[1], 40 + 220 * rise);
        g.addColorStop(0, "rgba(250,248,245," + (0.25 + 0.6 * rise).toFixed(3) + ")");
        g.addColorStop(0.25, "rgba(255,226,180," + (0.12 + 0.3 * rise).toFixed(3) + ")");
        g.addColorStop(1, "rgba(255,210,150,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.restore();
        TR.lensFlare(ctx, { sun: sun, intensity: 0.2 + 0.8 * rise });
        // Flash solaire de sortie (coupe P01→P02) : mêmes réglages dans p02.html.
        TR.solarFlash(ctx, f, { cut: N, pre: 2, post: 2, origin: [1786, 352] });
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p01"] = clock.tl;
    })();
  </script>
</template>
