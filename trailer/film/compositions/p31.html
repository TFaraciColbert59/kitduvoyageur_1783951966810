<!-- P31 (images 1901–1954, 53 images) — landscape-director. img22, par-dessus l'épaule, la photo ; écran VERT laissé intact (incrustation E9 par ui-builder).
     Entrée sur la poussée de P30 (S 1,30 → 1,40 en outCubic sur 14 images), dérive douce vers le téléphone (≈ 1236, 392).
     Sortie : panoramique vers la gauche, vers le coureur à venir (cx -300, inCubic sur 12 images), au plus rapide à la coupe 1954.
     Caméra : window.__lkdvCam.p31(f) → { S, cx, cy, rot } (cx, cy en pixels de l'image 1920×1080 au centre de l'écran). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p31-frame { position: absolute; inset: 0; overflow: hidden; }
    .p31-shot, .p31-shot-inner { position: absolute; inset: 0; }
    .p31-shot { opacity: 0; }
    .p31-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p31-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p31" data-width="1920" data-height="1080" data-duration="0.8833333333333333">
    <div id="p31-frame" class="p31-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p31-shot-1" class="p31-shot" data-src="img22" data-seq="0" data-seq-count="1">
        <div id="p31-shot-1-inner" class="p31-shot-inner">
          <img id="p31-shot-1-img" class="p31-shot-img" src="assets/footage/img22.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p31-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p31-shot-1-img");
      var ctx = document.getElementById("p31-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 53;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 14, 0, 1));
        var p = FX.ease.inOutCubic(FX.clamp(f / 40, 0, 1));
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 12)) / 12, 0, 1));
        var S = 1.30 + 0.10 * a + 0.08 * p;
        var cx = 1100 + 60 * p - 300 * ex + hand(f, 3, 311);
        var cy = 560 - 60 * p + hand(f, 2, 313);
        var rot = (Math.PI / 180) * (0.5 * (1 - a) - 1.5 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p31 = camAt;
      var clock = FX.bindClock("p31", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p31"] = clock.tl;
    })();
  </script>
</template>
