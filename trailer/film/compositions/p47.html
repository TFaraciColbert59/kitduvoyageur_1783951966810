<!-- P47 (images 2930–2981, 51 images) — landscape-director. img36, gros plan autour du feu, rotation lente.
     Entrée : prolonge la poussée lente de P46 vers le feu (S 1,10 → 1,18, sans à-coup). Roulis lent −1,4° → +1,0° (inOutSine), dérive vers la gauche (cx 960 → 920).
     Sortie (« Léa sort son téléphone ») : mouvement posé, peu de flou. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p47-frame { position: absolute; inset: 0; overflow: hidden; }
    .p47-shot, .p47-shot-inner { position: absolute; inset: 0; }
    .p47-shot { opacity: 0; }
    .p47-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p47-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p47" data-width="1920" data-height="1080" data-duration="0.85">
    <div id="p47-frame" class="p47-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p47-shot-1" class="p47-shot" data-src="img36" data-seq="0" data-seq-count="1">
        <div id="p47-shot-1-inner" class="p47-shot-inner">
          <img id="p47-shot-1-img" class="p47-shot-img" src="assets/footage/img36.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p47-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p47-shot-1-img");
      var ctx = document.getElementById("p47-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 51;
      var D = Math.PI / 180;
      function camAt(f) {
        var k = FX.clamp(f / (N - 1), 0, 1);
        var e = 0.5 - 0.5 * Math.cos(Math.PI * k);
        var S = 1.10 + 0.08 * k;
        var cx = 960 - 40 * e + hand(f, 3, 471);
        var cy = 545 + hand(f, 2, 473);
        var rot = D * (-1.4 + 2.4 * e + hand(f, 0.2, 475));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p47", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p47"] = clock.tl;
    })();
  </script>
</template>
