<!-- P05 (images 272–325, 53 images) — cosmos-vfx. Plongée verticale qui accélère vers la fenêtre éclairée au centre
     d'img05 (vitre mesurée : 939,505 → 979,567), TR.glassPass jusqu'au passage de la vitre sur la dernière image
     (p = 0,62 = pass, éclat chaud) : la dernière image montre déjà l'intérieur (img06), prête pour la coupe
     sur P06 au drop (image 325). Tout est fonction de l'image locale. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p05-frame { position: absolute; inset: 0; overflow: hidden; }
    .p05-shot, .p05-shot-inner { position: absolute; inset: 0; }
    .p05-shot { opacity: 0; }
    .p05-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p05-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p05" data-width="1920" data-height="1080" data-duration="0.8833333333333333">
    <div id="p05-frame" class="p05-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p05-shot-1" class="p05-shot" data-src="img05" data-seq="0" data-seq-count="1">
        <div id="p05-shot-1-inner" class="p05-shot-inner">
          <img id="p05-shot-1-img" class="p05-shot-img" src="assets/footage/img05.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
      <!-- Intérieur vu à travers la vitre (plaque de P06), source du canevas uniquement. -->
      <img id="p05-inside-img" class="p05-shot-img" src="assets/footage/img06.png" alt="" style="opacity: 0" />
    </div>
    <canvas id="p05-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script src="lib/fx/transitions.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX, TR = FX.Transitions;
      var N = 53, W = 1920, H = 1080;
      var RECT = [939, 505, 40, 62]; // la vitre éclairée d'img05
      var PASS = 0.62;
      var img = document.getElementById("p05-shot-1-img");
      var inside = document.getElementById("p05-inside-img");
      var ctx = document.getElementById("p05-canvas").getContext("2d");
      var buf = FX.canvas(W, H), bx = buf.getContext("2d");
      // L'intérieur vu par la fenêtre (portrait) : recadrage d'img06 autour de Léa, étiré pour que glassPass le
      // remette à ses proportions dans le rectangle de la vitre.
      var insideWin = FX.canvas(W, H), iwx = insideWin.getContext("2d");
      var insideReady = false;
      function prepInside() {
        if (insideReady || !inside.complete || !inside.naturalWidth) return;
        // CORRECTIONS-1 (saut en fin de P05) : la partie de cette texture que glassPass montre plein cadre juste
        // avant le passage (k = 1 : 68,7 % × 24,9 % au centre, agrandie ×1,456 / ×4,01) contient img06 ENTIÈRE,
        // à l'échelle de la première image « dedans » (settle 1,08) : l'avant-dernière image de P05 et la
        // dernière (img06 plein cadre) se raccordent sans saut. Autour : la même pièce, adoucie (vue lointaine).
        var Sfull = (W / RECT[2]) * 1.12;
        var sx = (RECT[2] * 1.3 * Sfull) / W, sy = (RECT[3] * 1.3 * Sfull) / H;
        var dw = (W * 1.08) / sx, dh = (H * 1.08) / sy;
        // Pourtour : halo chaud de la pièce (aucune seconde copie d'img06, pas de double image).
        var halo = iwx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.75);
        halo.addColorStop(0, "#d9b07a");
        halo.addColorStop(1, "#7a5532");
        iwx.fillStyle = halo;
        iwx.fillRect(0, 0, W, H);
        // Cœur : img06 entière, bords fondus (pas d'arête de cadre dans le cadre).
        var core = FX.canvas(Math.ceil(dw), Math.ceil(dh)), cc = core.getContext("2d");
        cc.drawImage(inside, 0, 0, dw, dh);
        cc.globalCompositeOperation = "destination-out";
        var fx = dw * 0.08, fy = dh * 0.08, gr;
        gr = cc.createLinearGradient(0, 0, fx, 0); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        cc.fillStyle = gr; cc.fillRect(0, 0, fx, dh);
        gr = cc.createLinearGradient(dw, 0, dw - fx, 0); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        cc.fillStyle = gr; cc.fillRect(dw - fx, 0, fx, dh);
        gr = cc.createLinearGradient(0, 0, 0, fy); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        cc.fillStyle = gr; cc.fillRect(0, 0, dw, fy);
        gr = cc.createLinearGradient(0, dh, 0, dh - fy); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        cc.fillStyle = gr; cc.fillRect(0, dh - fy, dw, fy);
        iwx.drawImage(core, W / 2 - dw / 2, H / 2 - dh / 2, dw, dh);
        insideReady = true;
      }
      var clock = FX.bindClock("p05", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, W, H);
        if (!img.complete || !img.naturalWidth) return;
        prepInside();
        var u = f / (N - 1);
        // Départ à p = 0,2 : la plongée est déjà lancée sur la coupe P04→P05 (pas de départ arrêté).
        var p = f >= N - 1 ? PASS : FX.lerp(0.2, PASS, u);
        bx.setTransform(1, 0, 0, 1, 0, 0);
        bx.fillStyle = "#0B1F17";
        bx.fillRect(0, 0, W, H);
        var inC = p >= PASS - 1e-9 ? inside : insideReady ? insideWin : inside;
        TR.glassPass(bx, img, inC, p, { rect: RECT, pass: PASS, drops: 90, seed: 6 });
        // Flou radial de vitesse : repris de P04 au début, puis porté par glassPass.
        var amount = 0.045 * (1 - FX.smooth(0, 24, f)) + 0.03 * u * u;
        // CORRECTIONS-1 : le flou radial de fin de P04 (0,08) est prolongé et décroît sur les 3 premières images.
        amount = Math.max(amount, 0.08 * (1 - f / 3));
        if (p < PASS - 1e-9) TR.radialBlur(ctx, buf, { amount: amount, origin: [960, 540], samples: 8 });
        else ctx.drawImage(buf, 0, 0);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      inside.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p05"] = clock.tl;
    })();
  </script>
</template>
