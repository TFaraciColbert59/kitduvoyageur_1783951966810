<!-- P17 (images 1034–1060, 26 images, un temps) — landscape-director. img43, très gros plan du pouce sur l'écran.
     Entrée : la poussée de P16 continue en freinant (S 1,10 → 1,22, outExpo, 9 i) vers la pulpe du pouce.
     Appui à l'image 17 : coup de zoom inExpo (S → 1,52 à la coupe) et secousse brève à graine qui monte jusqu'à la coupe :
     IMPACT sur la coupe 1060 (sonnette de P18). Écran VERT intact. Caméra : window.__lkdvCam.p17(f) → { S, cx, cy, rot }. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p17-frame { position: absolute; inset: 0; overflow: hidden; }
    .p17-shot, .p17-shot-inner { position: absolute; inset: 0; }
    .p17-shot { opacity: 0; }
    .p17-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p17-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p17" data-width="1920" data-height="1080" data-duration="0.43333333333333335">
    <div id="p17-frame" class="p17-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p17-shot-1" class="p17-shot" data-src="img43" data-seq="0" data-seq-count="1">
        <div id="p17-shot-1-inner" class="p17-shot-inner">
          <img id="p17-shot-1-img" class="p17-shot-img" src="assets/footage/img43.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p17-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p17-shot-1-img");
      var ctx = document.getElementById("p17-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 26;
      function camAt(f) {
        var a = FX.ease.outExpo(FX.clamp(f / 9, 0, 1));
        var k = FX.ease.inExpo(FX.clamp((f - 17) / (N - 1 - 17), 0, 1));
        var sh = FX.clamp((f - 17) / 4, 0, 1);
        var S = 1.10 + 0.12 * a + 0.30 * k;
        var cx = 1010 + (980 - 1010) * a + hand(f, 5, 171) + (FX.noise2(f * 1.7, 2.1, 173) - 0.5) * 26 * sh;
        var cy = 640 + (700 - 640) * a + hand(f, 4, 175) + (FX.noise2(f * 1.7, 6.3, 177) - 0.5) * 22 * sh;
        var rot = (Math.PI / 180) * (FX.noise2(f * 1.3, 9.1, 179) - 0.5) * 1.6 * sh;
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p17 = camAt;
      var clock = FX.bindClock("p17", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.5);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p17"] = clock.tl;
    })();
  </script>
</template>
