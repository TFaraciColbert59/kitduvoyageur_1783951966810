<!-- P41 (images 2508–2560, 52 images) — landscape-director. img31, ras de la roue, gravillons projetés.
     Entrée sur la poussée de P40 : S 1,12 → 1,22 (outCubic, 10 images), centrée sur le moyeu (≈ 1000, 600) ; tremblé de piste à graine.
     Sortie (vers la vue du ciel, P42) : montée (cy −190), roulis +3°, S +0,15, inCubic sur 9 images. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p41-frame { position: absolute; inset: 0; overflow: hidden; }
    .p41-shot, .p41-shot-inner { position: absolute; inset: 0; }
    .p41-shot { opacity: 0; }
    .p41-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p41-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p41" data-width="1920" data-height="1080" data-duration="0.8666666666666667">
    <div id="p41-frame" class="p41-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p41-shot-1" class="p41-shot" data-src="img31" data-seq="0" data-seq-count="1">
        <div id="p41-shot-1-inner" class="p41-shot-inner">
          <img id="p41-shot-1-img" class="p41-shot-img" src="assets/footage/img31.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p41-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p41-shot-1-img");
      var ctx = document.getElementById("p41-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 52;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 10, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1));
        var D = Math.PI / 180;
        var S = 1.12 + 0.10 * a + 0.04 * k + 0.15 * ex;
        var cx = 1010 - 50 * FX.ease.inOutSine(k) + hand(f, 9, 411) + (FX.noise2(f * 0.9, 2.1, 415) - 0.5) * 4;
        var cy = 600 - 190 * ex + hand(f, 7, 413) + (FX.noise2(f * 0.9, 3.7, 417) - 0.5) * 4;
        var rot = D * (0.3 * Math.sin(f * 0.21) + 3.0 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p41", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.1 * Math.pow(1 - FX.clamp(f / 4, 0, 1), 2) + 1.1 * FX.ease.inCubic(FX.clamp((f - (N - 4)) / 4, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p41"] = clock.tl;
    })();
  </script>
</template>
