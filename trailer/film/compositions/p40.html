<!-- P40 ★ (images 2429–2508, 79 images) — landscape-director. img30, drone latéral : Clara minuscule (≈ 960, 810) sur le gravel au bord du lac doré, sommets gardés en haut du cadre.

<template>
  <style>

    #p40-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p40" data-width="1920" data-height="1080" data-duration="1.3166666666666667">
    <div id="p40-frame" class="p40-frame" data-layout-allow-overflow>

  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p40-shot-1-img");
      var ctx = document.getElementById("p40-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 79;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 10, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1));
        var D = Math.PI / 180;
        var S = 1.12 - 0.04 * FX.ease.inOutSine(k) + 0.45 * ex;
        var cx = 820 + 110 * a + 60 * FX.ease.inOutSine(k) - 30 * ex + hand(f, 3, 401);
        var cy = 490 + 300 * ex + hand(f, 2, 403);
        var rot = D * (2.0 * (1 - a) - 0.4 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p40", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.1 * Math.pow(1 - FX.clamp(f / 4, 0, 1), 2) + 1.1 * FX.ease.inCubic(FX.clamp((f - (N - 4)) / 4, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p40"] = clock.tl;
    })();
  </script>
