<!-- P19 (images 1139–1191, 52 images) — landscape-director. img12, vue de dessus du matériel étalé.
     Entrée : poussée rapide qui prolonge celle de P18 (S 1,10 → 1,45, outCubic, 20 i) vers le sac au centre.
     Roulis léger 0 → +3° (inOutSine). Sortie : nouvelle accélération (inCubic, dès l'image 18, S → 2,45) vers la sangle
     et la boucle du sac (≈ 936, 590), au plus rapide à la coupe 1191 (clac de la boucle, P20).
     Caméra : window.__lkdvCam.p19(f) → { S, cx, cy, rot }. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p19-frame { position: absolute; inset: 0; overflow: hidden; }
    .p19-shot, .p19-shot-inner { position: absolute; inset: 0; }
    .p19-shot { opacity: 0; }
    .p19-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p19-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p19" data-width="1920" data-height="1080" data-duration="0.8666666666666667">
    <div id="p19-frame" class="p19-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p19-shot-1" class="p19-shot" data-src="img12" data-seq="0" data-seq-count="1">
        <div id="p19-shot-1-inner" class="p19-shot-inner">
          <img id="p19-shot-1-img" class="p19-shot-img" src="assets/footage/img12.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p19-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p19-shot-1-img");
      var ctx = document.getElementById("p19-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 52;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 20, 0, 1));
        var z = FX.ease.inCubic(FX.clamp((f - 18) / (N - 1 - 18), 0, 1));
        var g = FX.ease.inOutSine(FX.clamp(f / (N - 1), 0, 1));
        var S = 1.10 + 0.35 * a + 1.0 * z;
        var cx = 975 + (940 - 975) * a + (936 - 940) * z + hand(f, 6, 191);
        var cy = 520 + (560 - 520) * a + (590 - 560) * z + hand(f, 5, 193);
        var rot = (Math.PI / 180) * 3 * g;
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p19 = camAt;
      var clock = FX.bindClock("p19", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.55);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p19"] = clock.tl;
    })();
  </script>
</template>
