<!-- P29 (images 1769–1822, 53 images) — landscape-director. img46, téléphone net devant les Tre Cime ; écran VERT laissé intact (incrustation E8 par ui-builder).
     Entrée sur le panoramique droit de P28 (cx 1000 → 1150 en outCubic sur 14 images), poussée douce vers le téléphone (≈ 1183, 768), S 1,35 → 1,50.
     Sortie : la caméra se lève vers le lac à venir (cy -160, S -0,10, inCubic sur 12 images), au plus rapide à la coupe 1822.
     Caméra : window.__lkdvCam.p29(f) → { S, cx, cy, rot } (cx, cy en pixels de l'image 1920×1080 au centre de l'écran). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p29-frame { position: absolute; inset: 0; overflow: hidden; }
    .p29-shot, .p29-shot-inner { position: absolute; inset: 0; }
    .p29-shot { opacity: 0; }
    .p29-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p29-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p29" data-width="1920" data-height="1080" data-duration="0.8833333333333333">
    <div id="p29-frame" class="p29-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p29-shot-1" class="p29-shot" data-src="img46" data-seq="0" data-seq-count="1">
        <div id="p29-shot-1-inner" class="p29-shot-inner">
          <img id="p29-shot-1-img" class="p29-shot-img" src="assets/footage/img46.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p29-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p29-shot-1-img");
      var ctx = document.getElementById("p29-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 53;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 14, 0, 1));
        var p = FX.ease.inOutCubic(FX.clamp(f / 40, 0, 1));
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 12)) / 12, 0, 1));
        var S = 1.35 + 0.15 * p - 0.10 * ex;
        var cx = 1000 + 150 * a + 30 * p + hand(f, 3, 291);
        var cy = 640 + 40 * p - 160 * ex + hand(f, 2, 293);
        var rot = (Math.PI / 180) * (0.6 * (1 - a) - 1.0 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p29 = camAt;
      var clock = FX.bindClock("p29", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p29"] = clock.tl;
    })();
  </script>
</template>
