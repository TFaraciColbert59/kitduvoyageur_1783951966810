<!-- P33 (images 2009–2063, 54 images) — landscape-director. img24, filé latéral, Malik sur le balcon au-dessus du vide. DROP 2.
     Entrée SUR le filé gauche de P32 : cx 1150 → 910 (outCubic, 12 images), poussée qui continue (S 1,30 → 1,46), roulis -2° → 0, obturateur long qui retombe ; impact : secousse amortie (images 0–10).
     Corps : caméra nerveuse (tremblé à graine fort). Sortie : bascule vers les pieds (cy +330, S +0,30, inCubic sur 9 images), au plus rapide à la coupe 2063. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p33-frame { position: absolute; inset: 0; overflow: hidden; }
    .p33-shot, .p33-shot-inner { position: absolute; inset: 0; }
    .p33-shot { opacity: 0; }
    .p33-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p33-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p33" data-width="1920" data-height="1080" data-duration="0.9">
    <div id="p33-frame" class="p33-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p33-shot-1" class="p33-shot" data-src="img24" data-seq="0" data-seq-count="1">
        <div id="p33-shot-1-inner" class="p33-shot-inner">
          <img id="p33-shot-1-img" class="p33-shot-img" src="assets/footage/img24.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p33-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p33-shot-1-img");
      var ctx = document.getElementById("p33-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 54;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var z = FX.ease.outCubic(FX.clamp(f / 10, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1));
        var j = Math.exp(-f / 3.5) * Math.sin(f * 2.2);
        var S = 1.30 + 0.16 * z + 0.04 * k + 0.30 * ex;
        var cx = 1150 - 240 * a + 20 * k + hand(f, 12, 331);
        var cy = 405 + 18 * j + 330 * ex + hand(f, 8, 333);
        var rot = (Math.PI / 180) * (-2.0 * (1 - a) + 0.8 * j + 1.0 * ex + hand(f, 0.6, 335));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p33", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.8 * Math.pow(1 - FX.clamp(f / 8, 0, 1), 2) + 1.8 * FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p33"] = clock.tl;
    })();
  </script>
</template>
