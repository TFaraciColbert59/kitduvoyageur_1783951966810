<!-- P36 (images 2192–2245, 53 images) — landscape-director. img27, gros plan du brassard ; écran VERT laissé intact (incrustation E10 par ui-builder).
     Entrée sur le filé droit de P35 : cx 980 → 1240 (outCubic, 12 images), roulis +2° → 0. Dérive vers le téléphone (≈ 1515, 555), S 1,40 → 1,46.
     Sortie : panoramique droit + poussée (cx +100, S +0,25, inCubic sur 9 images) vers le torrent de P37.
     Caméra : window.__lkdvCam.p36(f) → { S, cx, cy, rot } (cx, cy en pixels de l'image 1920×1080 au centre de l'écran). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p36-frame { position: absolute; inset: 0; overflow: hidden; }
    .p36-shot, .p36-shot-inner { position: absolute; inset: 0; }
    .p36-shot { opacity: 0; }
    .p36-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p36-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p36" data-width="1920" data-height="1080" data-duration="0.8833333333333333">
    <div id="p36-frame" class="p36-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p36-shot-1" class="p36-shot" data-src="img27" data-seq="0" data-seq-count="1">
        <div id="p36-shot-1-inner" class="p36-shot-inner">
          <img id="p36-shot-1-img" class="p36-shot-img" src="assets/footage/img27.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p36-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p36-shot-1-img");
      var ctx = document.getElementById("p36-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 53;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1));
        var S = 1.40 + 0.06 * k + 0.25 * ex;
        var cx = 980 + 260 * a + 100 * ex + hand(f, 4, 361);
        var cy = 560 + hand(f, 4, 363);
        var rot = (Math.PI / 180) * (2.0 * (1 - a) + 1.0 * ex + hand(f, 0.4, 365));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p36 = camAt;
      var clock = FX.bindClock("p36", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.6 * Math.pow(1 - FX.clamp(f / 8, 0, 1), 2) + 1.6 * FX.ease.inCubic(FX.clamp((f - (N - 9)) / 9, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p36"] = clock.tl;
    })();
  </script>
</template>
