<!-- P50 (images 3113–3192, 79 images) — landscape-director. img49 ★ : le drone recule et s'élève, le bivouac devient un point de lumière sous la Voie lactée et les Tre Cime.
     Entrée sur la bascule haute de P49 : le contenu descend déjà (cy 706 → 515) pendant que le drone recule (S 1,45 → 1,06, géométrique), vitesse non nulle aux deux bouts.
     Le bivouac (≈ 950, 870) reste dans le cadre de bout en bout ; roulis −1° → 0.
     Sortie (« une lumière d'écran ailleurs ») : montée continue, flou modéré. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p50-frame { position: absolute; inset: 0; overflow: hidden; }
    .p50-shot, .p50-shot-inner { position: absolute; inset: 0; }
    .p50-shot { opacity: 0; }
    .p50-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p50-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p50" data-width="1920" data-height="1080" data-duration="1.3166666666666667">
    <div id="p50-frame" class="p50-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p50-shot-1" class="p50-shot" data-src="img49" data-seq="0" data-seq-count="1">
        <div id="p50-shot-1-inner" class="p50-shot-inner">
          <img id="p50-shot-1-img" class="p50-shot-img" src="assets/footage/img49.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p50-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p50-shot-1-img");
      var ctx = document.getElementById("p50-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 79;
      var D = Math.PI / 180;
      function camAt(f) {
        var k = FX.clamp(f / (N - 1), 0, 1);
        var E = 0.45 * k + 0.55 * (k * k * (3 - 2 * k));
        var S = 1.45 * Math.pow(1.06 / 1.45, E);
        var cx = 950 + 10 * E + hand(f, 2, 501);
        var cy = 706 - 191 * E + hand(f, 2, 503);
        var rot = D * (-1.0 * (1 - E));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p50", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 1.0 + 1.2 * Math.pow(1 - FX.clamp(f / 10, 0, 1), 2));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p50"] = clock.tl;
    })();
  </script>
