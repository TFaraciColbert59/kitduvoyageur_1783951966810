<!-- P08 (images 482–508, 26 images) — landscape-director. Très gros plan de l'œil (img08), un seul temps :
     impact (coup de zoom 1,22 → 1,10 en 5 images, flou de zoom et secousse qui retombent), puis micro-poussée vers
     la pupille (1,10 → 1,20) ; le reflet turquoise du lac (pupille, ~1012–1112 × 497–575) s'allume d'un halo doux
     qui gonfle jusqu'à la coupe (raccord « rond de la pupille »). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p08-frame { position: absolute; inset: 0; overflow: hidden; }
    .p08-shot, .p08-shot-inner { position: absolute; inset: 0; }
    .p08-shot { opacity: 0; }
    .p08-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p08-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p08" data-width="1920" data-height="1080" data-duration="0.43333333333333335">
    <div id="p08-frame" class="p08-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p08-shot-1" class="p08-shot" data-src="img08" data-seq="0" data-seq-count="1">
        <div id="p08-shot-1-inner" class="p08-shot-inner">
          <img id="p08-shot-1-img" class="p08-shot-img" src="assets/footage/img08.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p08-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var N = 26, W = 1920, H = 1080;
      var PX = 1062, PY = 536; // reflet dans la pupille
      var img = document.getElementById("p08-shot-1-img");
      var ctx = document.getElementById("p08-canvas").getContext("2d");
      var buf = FX.canvas(W, H), bx = buf.getContext("2d");
      var clock = FX.bindClock("p08", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, W, H);
        if (!img.complete || !img.naturalWidth) return;
        var u = f / (N - 1);
        var hit = Math.exp(-f / 2.2);
        var S = 1.10 + 0.12 * hit + 0.10 * FX.ease.inQuad(u);
        var shake = 7 * hit;
        var cx = FX.lerp(1000, PX, u) + (FX.hash2(f, 1, 81) - 0.5) * 2 * shake;
        var cy = PY + (FX.hash2(f, 2, 82) - 0.5) * 2 * shake;
        cx = FX.clamp(cx, W / 2 / S, W - W / 2 / S);
        cy = FX.clamp(cy, H / 2 / S, H - H / 2 / S);
        bx.setTransform(S, 0, 0, S, W / 2 - S * cx, H / 2 - S * cy);
        bx.drawImage(img, 0, 0, W, H);
        // Reflet turquoise : halo additif centré sur l'écran reflété, qui gonfle vers la coupe.
        var glow = 0.25 + 0.55 * FX.ease.inQuad(u);
        var r = 70 + 50 * u;
        var g = bx.createRadialGradient(PX, PY, 4, PX, PY, r);
        g.addColorStop(0, "rgba(90,220,225," + (0.55 * glow).toFixed(3) + ")");
        g.addColorStop(1, "rgba(90,220,225,0)");
        bx.globalCompositeOperation = "lighter";
        bx.fillStyle = g;
        bx.fillRect(PX - r, PY - r, 2 * r, 2 * r);
        bx.globalCompositeOperation = "source-over";
        bx.setTransform(1, 0, 0, 1, 0, 0);
        var sx = 960 + S * (PX - cx), sy = 540 + S * (PY - cy);
        FX.zoomBlur(ctx, buf, sx, sy, 0.06 * hit + 0.02 * u * u, 8, W, H);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p08"] = clock.tl;
    })();
  </script>
</template>
