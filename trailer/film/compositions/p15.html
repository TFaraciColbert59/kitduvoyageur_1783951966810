<!-- P15 (images 876–928, 52 images) — landscape-director. img41 recadrée autrement que P13 : départ serré et décalé
     (S 1,30, cx 1150), poussée franche vers l'écran (S → 1,72 à l'image 38, outCubic) où l'itinéraire se tracera (E4,
     ui-builder). Sortie : elle se laisse tomber sur le lit — la caméra plonge vers le bas (cy jusqu'à la butée basse,
     inCubic, roulis jusqu'à −2°), au plus rapide à la coupe, flou de mouvement réel. Écran VERT intact.
     Caméra exposée : window.__lkdvCam.p15(f) → { S, cx, cy, rot } (rot en radians autour du centre de l'écran, nul jusqu'à
     l'image 38 ; img41 → écran : rotation rot de (S·(x − cx), S·(y − cy)) puis + (960, 540)). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p15-frame { position: absolute; inset: 0; overflow: hidden; }
    .p15-shot, .p15-shot-inner { position: absolute; inset: 0; }
    .p15-shot { opacity: 0; }
    .p15-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p15-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p15" data-width="1920" data-height="1080" data-duration="0.8666666666666667">
    <div id="p15-frame" class="p15-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p15-shot-1" class="p15-shot" data-src="img41" data-seq="0" data-seq-count="1">
        <div id="p15-shot-1-inner" class="p15-shot-inner">
          <img id="p15-shot-1-img" class="p15-shot-img" src="assets/footage/img41.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p15-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p15-shot-1-img");
      var ctx = document.getElementById("p15-canvas").getContext("2d");
      function hand(f, amp, seed) {
        // Tremblement de main : bruit lent + frisson rapide, à graine (fonction du temps).
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        // L'image ne découvre jamais ses bords : centre bridé selon l'échelle et le roulis.
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        // Flou de mouvement réel : moyenne de la caméra sur l'obturation (180° par défaut), échantillons selon la vitesse.
        shutter = shutter == null ? 0.5 : shutter;
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 52;
      function camAt(f) {
        var push = FX.ease.outCubic(FX.clamp(f / 38, 0, 1));
        var drop = FX.ease.inCubic(FX.clamp((f - 38) / (N - 1 - 38), 0, 1));
        var S = 1.30 + 0.42 * push - 0.06 * drop;
        var cx = 1150 + (1080 - 1150) * push + hand(f, 6, 151);
        var cy = 520 + (465 - 520) * push + hand(f, 5, 153);
        cy = cy + 340 * drop;
        cx = cx - 40 * drop;
        var rot = -(Math.PI / 180) * 2 * drop;
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p15 = camAt;
      var clock = FX.bindClock("p15", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p15"] = clock.tl;
    })();
  </script>
</template>
