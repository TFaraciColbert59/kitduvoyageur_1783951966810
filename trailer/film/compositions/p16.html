<!-- P16 (images 928–1034, 106 images) — landscape-director. img42, plongée sur Léa allongée.
     Entrée : raccord sur la chute de P15 — la caméra continue de descendre (l'image monte) en freinant (outCubic, 40 i)
     et le roulis de −2° se redresse (outExpo, 12 i) ; Léa sourit, cadrée large (S 1,12 → 1,18).
     Dès l'image 38 : descente franche vers le téléphone posé sur le drap (inOutCubic pour la position, inCubic pour
     l'échelle) jusqu'à S 3,2 centré sur l'écran : l'écran vert (img42 : 908–1011 × 813–1010, 197 px) occupe ≈ 58 %
     de la hauteur du cadre à la fin. Sortie au plus rapide de la poussée (vers le pouce de P17). Écran VERT intact.
     Caméra exposée : window.__lkdvCam.p16(f) → { S, cx, cy, rot } (img42 → écran : rotation rot de
     (S·(x − cx), S·(y − cy)) puis + (960, 540)). -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p16-frame { position: absolute; inset: 0; overflow: hidden; }
    .p16-shot, .p16-shot-inner { position: absolute; inset: 0; }
    .p16-shot { opacity: 0; }
    .p16-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p16-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p16" data-width="1920" data-height="1080" data-duration="1.7666666666666666">
    <div id="p16-frame" class="p16-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p16-shot-1" class="p16-shot" data-src="img42" data-seq="0" data-seq-count="1">
        <div id="p16-shot-1-inner" class="p16-shot-inner">
          <img id="p16-shot-1-img" class="p16-shot-img" src="assets/footage/img42.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p16-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p16-shot-1-img");
      var ctx = document.getElementById("p16-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 106;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 40, 0, 1));
        var r = FX.ease.outExpo(FX.clamp(f / 12, 0, 1));
        var p = FX.clamp((f - 38) / (N - 1 - 38), 0, 1);
        var zs = FX.ease.inCubic(p), zp = FX.ease.inOutCubic(FX.clamp((f - 38) / 58, 0, 1));
        var S0 = 1.12 + 0.06 * a;
        var S = S0 + (3.2 - S0) * zs;
        var cx0 = 1012 + hand(f, 7, 161), cy0 = 470 + 75 * a + hand(f, 6, 163);
        var cx = cx0 + (960 - cx0) * zp + hand(f, 2, 167) * (1 - zp);
        var cy = cy0 + (911 - cy0) * zp;
        var rot = -(Math.PI / 180) * 2 * (1 - r);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p16 = camAt;
      var clock = FX.bindClock("p16", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.55);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p16"] = clock.tl;
    })();
  </script>
</template>
