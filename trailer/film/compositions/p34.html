<!-- P34 (images 2063–2114, 51 images) — landscape-director. img25, très gros plan au ras du sol, ralenti, impact sur la pierre.
     Entrée sur la bascule vers le bas de P33 : cy 420 → 560 (outCubic, 10 images), impact (secousse amortie, images 0–12).
     Corps : ralenti, poussée lente (S 1,30 → 1,38). Sortie : poussée vers l'avant qui accélère (S +0,45, inCubic sur 8 images) vers la vue arrière de P35. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p34-frame { position: absolute; inset: 0; overflow: hidden; }
    .p34-shot, .p34-shot-inner { position: absolute; inset: 0; }
    .p34-shot { opacity: 0; }
    .p34-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p34-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p34" data-width="1920" data-height="1080" data-duration="0.85">
    <div id="p34-frame" class="p34-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p34-shot-1" class="p34-shot" data-src="img25" data-seq="0" data-seq-count="1">
        <div id="p34-shot-1-inner" class="p34-shot-inner">
          <img id="p34-shot-1-img" class="p34-shot-img" src="assets/footage/img25.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p34-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p34-shot-1-img");
      var ctx = document.getElementById("p34-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 51;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 10, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 8)) / 8, 0, 1));
        var j = Math.exp(-f / 4) * Math.sin(f * 1.9);
        var S = 1.30 + 0.08 * k + 0.45 * ex;
        var cx = 930 + 25 * k + 14 * j + hand(f, 4, 341);
        var cy = 420 + 140 * a + 16 * j + hand(f, 3, 343);
        var rot = (Math.PI / 180) * (0.9 * j + 0.6 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p34", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.6 * Math.pow(1 - FX.clamp(f / 7, 0, 1), 2) + 1.8 * FX.ease.inCubic(FX.clamp((f - (N - 8)) / 8, 0, 1)));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p34"] = clock.tl;
    })();
  </script>
</template>
