<!-- P49 (images 3060–3113, 53 images) — landscape-director. img37 (même image que P48), très gros plan : elle publie ; écran VERT laissé intact (E12, ui-builder).
     Début de la MONTÉE : la caméra de P48 continue (même fonction, g = 79 + f) et accélère vers le téléphone : S 1,18 → 1,66 (u^2,2), cx 1100 → 1190.
     Sortie (« le drone s'élève ») : bascule vers le haut sur les 16 dernières images (cy 540 → 495, inCubic), flou croissant. Téléphone entier jusqu'au bout.
     Caméra : window.__lkdvCam.p49(f) → { S, cx, cy, rot }. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p49-frame { position: absolute; inset: 0; overflow: hidden; }
    .p49-shot, .p49-shot-inner { position: absolute; inset: 0; }
    .p49-shot { opacity: 0; }
    .p49-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p49-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p49" data-width="1920" data-height="1080" data-duration="0.8833333333333333">
    <div id="p49-frame" class="p49-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p49-shot-1" class="p49-shot" data-src="img37" data-seq="0" data-seq-count="1">
        <div id="p49-shot-1-inner" class="p49-shot-inner">
          <img id="p49-shot-1-img" class="p49-shot-img" src="assets/footage/img37.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p49-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p49-shot-1-img");
      var ctx = document.getElementById("p49-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 53;
      var D = Math.PI / 180;
      // Caméra commune P48/P49 : g = image depuis 2981 (0–78 = P48, 79–131 = P49).
      function leaCam(g) {
        var k = FX.clamp(g / 78, 0, 1);
        var e = 0.5 - 0.5 * Math.cos(Math.PI * k);
        var u = FX.clamp((g - 78) / 53, 0, 1);
        var acc = Math.pow(u, 2.2);
        var up = FX.ease.inCubic(FX.clamp((u - 0.7) / 0.3, 0, 1));
        var calm = 1 - u;
        var S = 1.10 + 0.08 * k + 0.001 * Math.max(0, g - 78) + 0.43 * acc;
        var cx = 1000 + 100 * e + 90 * acc + hand(g, 3, 481) * calm;
        var cy = 540 - 45 * up + hand(g, 2, 483) * calm;
        var rot = D * hand(g, 0.25, 485) * calm;
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      function camAt(f) { return leaCam(79 + f); }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p49 = camAt;
      var clock = FX.bindClock("p49", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.8 * Math.pow(FX.clamp(f / (N - 1), 0, 1), 2.2));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p49"] = clock.tl;
    })();
  </script>
</template>
