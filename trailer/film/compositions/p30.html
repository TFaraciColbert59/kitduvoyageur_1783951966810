<!-- P30 (images 1822–1901, 79 images) — landscape-director. img09b ★ Sorapis : élévation et glissé au-dessus du lac.
     Entrée sur la levée de P29 (cy 640 → 560 en outCubic sur 18 images, l'image descend), puis glissé lent vers la droite (cx 900 → 1020, inOutSine)
     et léger recul (S 1,30 → 1,22) : Léa (≈ 1056, 906) reste minuscule sur la rive, le lac et le Sorapis plein cadre.
     Sortie : poussée vers Léa qui lève le téléphone (S +0,30, cy +120, inCubic sur 14 images), au plus rapide à la coupe 1901. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p30-frame { position: absolute; inset: 0; overflow: hidden; }
    .p30-shot, .p30-shot-inner { position: absolute; inset: 0; }
    .p30-shot { opacity: 0; }
    .p30-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p30-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p30" data-width="1920" data-height="1080" data-duration="1.3166666666666667">
    <div id="p30-frame" class="p30-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p30-shot-1" class="p30-shot" data-src="img09b" data-seq="0" data-seq-count="1">
        <div id="p30-shot-1-inner" class="p30-shot-inner">
          <img id="p30-shot-1-img" class="p30-shot-img" src="assets/footage/img09b.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p30-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p30-shot-1-img");
      var ctx = document.getElementById("p30-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 79;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 18, 0, 1));
        var g = FX.ease.inOutSine(FX.clamp(f / N, 0, 1));
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 14)) / 14, 0, 1));
        var S = 1.30 - 0.08 * g + 0.30 * ex;
        var cx = 900 + 120 * g + 60 * ex + hand(f, 3, 301);
        var cy = 640 - 80 * a + 120 * ex + hand(f, 2, 303);
        var rot = (Math.PI / 180) * (-0.8 * (1 - a) + 0.4 * g);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p30", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p30"] = clock.tl;
    })();
  </script>
</template>
