<!-- P32 (images 1954–2009, 55 images) — landscape-director. img23, plan bas, Malik traverse le cadre, flou.
     Entrée sur le panoramique gauche de P31 (cx 1150 → 1030 en outCubic sur 12 images), puis la caméra suit Malik vers la gauche (cx -200, linéaire).
     Sortie (drop 2, image 2009) : filé gauche qui accélère sur les 8 dernières images (cx -200, S +0,30, roulis -2°, obturateur ×4), au plus rapide à la coupe ; pas d'image noire. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p32-frame { position: absolute; inset: 0; overflow: hidden; }
    .p32-shot, .p32-shot-inner { position: absolute; inset: 0; }
    .p32-shot { opacity: 0; }
    .p32-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p32-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p32" data-width="1920" data-height="1080" data-duration="0.9166666666666666">
    <div id="p32-frame" class="p32-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p32-shot-1" class="p32-shot" data-src="img23" data-seq="0" data-seq-count="1">
        <div id="p32-shot-1-inner" class="p32-shot-inner">
          <img id="p32-shot-1-img" class="p32-shot-img" src="assets/footage/img23.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p32-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p32-shot-1-img");
      var ctx = document.getElementById("p32-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 55;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 8)) / 8, 0, 1));
        var S = 1.30 + 0.05 * k + 0.30 * ex;
        var cx = 1150 - 120 * a - 200 * k - 200 * ex + hand(f, 3, 321);
        var cy = 455 + 15 * ex + hand(f, 3, 323);
        var rot = (Math.PI / 180) * (-0.4 * (1 - a) - 2.0 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p32", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, (0.6 + 1.8 * FX.ease.inCubic(FX.clamp((f - (N - 8)) / 8, 0, 1))));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p32"] = clock.tl;
    })();
  </script>
</template>
