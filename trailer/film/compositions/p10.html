t;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:{&quot;src&quot;:&quot;assets/luts/lkdv-trailer.cube&quot;,&quot;intensity&quot;:1},&quot;colorSpace&quot;:&quot;rec709&quot;}" id="p10-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>

  <script>
    (function () {
      var FX = window.LKDVFX;
      var N = 54, W = 1920, H = 1080, HZ = 588, FEATHER = 46;
      var img = document.getElementById("p10-shot-1-img");
      var ctx = document.getElementById("p10-canvas").getContext("2d");
      var buf = FX.canvas(W, H), bx = buf.getContext("2d");
      var wat = FX.canvas(W, H), wx = wat.getContext("2d");
      function place(c, s, cx, cy, roll, ay) {
        // Échelle s autour du point visé (cx, cy), roulis autour du centre de l'écran ; ay = ancrage vertical
        // (l'eau est mise à l'échelle depuis l'horizon pour rester collée aux falaises).
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.translate(W / 2, H / 2);
        c.rotate(roll);
        c.translate(-W / 2, -H / 2);
        c.transform(s, 0, 0, s, W / 2 - s * cx, ay - s * cy);

      var clock = FX.bindClock("p10", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, W, H);
        if (!img.complete || !img.naturalWidth) return;
        var u = f / (N - 1);
        var run = 0.55 * u + 0.45 * u * u; // vitesse qui monte jusqu'à la coupe
        var sm = 1.08 + 0.28 * run;
        var sw = sm * (1 + 0.14 * run);
        var cx = 960 + 40 * run, cy = 540 - 25 * run;
        cx = FX.clamp(cx, W / 2 / sm + 12, W - W / 2 / sm - 12);
        cy = FX.clamp(cy, H / 2 / sm + 12, H - H / 2 / sm - 12);
        if (f === 0) { cx = 960; cy = 540; }
        var roll = (Math.PI / 180) * 0.7 * Math.sin(Math.PI * u) * (FX.noise2(u * 2, 4.2, 101) - 0.2);
        // Plan lointain : falaises et rive.
        place(bx, sm, cx, cy, roll, H / 2);
        bx.drawImage(img, 0, 0, W, H);
        // Plan proche : l'eau, ancrée sur l'horizon.
        var hy = H / 2 + sm * (HZ - cy);
        wx.setTransform(1, 0, 0, 1, 0, 0);
        wx.clearRect(0, 0, W, H);
        place(wx, sw, cx, HZ, roll, hy);
        wx.drawImage(img, 0, 0, W, H);
        wx.setTransform(1, 0, 0, 1, 0, 0);
        var g = wx.createLinearGradient(0, hy - 6, 0, hy + FEATHER);
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, "rgba(0,0,0,1)");
        wx.globalCompositeOperation = "destination-in";
        wx.fillStyle = g;
        wx.fillRect(0, 0, W, H);
        wx.globalCompositeOperation = "source-over";
        bx.setTransform(1, 0, 0, 1, 0, 0);
        bx.drawImage(wat, 0, 0);
        // Flou de vitesse : reprend celui de la fin de P09, retombe, puis remonte avec la course.
        var amount = 0.05 * Math.exp(-f / 4) + 0.035 * run;
        FX.zoomBlur(ctx, buf, 960 + sm * (1000 - cx), hy, amount, 8, W, H);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p10"] = clock.tl;
    })();
  </script>
