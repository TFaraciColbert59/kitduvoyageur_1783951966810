<!-- P28 (images 1717–1769, 52 images) — landscape-director. img20, contre-plongée, la main tendue.
     Entrée sur le piqué de P27 (S 1,25 → 1,33 en outCubic, cy qui descend encore de 60 px), poussée courte vers les mains (≈ 864, 557), S → 1,55.
     Sortie : panoramique vers la droite sur l'épaule de Léa (cx +330, inCubic sur 12 images), au plus rapide à la coupe 1769. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p28-frame { position: absolute; inset: 0; overflow: hidden; }
    .p28-shot, .p28-shot-inner { position: absolute; inset: 0; }
    .p28-shot { opacity: 0; }
    .p28-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p28-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p28" data-width="1920" data-height="1080" data-duration="0.8666666666666667">
    <div id="p28-frame" class="p28-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p28-shot-1" class="p28-shot" data-src="img20" data-seq="0" data-seq-count="1">
        <div id="p28-shot-1-inner" class="p28-shot-inner">
          <img id="p28-shot-1-img" class="p28-shot-img" src="assets/footage/img20.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p28-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p28-shot-1-img");
      var ctx = document.getElementById("p28-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 52;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var p = FX.ease.inOutCubic(FX.clamp(f / 40, 0, 1));
        var ex = FX.ease.inCubic(FX.clamp((f - (N - 12)) / 12, 0, 1));
        var S = 1.25 + 0.08 * a + 0.22 * p;
        var cx = 820 + 44 * p + 330 * ex + hand(f, 4, 281);
        var cy = 480 + 60 * a + 20 * p + 40 * ex + hand(f, 3, 283);
        var rot = (Math.PI / 180) * (-1.0 * (1 - a) + 0.6 * p - 1.2 * ex);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p28", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p28"] = clock.tl;
    })();
  </script>
</template>
