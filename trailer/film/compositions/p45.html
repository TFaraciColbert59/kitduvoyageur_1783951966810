<!-- P45 (images 2770–2848, 78 images) — landscape-director. img34, Clara passe et salue le groupe au bivouac, la caméra reste.
     Entrée sur le filé droit de P44 : cx 830 → 1020 (outCubic, 12 images), roulis +0,8° → 0, S 1,20 → 1,10.
     Fin (vers l'outro, image 2848) : décélération et pose (outCubic sur tout le plan, tremblé qui s'éteint) ; pas d'image noire. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p45-frame { position: absolute; inset: 0; overflow: hidden; }
    .p45-shot, .p45-shot-inner { position: absolute; inset: 0; }
    .p45-shot { opacity: 0; }
    .p45-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p45-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p45" data-width="1920" data-height="1080" data-duration="1.3">
    <div id="p45-frame" class="p45-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p45-shot-1" class="p45-shot" data-src="img34" data-seq="0" data-seq-count="1">
        <div id="p45-shot-1-inner" class="p45-shot-inner">
          <img id="p45-shot-1-img" class="p45-shot-img" src="assets/footage/img34.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p45-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p45-shot-1-img");
      var ctx = document.getElementById("p45-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 78;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 12, 0, 1));
        var k = FX.clamp(f / N, 0, 1);
        var D = Math.PI / 180;
        // CORRECTIONS-1 : plus de gel en fin de plan. Le plan se pose en décélérant, mais une dérive lente
        // et linéaire continue jusqu'à la coupe (poussée + glissé droit + lente montée vers le ciel), et le
        // tremblé ne s'éteint qu'à 35 %.
        var calm = 0.35 + 0.65 * (1 - FX.ease.outCubic(k));
        var S = 1.10 + 0.10 * (1 - FX.ease.outCubic(FX.clamp(f / 30, 0, 1))) + 0.045 * k;
        var cx = 830 + 190 * a + 15 * FX.ease.outCubic(k) + 30 * k + hand(f, 3, 451) * calm;
        var cy = 505 - 24 * k + hand(f, 2, 453) * calm;
        var rot = D * (0.8 * (1 - a));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p45", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6 + 1.1 * Math.pow(1 - FX.clamp(f / 4, 0, 1), 2));
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p45"] = clock.tl;
    })();
  </script>
</template>
