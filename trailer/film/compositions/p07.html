<!-- P07 (images 403–482, 79 images) — landscape-director. Gros plan du téléphone (img07), poussée lente vers l'écran.
     Entrée : la poussée de P06 continue (vitesse forte qui se freine en 12 images, flou de zoom qui retombe), puis
     poussée lente et régulière, micro-tremblement de main. L'écran VERT reste intact : ui-builder y incruste E1.
     Caméra exposée pour l'incrustation : window.__lkdvCam.p07(f) → { S, cx, cy } (img07 → écran :
     x' = 960 + S·(x − cx), y' = 540 + S·(y − cy)). Coins mesurés de l'écran vert d'img07 (pixels où g > r+60 et g > b+60) :
     haut 800–1067 à y 200, bas 828–1107 à y 700 ; boîte 789–1107 × 178–795. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p07-frame { position: absolute; inset: 0; overflow: hidden; }
    .p07-shot, .p07-shot-inner { position: absolute; inset: 0; }
    .p07-shot { opacity: 0; }
    .p07-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p07-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p07" data-width="1920" data-height="1080" data-duration="1.3166666666666667">
    <div id="p07-frame" class="p07-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p07-shot-1" class="p07-shot" data-src="img07" data-seq="0" data-seq-count="1">
        <div id="p07-shot-1-inner" class="p07-shot-inner">
          <img id="p07-shot-1-img" class="p07-shot-img" src="assets/footage/img07.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p07-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var N = 79, W = 1920, H = 1080;
      var img = document.getElementById("p07-shot-1-img");
      var ctx = document.getElementById("p07-canvas").getContext("2d");
      var buf = FX.canvas(W, H), bx = buf.getContext("2d");
      function camAt(f) {
        var u = f / (N - 1);
        // Freinage de l'élan de P06 (exponentiel) + poussée lente constante.
        var brake = 1 - Math.exp(-f / 7);
        var S = 1.08 + 0.09 * brake + 0.16 * u;
        var cx = 945 + (FX.noise2(f * 0.07, 2.3, 71) - 0.5) * 6;
        var cy = 520 - 20 * u + (FX.noise2(f * 0.07, 9.1, 72) - 0.5) * 5;
        cx = FX.clamp(cx, W / 2 / S, W - W / 2 / S);
        cy = FX.clamp(cy, H / 2 / S, H - H / 2 / S);
        return { S: S, cx: cx, cy: cy };
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p07 = camAt;
      var clock = FX.bindClock("p07", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, W, H);
        if (!img.complete || !img.naturalWidth) return;
        var c = camAt(f);
        bx.setTransform(c.S, 0, 0, c.S, W / 2 - c.S * c.cx, H / 2 - c.S * c.cy);
        bx.drawImage(img, 0, 0, W, H);
        bx.setTransform(1, 0, 0, 1, 0, 0);
        // Flou de mouvement à l'entrée : la vitesse de la poussée de P06 retombe.
        FX.zoomBlur(ctx, buf, 960, 540, 0.045 * Math.exp(-f / 5), 8, W, H);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p07"] = clock.tl;
    })();
  </script>
</template>
