<!-- P20 (images 1191–1219, 28 images) — landscape-director. img13, très gros plan : le CLAC de la boucle.
     Impact à l'image 0 : coup de zoom (S 1,30 → 1,42 en 2 i, sur la boucle ≈ 960, 560) + secousse brève à graine qui retombe
     (outExpo, ~10 i) ; retombée S → 1,16 ; dernières 8 images : nouvelle poussée inCubic (S → 1,30) qui passe à P21.
     Caméra : window.__lkdvCam.p20(f) → { S, cx, cy, rot }. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p20-frame { position: absolute; inset: 0; overflow: hidden; }
    .p20-shot, .p20-shot-inner { position: absolute; inset: 0; }
    .p20-shot { opacity: 0; }
    .p20-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p20-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p20" data-width="1920" data-height="1080" data-duration="0.4666666666666667">
    <div id="p20-frame" class="p20-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p20-shot-1" class="p20-shot" data-src="img13" data-seq="0" data-seq-count="1">
        <div id="p20-shot-1-inner" class="p20-shot-inner">
          <img id="p20-shot-1-img" class="p20-shot-img" src="assets/footage/img13.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p20-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p20-shot-1-img");
      var ctx = document.getElementById("p20-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 28;
      function camAt(f) {
        var k = FX.ease.outExpo(FX.clamp(f / 2, 0, 1));
        var fall = FX.ease.outCubic(FX.clamp((f - 2) / 14, 0, 1));
        var push = FX.ease.inCubic(FX.clamp((f - (N - 9)) / 8, 0, 1));
        var S = 1.30 + 0.12 * k - 0.26 * fall + 0.14 * push;
        var sh = Math.pow(0.62, f) * (f < 1 ? 0 : 1);
        var cx = 960 + hand(f, 4, 201) + (FX.noise2(f * 1.7, 0.3, 203) - 0.5) * 36 * sh;
        var cy = 560 + hand(f, 3, 205) + (FX.noise2(f * 1.7, 2.9, 207) - 0.5) * 30 * sh;
        var rot = (Math.PI / 180) * ((FX.noise2(f * 1.3, 4.1, 209) - 0.5) * 2.2 * sh + 0.6 * push);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p20 = camAt;
      var clock = FX.bindClock("p20", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p20"] = clock.tl;
    })();
  </script>
</template>
