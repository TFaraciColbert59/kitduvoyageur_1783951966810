<!-- P06 (images 325–403, 78 images) — landscape-director. DROP. Entrée : fin de TR.glassPass reprise (p 0,62 → 1 sur
     16 images : gouttes qui grossissent, éclat chaud qui retombe, img06 posé à 1,08 comme la dernière image de P05).
     Puis travelling latéral vers la gauche (Léa glisse vers la droite du cadre) qui se courbe en poussée accélérée vers
     le téléphone (regard) : la coupe vers P07 tombe au plus rapide de la poussée. Pluie au premier plan sur la vitre
     (gauche) en parallaxe plus rapide que le fond. Tout est fonction de l'image locale. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p06-frame { position: absolute; inset: 0; overflow: hidden; }
    .p06-shot, .p06-shot-inner { position: absolute; inset: 0; }
    .p06-shot { opacity: 0; }
    .p06-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p06-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p06" data-width="1920" data-height="1080" data-duration="1.3">
    <div id="p06-frame" class="p06-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p06-shot-1" class="p06-shot" data-src="img06" data-seq="0" data-seq-count="1">
        <div id="p06-shot-1-inner" class="p06-shot-inner">
          <img id="p06-shot-1-img" class="p06-shot-img" src="assets/footage/img06.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p06-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script src="lib/fx/transitions.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX, TR = FX.Transitions;
      var N = 78, W = 1920, H = 1080, ENTRY = 16, PASS = 0.62;
      var img = document.getElementById("p06-shot-1-img");
      var ctx = document.getElementById("p06-canvas").getContext("2d");
      var cam = FX.canvas(W, H), cx2 = cam.getContext("2d");
      var buf = FX.canvas(W, H), bx = buf.getContext("2d");
      // Gouttes de pluie du premier plan (sur la vitre, moitié gauche), à graine fixe.
      var rnd = FX.mulberry32(625), streaks = [];
      for (var i = 0; i < 70; i++) streaks.push([rnd() * 1.25, rnd(), 0.4 + rnd() * 0.6, rnd()]);
      // Caméra : échelle totale S, point visé (cx, cy) en coordonnées d'img06.
      function camAt(f) {
        var u = f / (N - 1);
        var push = FX.ease.inCubic(FX.ramp(0.45, 1, u));
        var S = 1.08 + 0.10 * u + 0.62 * push;
        var cx = 960 - 70 * u - 30 * push;       // travelling latéral constant, puis vers le téléphone
        var cy = 540 - 40 * u - 150 * push;
        var sh = 1.5 * (1 - push);               // micro-tremblement d'épaule
        cx += (FX.noise2(f * 0.09, 3.1, 61) - 0.5) * 2 * sh;
        cy += (FX.noise2(f * 0.09, 7.7, 62) - 0.5) * 2 * sh;
        return { S: S, cx: cx, cy: cy, push: push, u: u };
      }
      function draw(c, im, s, cx, cy) {
        cx = FX.clamp(cx, W / 2 / s, W - W / 2 / s);
        cy = FX.clamp(cy, H / 2 / s, H - H / 2 / s);
        c.setTransform(s, 0, 0, s, W / 2 - s * cx, H / 2 - s * cy);
        c.drawImage(im, 0, 0, W, H);
        c.setTransform(1, 0, 0, 1, 0, 0);
      }
      var clock = FX.bindClock("p06", N, function (t, f) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0B1F17";
        ctx.fillRect(0, 0, W, H);
        if (!img.complete || !img.naturalWidth) return;
        var c = camAt(f);
        bx.setTransform(1, 0, 0, 1, 0, 0);
        if (f < ENTRY) {
          // Fin de la traversée de vitre : glassPass rééchelonne l'intérieur de « settle » autour du centre,
          // on compense pour que l'échelle totale reste S (continuité avec la dernière image de P05).
          var p = PASS + (1 - PASS) * (f + 1) / ENTRY;
          var q = FX.ramp(PASS, 1, p);
          var settle = 1 + 0.08 * (1 - FX.ease.outCubic(q));
          cx2.fillStyle = "#0B1F17";
          cx2.fillRect(0, 0, W, H);
          draw(cx2, img, Math.max(1, c.S / settle), c.cx, c.cy);
          bx.fillStyle = "#0B1F17";
          bx.fillRect(0, 0, W, H);
          TR.glassPass(bx, img, cam, p, { rect: [939, 505, 40, 62], pass: PASS, drops: 90, seed: 6 });
        } else {
          draw(bx, img, c.S, c.cx, c.cy);
        }
        // Pluie sur la vitre (moitié gauche), couche plus proche : glisse plus vite que le fond.
        bx.save();
        bx.globalCompositeOperation = "screen";
        bx.lineCap = "round";
        for (var k = 0; k < streaks.length; k++) {
          var d = streaks[k];
          var x = ((d[0] * W * 0.62 + f * (9 + 6 * c.u)) % (W * 0.7)) - 60;
          var y = ((d[1] + f * 0.012 * d[2]) % 1) * H * 0.9;
          var a = 0.10 + 0.12 * d[3];
          bx.strokeStyle = "rgba(220,228,240," + a.toFixed(3) + ")";
          bx.lineWidth = 1.5 + 2.5 * d[2];
          bx.beginPath();
          bx.moveTo(x, y);
          bx.lineTo(x - 3, y + 18 + 30 * d[2]);
          bx.stroke();
        }
        bx.restore();
        // Flou de mouvement : flou de zoom croissant avec la vitesse de la poussée finale.
        var amount = 0.05 * c.push;
        FX.zoomBlur(ctx, buf, 960, 540, amount, 8, W, H);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p06"] = clock.tl;
    })();
  </script>
</template>
