     p 0 → 0,5 : entrée rapide vers la droite, S 1,75 → 1,42, cx 620 → 790 (tente au centre ≈ 775, 490) ;
     ralenti net sur le geste (dérive résiduelle) ; p 0,5 → 1 : relance vers le sol (cy → 800, S → 1,85).
     Caméra : window.__lkdvCam.p23(f) → { S, cx, cy, rot }. -->
<template>
  <style>

  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p23-shot-1-img");
      var ctx = document.getElementById("p23-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 79;
      function camAt(f) {
        var t = f / (N - 1), x = 2 * t - 1;
        var p = 0.5 + 0.5 * (x < 0 ? -1 : 1) * Math.pow(Math.abs(x), 3) + 0.04 * x;
        var a = FX.clamp(p * 2, 0, 1), b = FX.clamp(p * 2 - 1, 0, 1);
        var sa = FX.ease.inOutSine(a), sb = FX.ease.inOutSine(b);
        var S = 1.75 + (1.42 - 1.75) * sa + (1.85 - 1.42) * sb;
        var cx = 620 + (790 - 620) * sa + (860 - 790) * sb + hand(f, 5, 231);
        var cy = 420 + (480 - 420) * sa + (800 - 480) * sb + hand(f, 4, 233);
        var rot = (Math.PI / 180) * (-1.2 * (1 - sa) + 1.5 * sb);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });

      window.__lkdvCam = window.__lkdvCam || {};
      window.__lkdvCam.p23 = camAt;
      var clock = FX.bindClock("p23", N, function (t, f) {

      });

      window.__timelines["p23"] = clock.tl;
    })();
