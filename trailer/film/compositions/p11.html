<!-- P11 (images 614–692, 78 images) — landscape-director. Coupe sèche depuis le lac : caméra à l'épaule, Léa se lève
     d'un bond. Entrée sur un à-coup (S 1,24 → 1,14 en ~6 images, secousse qui retombe), puis la caméra suit l'élan vers la
     droite et vers le haut (cx 930 → 1010, cy 585 → 505), roulis d'épaule ≤ 0,8°. Sortie : poussée inCubic sur le téléphone
     dans sa main (img10 ≈ 770, 580 ; S → 1,95), la caméra file vers la gauche (l'image glisse à droite) au plus rapide
     à la coupe, flou de mouvement réel (moyenne de la caméra sur l'obturation) — même sens que l'entrée de P12. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p11-frame { position: absolute; inset: 0; overflow: hidden; }
    .p11-shot, .p11-shot-inner { position: absolute; inset: 0; }
    .p11-shot { opacity: 0; }
    .p11-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p11-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p11" data-width="1920" data-height="1080" data-duration="1.3">
    <div id="p11-frame" class="p11-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p11-shot-1" class="p11-shot" data-src="img10" data-seq="0" data-seq-count="1">
        <div id="p11-shot-1-inner" class="p11-shot-inner">
          <img id="p11-shot-1-img" class="p11-shot-img" src="assets/footage/img10.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p11-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p11-shot-1-img");
      var ctx = document.getElementById("p11-canvas").getContext("2d");
      function hand(f, amp, seed) {
        // Tremblement de main : bruit lent + frisson rapide, à graine (fonction du temps).
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        // L'image ne découvre jamais ses bords : centre bridé selon l'échelle et le roulis.
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        // Flou de mouvement réel : moyenne de la caméra sur l'obturation (180° par défaut), échantillons selon la vitesse.
        shutter = shutter == null ? 0.5 : shutter;
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 78;
      function camAt(f) {
        var u = FX.clamp(f / (N - 1), -0.2, 1);
        var kick = Math.exp(-Math.max(f, 0) / 3.2);
        var rise = FX.ease.outCubic(FX.clamp(f / 46, 0, 1));
        var push = FX.ease.inCubic(FX.clamp((f - 46) / (N - 1 - 46), 0, 1));
        var S = 1.14 + 0.10 * kick + 0.05 * rise;
        var cx = 930 + 80 * rise, cy = 585 - 80 * rise;
        S = S + (1.95 - S) * push;
        cx = cx + (800 - cx) * push;
        cy = cy + (575 - cy) * push;
        var shake = 1 - 0.6 * push;
        cx += hand(f, 12, 111) * shake + (FX.noise2(f * 0.9, 2.2, 117) - 0.5) * 10 * kick;
        cy += hand(f, 9, 113) * shake + (FX.noise2(f * 0.9, 8.4, 119) - 0.5) * 10 * kick;
        var rot = (Math.PI / 180) * (0.8 * (FX.noise2(f * 0.06, 3.3, 121) - 0.5) * 2 * shake - 0.6 * push);
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p11", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.6);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p11"] = clock.tl;
    })();
  </script>
</template>
