<!-- P27 (images 1612–1717, 105 images) — landscape-director. img19 ★ Tre Cime : FPV qui franchit l'arête.
     Entrée sur le glissé droit de P26 (cx 760 → 920 en outCubic sur 16 images), puis poussée avant à rampe de vitesse (S 1,30 → 1,65, inOutCubic sur 80 images)
     en montant par-dessus l'arête (cy 665 → 520) avec un roulis FPV (±2°). Le groupe (≈ 845, 672) reste dans le cadre, minuscule.
     Sortie : piqué vers le groupe (S → 2,0, cy → 670, inCubic sur 14 images), au plus rapide à la coupe 1717. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0B1F17; }
    .p27-frame { position: absolute; inset: 0; overflow: hidden; }
    .p27-shot, .p27-shot-inner { position: absolute; inset: 0; }
    .p27-shot { opacity: 0; }
    .p27-shot-img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #p27-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
  <div id="root" data-composition-id="p27" data-width="1920" data-height="1080" data-duration="1.75">
    <div id="p27-frame" class="p27-frame" data-layout-allow-overflow>
      <!-- hf-footage:begin (zone réécrite par tools/timeline/sync-footage.mjs) -->
      <div id="p27-shot-1" class="p27-shot" data-src="img19" data-seq="0" data-seq-count="1">
        <div id="p27-shot-1-inner" class="p27-shot-inner">
          <img id="p27-shot-1-img" class="p27-shot-img" src="assets/footage/img19.png" alt="" />
        </div>
      </div>
    <!-- hf-footage:end -->
    </div>
    <canvas id="p27-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>
  </div>
  <script src="lib/fx/core.js"></script>
  <script>
    (function () {
      var FX = window.LKDVFX;
      var W = 1920, H = 1080, INK = "#0B1F17";
      var img = document.getElementById("p27-shot-1-img");
      var ctx = document.getElementById("p27-canvas").getContext("2d");
      function hand(f, amp, seed) {
        return (FX.noise2(f * 0.09, 1.7, seed) - 0.5) * amp + (FX.noise2(f * 0.45, 5.3, seed + 7) - 0.5) * amp * 0.3;
      }
      function fit(c) {
        var a = Math.abs(c.rot || 0), co = Math.cos(a), si = Math.sin(a);
        var hx = (W / 2 * co + H / 2 * si) / c.S + 2, hy = (W / 2 * si + H / 2 * co) / c.S + 2;
        c.cx = FX.clamp(c.cx, hx, W - hx);
        c.cy = FX.clamp(c.cy, hy, H - hy);
        return c;
      }
      function drawCam(c2, c, alpha) {
        c2.globalAlpha = alpha;
        c2.setTransform(1, 0, 0, 1, 0, 0);
        c2.translate(W / 2, H / 2);
        if (c.rot) c2.rotate(c.rot);
        c2.scale(c.S, c.S);
        c2.translate(-c.cx, -c.cy);
        c2.drawImage(img, 0, 0, W, H);
      }
      function shoot(camAt, f, shutter) {
        var a = camAt(f), b = camAt(f - shutter);
        var d = Math.abs(a.S - b.S) * 1100 + (Math.abs(a.cx - b.cx) + Math.abs(a.cy - b.cy)) * a.S + Math.abs((a.rot || 0) - (b.rot || 0)) * 1100;
        var n = FX.clamp(Math.ceil(d / 1.2), 1, 12);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < n; i++) drawCam(ctx, n === 1 ? a : camAt(f - (shutter * i) / (n - 1)), 1 / (i + 1));
        ctx.globalAlpha = 1;
      }

      var N = 105;
      function camAt(f) {
        var a = FX.ease.outCubic(FX.clamp(f / 16, 0, 1));
        var r = FX.ease.inOutCubic(FX.clamp(f / 80, 0, 1));
        var dv = FX.ease.inCubic(FX.clamp((f - (N - 14)) / 14, 0, 1));
        var S = 1.30 + 0.35 * r + 0.35 * dv;
        var cx = 760 + 160 * a - 50 * r - 25 * dv + hand(f, 4, 271);
        var cy = 665 - 145 * r + 150 * dv + hand(f, 3, 273);
        var rot = (Math.PI / 180) * (2.0 * Math.sin(Math.PI * r) - 1.2 * dv + 0.4 * (FX.noise2(f * 0.12, 2.1, 277) - 0.5));
        return fit({ S: S, cx: cx, cy: cy, rot: rot });
      }
      var clock = FX.bindClock("p27", N, function (t, f) {
        if (!img.complete || !img.naturalWidth) { ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); return; }
        shoot(camAt, f, 0.7);
      });
      img.addEventListener("load", function () { clock.redraw(); });
      window.__timelines["p27"] = clock.tl;
    })();
  </script>
</template>
