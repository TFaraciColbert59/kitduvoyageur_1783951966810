      <div class="ui-a1-at clip" id="ui-a1-p4-c" data-start="1.875" data-duration="0.625" data-track-index="6">
        <span class="lk-pill lk-glass" id="ui-a1-p4"><span class="lk-ic" data-ic="users"></span><b class="lk-num">4</b></span>
      </div>

      <!-- barre de saisie IA (4,000 → 6,000) -->
      <div class="ui-a1-at clip" id="ui-a1-bar-c" data-start="0.5" data-duration="2.0" data-track-index="7">
        <div class="lk-ask lk-glass" id="ui-a1-ask"><span class="lk-avatar">L</span><div class="lk-ask__txt"><span class="ui-a1-w" id="ui-a1-w1"></span><span class="ui-a1-w" id="ui-a1-w2"></span><span class="ui-a1-w" id="ui-a1-w3"></span><span class="ui-a1-w" id="ui-a1-w4"></span><i class="lk-caret" id="ui-a1-caret"></i></div><button class="lk-send" id="ui-a1-send"><span class="lk-ic lk-ic--m" id="ui-a1-send-ic" data-ic="arrow-right"></span><span class="lk-spinner lk-spinner--lg lk-spinner--inverted" id="ui-a1-spin"></span></button></div>
      </div>

      <!-- point de fusion : rayon 7 px réels, centre exact du cadre (5,900 → 6,125) -->
      <div class="ui-a1-at clip" id="ui-a1-dot-c" data-start="2.4" data-duration="0.225" data-track-index="8"><i id="ui-a1-dot"></i></div>
    </div></div>
  </div>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="ui-a1"]');
      const m = LKDV.ui.mountColumn(root), s = m.s, f = LKDV.format(root);
      const CX = (f.W / 2 - f.column.x) / s, CY = (f.H / 2 - f.column.y) / s; /* centre exact du cadre, en unités logiques */
      function at(id, left, top, w, h) { const e = document.getElementById(id).style; e.left = left + "px"; e.top = top + "px"; if (w) e.width = w + "px"; if (h) e.height = h + "px"; }

      /* ---- mise en page (unités logiques, 390 × 693) ---- */
      const BAR_TOP = 412, BAR_C = BAR_TOP + 30, ROW_Y = CY - 104;
      const ISL_W = 150, ISL_H = ISL_W * 0.679;
      const isl = { x: CX - ISL_W / 2, y: CY - ISL_H / 2 };
      at("ui-a1-island-c", isl.x, isl.y, ISL_W, ISL_H);
      const pin = { x: isl.x + 0.22 * ISL_W, y: isl.y + 0.62 * ISL_H - 30 }; /* le picto est posé sur la côte sud-ouest */
      at("ui-a1-p1-c", pin.x - 24, pin.y - 24);
      const row = [{ id: "p2", w: 48 }, { id: "p3", w: 88 }, { id: "p4", w: 88 }], gap = 8;
      let x0 = CX - (48 + 88 + 88 + 2 * gap) / 2;
      const ctr = {};
      row.forEach(function (r) { at("ui-a1-" + r.id + "-c", x0, ROW_Y - 24); document.getElementById("ui-a1-" + r.id).style.width = r.w + "px"; ctr[r.id] = { x: x0 + r.w / 2, y: ROW_Y }; x0 += r.w + gap; });
      ctr.p1 = pin;
      document.getElementById("ui-a1-bar-c").style.cssText += "left:12px;right:12px;top:" + BAR_TOP + "px;";
      const R = 7 / s; /* 7 px réels */
      at("ui-a1-dot-c", CX - R, CY - R, 2 * R, 2 * R);
      const dot = document.getElementById("ui-a1-dot"); dot.style.width = 2 * R + "px"; dot.style.height = 2 * R + "px";

      /* ---- timeline (temps local = temps du film − 3,5) ---- */
      const U = LKDV.ui, tl = gsap.timeline({ paused: true });
      const T = function (film) { return film - 3.5; };

      /* 4,00 : la barre se pose (ressort 250 ms) ; 4,25 → 4,95 : frappe à 40 car./s */
      U.springIn(tl, "#ui-a1-ask", T(4.0), { dur: 0.25, zeta: 0.8, from: 0.86, origin: "50% 50%" });
      const words = ["Islande", " · van", " · 10 jours", " · 4"];
      let te = T(4.25);
      words.forEach(function (w, i) { te = U.typeText(tl, "#ui-a1-w" + (i + 1), w, te, 40); });
      /* le curseur Forest reste fixe pendant la frappe, s'éteint à 5,00 */
      tl.fromTo("#ui-a1-caret", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: true }, T(5.0));

      /* 5,000 / 5,125 / 5,250 / 5,375 : chaque mot devient un picto (le mot se resserre, la pastille part de la barre) */
      const pairs = [["#ui-a1-w1", "p1", 5.0], ["#ui-a1-w2", "p2", 5.125], ["#ui-a1-w3", "p3", 5.25], ["#ui-a1-w4", "p4", 5.375]];
      pairs.forEach(function (p) {
        tl.fromTo(p[0], { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.1, ease: "power2.in", immediateRender: false }, T(p[2]));
        const c = ctr[p[1]];
        U.springIn(tl, "#ui-a1-" + p[1], T(p[2]), { dur: 0.25, zeta: 0.8, from: 0.5, y: BAR_C - c.y });
      });
      /* l'île : silhouette qui se pose avec le pin (5,000) */
      U.springIn(tl, "#ui-a1-island", T(5.0), { dur: 0.25, zeta: 0.8, from: 0.8, origin: "50% 50%" });

      /* 5,50 : le bouton d'envoi s'enfonce ; le Spinner officiel tourne 5,5 → 6,0 */
      U.press(tl, "#ui-a1-send", T(5.5));
      tl.fromTo("#ui-a1-send-ic", { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, T(5.5) + 0.04);
      tl.fromTo("#ui-a1-spin", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: true }, T(5.5) + 0.04);
      U.spin(tl, "#ui-a1-spin", T(5.5), 0.5, 1.5);

      /* 5,75 → 6,00 : les pastilles convergent vers le centre du cadre ; la barre quitte le cadre (5,80 → 6,00) */
      ["p1", "p2", "p3", "p4"].forEach(function (id) {
        const c = ctr[id];
        tl.fromTo("#ui-a1-" + id, { x: 0, y: 0, scale: 1 }, { x: CX - c.x, y: CY - c.y, scale: 0.18, duration: 0.25, ease: "power3.in", immediateRender: false }, T(5.75));
        tl.fromTo("#ui-a1-" + id, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, T(5.94));
      });
      tl.fromTo("#ui-a1-island", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, T(5.8));
      tl.fromTo("#ui-a1-ask", { y: 0, opacity: 1 }, { y: 150, opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, T(5.8));

      /* 5,90 → 6,00 : UN point sage (rayon 7 px réels) au centre ; 6,00 → 6,125 : il s'éteint (le calque WebGL part de ce point) */
      tl.fromTo("#ui-a1-dot", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: true }, T(5.9));
      tl.fromTo("#ui-a1-dot", { opacity: 1 }, { opacity: 0, duration: 0.125, ease: "power1.in", immediateRender: false }, T(6.0));

      tl.to({}, { duration: 2.75 }, 0);
      window.__timelines["ui-a1"] = tl;
    })();
  </script>
</template>
