    /* point de fusion : sage, la seule lumière */

  <div id="root" data-composition-id="ui-a1" data-width="1920" data-height="1080">

      <div class="ui-a1-at clip" id="ui-a1-p1-c" data-start="1.5" data-duration="1.0" data-track-index="2">
        <span class="lk-pill lk-glass" id="ui-a1-p1"><span class="ui-a1-isl"><svg viewBox="0 0 1000 679" aria-hidden="true"><path id="ui-a1-isl-path" d="M904 38L848 97L899 122L878 178L925 168L904 228L932 193L990 225L954 275L994 280L952 292L989 292L989 313L998 298L992 334L934 328L980 348L950 350L969 379L930 400L908 378L930 410L910 409L905 463L870 493L821 464L828 491L731 570L686 595L686 567L683 593L618 613L618 597L596 652L564 646L576 665L545 674L394 647L363 616L383 607L373 584L359 611L349 579L337 597L304 558L287 582L167 590L166 531L183 554L226 539L226 516L257 509L236 500L252 476L282 469L221 482L243 466L232 442L274 410L215 451L193 373L89 374L64 394L43 359L116 351L124 331L130 353L165 319L177 340L246 328L251 291L227 311L180 299L258 238L223 231L207 242L195 230L220 207L187 227L181 200L171 222L161 200L164 228L153 203L58 249L0 227L22 198L66 220L40 163L89 204L114 190L91 180L122 168L73 169L61 148L120 155L66 118L106 123L79 96L104 100L85 90L98 77L156 140L168 109L171 157L181 126L191 154L196 100L142 71L197 62L166 58L175 41L127 51L144 21L191 21L260 116L271 100L291 119L266 130L293 135L291 177L250 170L277 215L292 206L278 240L301 241L312 300L328 206L350 186L367 230L387 193L374 101L403 93L460 179L461 108L518 78L587 197L567 82L600 88L633 140L670 74L689 97L735 90L724 12L772 6L830 89L871 38Z"/></svg><span class="lk-ic" id="ui-a1-pin" data-ic="map-pin"></span></span></span>
      </div>
      <div class="ui-a1-at clip" id="ui-a1-p2-c" data-start="1.625" data-duration="0.875" data-track-index="3">
        <span class="lk-pill lk-glass" id="ui-a1-p2"><span class="lk-ic" data-ic="van"></span></span>
      </div>
      <div class="ui-a1-at clip" id="ui-a1-p3-c" data-start="1.75" data-duration="0.75" data-track-index="4">
        <span class="lk-pill lk-glass" id="ui-a1-p3"><span class="lk-ic" data-ic="calendar"></span><b class="lk-num">10</b></span>
      </div>
      <div class="ui-a1-at clip" id="ui-a1-p4-c" data-start="1.875" data-duration="0.625" data-track-index="5">
        <span class="lk-pill lk-glass" id="ui-a1-p4"><span class="lk-avatars"><span class="lk-avatar lk-avatar--s">L</span><span class="lk-avatar lk-avatar--s">S</span><span class="lk-avatar lk-avatar--s">I</span><span class="lk-avatar lk-avatar--s lk-avatar--empty"></span></span></span>

      <!-- barre de saisie IA (4,00 → 6,00) -->
      <div class="ui-a1-at clip" id="ui-a1-bar-c" data-start="0.5" data-duration="2.0" data-track-index="6">
        <div class="lk-ask lk-glass" id="ui-a1-ask"><span class="lk-avatar">L</span><div class="lk-ask__txt"><span class="ui-a1-w" id="ui-a1-w1"></span><span class="ui-a1-w" id="ui-a1-w2"></span><span class="ui-a1-w" id="ui-a1-w3"></span><span class="ui-a1-w" id="ui-a1-w4"></span><i class="lk-caret" id="ui-a1-caret"></i></div><button class="lk-send" id="ui-a1-send"><span class="lk-ic lk-ic--m" id="ui-a1-send-ic" data-ic="arrow-right"></span><span class="lk-spinner" id="ui-a1-spin"></span></button></div>

      <!-- point de fusion : rayon 7 px réels, centre exact du cadre (5,875 → 6,125) -->
      <div class="ui-a1-at clip" id="ui-a1-dot-c" data-start="2.375" data-duration="0.25" data-track-index="7"><i id="ui-a1-dot"></i></div>

  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="ui-a1"]');
      const m = LKDV.ui.mountColumn(root), s = m.s, f = LKDV.format(root);
      const PH = LKDV.ui.PHONE;
      /* centre exact du cadre, en unités logiques de la colonne (195 ; 346,4 en 16:9 et 346,7 en 9:16) */
      const CX = (f.W / 2 - f.column.x) / s, CY = (f.H / 2 - f.column.y) / s;
      const bandBottom = (f.band.bottom - f.column.y) / s;
      function place(id, left, top, w, h) { const e = document.getElementById(id).style; e.left = left + "px"; e.top = top + "px"; if (w) e.width = w + "px"; if (h) e.height = h + "px"; }

      /* ---- mise en page (unités logiques 390 × 693) : barre dans la moitié basse, pictos juste au-dessus ---- */
      const BAR_X = 8, BAR_W = PH.w - 16, BAR_H = 60;
      const BAR_TOP = Math.min(CY + 84, bandBottom - BAR_H - 4); /* 16:9 : 430 ; 9:16 : 416 (bande utile ≤ 480) */
      const BAR_C = BAR_TOP + BAR_H / 2, ROW_C = BAR_TOP - 40;
      place("ui-a1-bar-c", BAR_X, BAR_TOP, BAR_W, BAR_H);
      const pills = [{ id: "p1", w: 88 }, { id: "p2", w: 48 }, { id: "p3", w: 80 }, { id: "p4", w: 132 }], GAP = 6;
      let x = CX - (pills.reduce(function (a, p) { return a + p.w; }, 0) + GAP * 3) / 2;
      pills.forEach(function (p) { place("ui-a1-" + p.id + "-c", x, ROW_C - 24); p.cx = x + p.w / 2; x += p.w + GAP; });
      const R = 7 / s; /* 7 px réels */
      place("ui-a1-dot-c", CX - R, CY - R, 2 * R, 2 * R);

      const words = ["Islande", " · van", " · 10 jours", " · 4"];

      function build() {
        /* centres des mots dans la barre (mesure canvas, sans mise en page) : le picto naît de la boîte de son mot */
        const ctx = document.createElement("canvas").getContext("2d");
        ctx.font = '500 20px "LKDV Inter"';
        try { ctx.letterSpacing = "-0.3px"; } catch (e) {}
        let wx = BAR_X + 8 + 44 + 10; /* padding gauche + avatar + gap (lk-ask) */
        const wc = words.map(function (w) { const ww = ctx.measureText(w).width; const c = wx + ww / 2; wx += ww; return c; });

        const U = LKDV.ui, tl = gsap.timeline({ paused: true });
        const T = function (film) { return film - 3.5; };

        /* 4,00 : la barre se pose (ressort 250 ms, monte de 18 unités) */
        U.springIn(tl, "#ui-a1-ask", T(4.0), { dur: 0.25, zeta: 0.8, from: 0.86, y: 18, origin: "50% 50%" });
        /* 4,25 → 4,95 : frappe à 40 car./s, mot par mot */
        let te = T(4.25);
        words.forEach(function (w, i) { te = U.typeText(tl, "#ui-a1-w" + (i + 1), w, te, 40); });
        /* curseur Forest : clignote avant la frappe (4,00–4,25), fixe pendant, s'éteint à 5,00 */
        tl.fromTo("#ui-a1-caret", { opacity: 1 }, { opacity: 0, duration: 0.0625, ease: "steps(1)", immediateRender: true }, T(4.0625));
        tl.fromTo("#ui-a1-caret", { opacity: 0 }, { opacity: 1, duration: 0.0625, ease: "steps(1)", immediateRender: false }, T(4.1875));
        tl.fromTo("#ui-a1-caret", { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none", immediateRender: false }, T(5.0));

        /* 5,000 / 5,125 / 5,250 / 5,375 : le mot se resserre en une pastille ; le picto jaillit de sa place vers sa case (raccord de forme) */
        pills.forEach(function (p, i) {
          const at = T(5.0 + 0.125 * i), w = "#ui-a1-w" + (i + 1);
          /* le mot monte vers sa case en se resserrant, net (aucun flou) ; il s'efface quand la pastille l'a recouvert */
          tl.fromTo(w, { x: 0, y: 0, scale: 1 }, { x: (p.cx - wc[i]) * 0.4, y: (ROW_C - BAR_C) * 0.55, scale: 0.45, duration: 0.09, ease: "power2.in", immediateRender: false }, at);
          tl.fromTo(w, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, at + 0.04);
          U.springIn(tl, "#ui-a1-" + p.id, at, { dur: 0.25, zeta: 0.72, from: 0.4, x: wc[i] - p.cx, y: BAR_C - ROW_C });
        });

        /* 5,4375 → 5,50 : les mots sont partis ; la pilule se resserre sur son bouton d'envoi (pas de bande de verre vide) */
        const pillClip = function (l) { return "inset(0px 0px 0px " + l + "px round 30px)"; };
        tl.fromTo("#ui-a1-ask", { clipPath: pillClip(0) }, { clipPath: pillClip(BAR_W - BAR_H), duration: 0.0625, ease: "power2.inOut", immediateRender: false }, T(5.4375));
        /* 5,50 : le bouton d'envoi s'enfonce ; la flèche cède au Spinner officiel, qui tourne 5,5 → 6,0 */
        U.press(tl, "#ui-a1-send", T(5.5));
        tl.fromTo("#ui-a1-send-ic", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, T(5.5) + 0.03);
        tl.fromTo("#ui-a1-spin", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: true }, T(5.5) + 0.03);
        U.spin(tl, "#ui-a1-spin", T(5.5), 0.5, 1.25);

        /* 5,75 → 6,00 : la barre tombe hors du cadre pendant que les 4 pictos convergent vers le centre exact (deux mouvements) */
        const fall = (f.H / s) - BAR_TOP + 24; /* jusque sous le bas du cadre */
        tl.fromTo("#ui-a1-ask", { y: 0 }, { y: fall, duration: 0.25, ease: "power3.in", immediateRender: false }, T(5.75));
        pills.forEach(function (p, i) {
          tl.fromTo("#ui-a1-" + p.id, { x: 0, y: 0, scale: 1 }, { x: CX - p.cx, y: CY - ROW_C, scale: 0.16, duration: 0.25, ease: "power2.in", immediateRender: false }, T(5.75));
          tl.fromTo("#ui-a1-" + p.id, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, T(5.95));
        });

        /* 5,89 → 6,00 : UN point sage naît au cœur de la fusion ; 6,00 → 6,12 : il se resserre et s'éteint */
        tl.fromTo("#ui-a1-dot", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.11, ease: "power2.out", immediateRender: true }, T(5.89));
        tl.fromTo("#ui-a1-dot", { scale: 1, opacity: 1 }, { scale: 0.5, opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, T(6.0));

        /* durée de l'hôte (2,75 s) */
        tl.fromTo({ v: 0 }, { v: 0 }, { v: 1, duration: 2.75, ease: "none", immediateRender: false }, 0);
        window.__timelines["ui-a1"] = tl;
      }
      /* mesure après chargement de la police ; la timeline est enregistrée à la fin de build */
      (document.fonts && document.fonts.load ? document.fonts.load('500 20px "LKDV Inter"') : Promise.resolve()).then(build, build);
    })();
  </script>
