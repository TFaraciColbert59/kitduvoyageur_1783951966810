    (function () {
      const root = document.querySelector('[data-composition-id="ui-a2"]');

      /* centre exact du cadre en unités logiques (le point de ui-a1 et le point WebGL y sont à 6,00) */
      const CX = (f.W / 2 - f.column.x) / s, CY = (f.H / 2 - f.column.y) / s;
      function place(id, left, top, w, h) { const e = document.getElementById(id).style; e.left = left + "px"; e.top = top + "px"; if (w != null) e.width = w + "px"; if (h != null) e.height = h + "px"; }
      const T = function (film) { return film - 6.0; };

      /* ---- mise en page (unités logiques 390 × 693) ---- */
      const RS = 200, RET_L = CX - RS / 2, RET_T = CY - RS / 2;
      place("ui-a2-ret-c", RET_L, RET_T, RS, RS);
      place("ui-a2-tape-c", RET_L - 34, RET_T, 18, RS);
      const ALT_W = 92, ALT_H = 40, ALT_T = RET_T - 12 - ALT_H;

      /* détails : sous le réticule en 16:9 ; au-dessus de l'altimètre en 9:16 (bande utile 61–480) */

      [["d1", 196], ["d2", 272], ["d3", 262], ["d4", 262]].forEach(function (d) { place("ui-a2-" + d[0] + "-c", CX - d[1] / 2, DET_T, d[1], DET_H); });
      /* pile : capsule de 4 cases (52 + 6) à droite de la colonne, centrée sur le centre du cadre */
      const PILE_W = 64, PILE_H = 12 + 4 * 52 + 3 * 6, PILE_L = 390 - 8 - PILE_W, PILE_T = CY - PILE_H / 2;
      place("ui-a2-pile-c", PILE_L, PILE_T, PILE_W, PILE_H);
      for (let i = 0; i < 4; i++) document.getElementById("ui-a2-t" + (i + 1)).style.top = 6 + i * 58 + "px";
      const FD = 12; /* point de repli : 12 unités */
      place("ui-a2-fold-c", PILE_L + PILE_W / 2 - FD / 2, CY - FD / 2, FD, FD);
      const CK = 96;
      place("ui-a2-check-c", CX - CK / 2, CY - CK / 2, CK, CK);
      place("ui-a2-dust-c", 0, 0, 390, 693);

      const tl = gsap.timeline({ paused: true });

      /* ---- 6,00 : les 4 coins arrivent de plus large et se verrouillent en 0,25 s ---- */
      const lock = U.springEase(0.9, 0.25), W = 34;
      [["tl", -1, -1], ["tr", 1, -1], ["bl", -1, 1], ["br", 1, 1]].forEach(function (c) {

        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: true }, T(6.0));

      /* le réticule se resserre avec le zoom (6,25 → 11,0), et « respire » d'un coup de mise au point à chaque brique */

      [7, 8, 9, 10].forEach(function (b, i) {

      });

      /* ---- altimètre : valeur = LKDV.altitude(temps du film) ; bande graduée = log de l'altitude (vitesse constante) ---- */
      const altEl = document.getElementById("ui-a2-alt-n");
      function fmtAlt(v) { return v >= 9.95 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
      const clock = { t: 6.0 };
      tl.fromTo(clock, { t: 6.0 }, { t: 11.5, duration: 5.5, ease: "none", immediateRender: false,
        onUpdate: function () { altEl.textContent = fmtAlt(LKDV.altitude(clock.t)); } }, T(6.0));
      altEl.textContent = fmtAlt(LKDV.altitude(6.0));
      const DECADE = 80; /* une décade d'altitude = 80 unités de bande */
      const travel = DECADE * Math.log10(408 / 1.5);
      tl.fromTo("#ui-a2-tape", { y: -10 }, { y: -10 - travel, duration: 5.5, ease: "none", immediateRender: true }, T(6.0));

      /* ---- une brique par seconde : détail (entrée ressort, lu en < 0,4 s, sortie à +0,75) + picto coché dans la pile ---- */

      U.countTo(tl, "#ui-a2-km", 0, 1322, T(7.0), 0.375, U.fmt.thousands);
      U.popOut(tl, "#ui-a2-d1", T(7.75), { dur: 0.12 });
      // 8,00 météo : la frise se peint jour par jour
      U.springIn(tl, "#ui-a2-d2", T(8.0), { dur: 0.25, from: 0.9, x: -14 });
      tl.fromTo("#ui-a2-d2 > .lk-ic", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.15, ease: U.springEase(0.75, 0.15), stagger: 0.025, immediateRender: true }, T(8.0) + 0.02);
      U.popOut(tl, "#ui-a2-d2", T(8.75), { dur: 0.12 });
      // 9,00 nuits : les vans et les tentes s'allument
      U.springIn(tl, "#ui-a2-d3", T(9.0), { dur: 0.25, from: 0.86, y: 10 });

      U.popOut(tl, "#ui-a2-d3", T(9.75), { dur: 0.12 });

      U.springIn(tl, "#ui-a2-d4", T(10.0), { dur: 0.25, from: 0.9, x: 14 });

      function inset(k) { const h = 12 + 52 * k + 6 * (k - 1); return "inset(0px 0px " + (PILE_H - h) + "px 0px round 32px)"; }
      U.springIn(tl, "#ui-a2-pile", T(7.0), { dur: 0.25, from: 0.8, origin: "50% 15%" });
      tl.fromTo("#ui-a2-pile", { clipPath: inset(1) }, { clipPath: inset(2), duration: 0.25, ease: U.springEase(0.8, 0.25), immediateRender: true }, T(8.0));
      tl.fromTo("#ui-a2-pile", { clipPath: inset(2) }, { clipPath: inset(3), duration: 0.25, ease: U.springEase(0.8, 0.25), immediateRender: false }, T(9.0));
      tl.fromTo("#ui-a2-pile", { clipPath: inset(3) }, { clipPath: inset(4), duration: 0.25, ease: U.springEase(0.8, 0.25), immediateRender: false }, T(10.0));
      [7, 8, 9, 10].forEach(function (b, i) {
        U.springIn(tl, "#ui-a2-t" + (i + 1), T(b), { dur: 0.25, zeta: 0.72, from: 0.5, y: -18 });
        U.springIn(tl, "#ui-a2-k" + (i + 1), T(b) + 0.25, { dur: 0.2, zeta: 0.6, from: 0.2 });
      });

      /* ---- 11,00 : la pile se replie en un point sage qui file au centre ; la grande coche s'ouvre, le réticule se referme dessus ---- */
      tl.fromTo("#ui-a2-pile-w", { scale: 1, opacity: 1 }, { scale: 0.08, opacity: 0, duration: 0.1, ease: "power3.in", immediateRender: false }, T(11.0));
      tl.fromTo("#ui-a2-fold", { x: 0, scale: 0.5, opacity: 0 }, { x: CX - (PILE_L + PILE_W / 2), scale: 1, opacity: 1, duration: 0.11, ease: "power2.inOut", immediateRender: true }, T(11.0));
      U.springIn(tl, "#ui-a2-check", T(11.0), { dur: 0.25, zeta: 0.7, from: 0.2, origin: "50% 50%" });

      const dust = Array.prototype.slice.call(root.querySelectorAll(".ui-a2-dust"));
      dust.forEach(function (el, i) {
        const h1 = LKDV.hash(i, 61), h2 = LKDV.hash(i, 62), h3 = LKDV.hash(i, 63), h4 = LKDV.hash(i, 64);
        let x0, y0;
        if (i < 16) { const c = i % 4, sx = c % 2 ? 1 : -1, sy = c > 1 ? 1 : -1, along = h1 * arm, onX = i < 8;
          x0 = CX + sx * (half - (onX ? along : 0)); y0 = CY + sy * (half - (onX ? 0 : along)); }
        else if (i < 24) { x0 = CX + (h1 - 0.5) * ALT_W * 0.8; y0 = ALT_T + ALT_H / 2 + (h2 - 0.5) * ALT_H * 0.6; }
        else { const a = h1 * Math.PI * 2, r = Math.sqrt(h2) * CK * 0.48; x0 = CX + Math.cos(a) * r; y0 = CY + Math.sin(a) * r; }
        const d = 4 + h3 * 5; /* diamètre 4–9 unités (6–14 px réels en 16:9) */
        el.style.width = d + "px"; el.style.height = d + "px"; el.style.left = (x0 - d / 2) + "px"; el.style.top = (y0 - d / 2) + "px";
        const ang = Math.atan2(y0 - CY, x0 - CX) + (h4 - 0.5) * 1.4, dist = 30 + h2 * 70;
        const delay = h4 * 0.04;
        tl.fromTo(el, { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist - 8, scale: 0.25, opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: true }, T(11.5) + delay);
      });

      /* durée de l'hôte (6 s) : de 11,75 à 12,0 plus rien */
      tl.fromTo({ v: 0 }, { v: 0 }, { v: 1, duration: 6, ease: "none", immediateRender: false }, 0);
      window.__timelines["ui-a2"] = tl;
    })();
  </script>
</template>
