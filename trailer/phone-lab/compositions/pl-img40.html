    (function () {

      var scr = document.getElementById('pl-img40-screen');
      var timing = { states: [{"sel":"#pl-img40-s1","from":0.3,"to":0.7}] };
      function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
      function pose(t) {

        var a = pose(t), b = pose(Math.max(0, t - 1 / 60));
