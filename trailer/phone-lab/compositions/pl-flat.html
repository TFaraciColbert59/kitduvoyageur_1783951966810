  <script>
    (function () {
      var D = 1.5, CX = 975.8, CY = 573.9;

      var scr = document.getElementById('pl-flat-screen');

      function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
      function pose(t) {

        cam.style.transformOrigin = CX + 'px ' + CY + 'px';
